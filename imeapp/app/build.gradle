plugins { id 'com.android.application' }

android {
    namespace 'tw.ajo.ime'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'tw.ajo.ime'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
