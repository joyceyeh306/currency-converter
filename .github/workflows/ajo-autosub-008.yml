name: Ajo Autosub 008 Android Build
on:
  push:
    branches: [ajo-autosub-008-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified 008 source (excludes signing secrets)
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib,io,tarfile
          encoded=''.join(pathlib.Path(f'subtitle-build-payload/v008full{i:02}.txt').read_text().strip() for i in range(9))
          binary=brotli.decompress(base64.b64decode(encoded,validate=True))
          digest='b94527b71b71b0845c13c28cb698e3b66cc0b42fa2131fb0f6d2a478fec2c7c2'
          assert hashlib.sha256(binary).hexdigest()==digest, 'source digest mismatch'
          target=pathlib.Path('subtitle-build-work')
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(binary)) as archive:
              archive.extractall(target,filter='data')
          assert not (target/'signing/ajo-autosub-signing.keystore').exists()
          gradle=(target/'app/build.gradle').read_text()
          assert "versionName '008'" in gradle and "versionCode 8" in gradle
          assert "applicationId 'tw.ajo.autosubtitles.next'" in gradle
          assert (target/'app/src/main/res/drawable-nodpi/ic_launcher.webp').is_file()
          print('008 verified source files reconstructed; private keystore absent')
          PY
      - name: Generate temporary DEBUG keystore, NOT the private 007 key
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=BuildTemporary,O=Ajo,C=TW" -noprompt
      - name: Execute 008 subtitle core tests
        run: |
          cd subtitle-build-work
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/ExportQuality.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java tests/CoreTests.java
          java -cp tests/build CoreTests
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Compile installable Android APK using Gradle
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Verify temporary build APK
        run: |
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|application-label:'
      - name: Upload temporary signed APK for re-signing with previous 007 key
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_008-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package exact source built on Actions (no private keystore)
        run: |
          cd subtitle-build-work
          rm -rf tests/build signing
          zip -qr ../ajo-autosub_008-source-public.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests README.md
      - name: Upload build source
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_008-source-public
          path: ajo-autosub_008-source-public.zip
          if-no-files-found: error
