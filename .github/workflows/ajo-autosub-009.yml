name: Ajo Autosub 009 Android Build
on:
  push:
    branches: [ajo-autosub-009-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct audited version 008 source
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib,io,tarfile
          encoded=''.join(pathlib.Path(f'subtitle-build-payload/v008full{i:02}.txt').read_text().strip() for i in range(9))
          binary=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(binary).hexdigest()=='b94527b71b71b0845c13c28cb698e3b66cc0b42fa2131fb0f6d2a478fec2c7c2'
          target=pathlib.Path('subtitle-build-work')
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(binary)) as archive:
              archive.extractall(target,filter='data')
          assert not (target/'signing/ajo-autosub-signing.keystore').exists()
          PY
      - name: Apply verified version 009 patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          encoded=''.join(pathlib.Path(f'subtitle-build-payload/v009patch{i}.txt').read_text().strip() for i in range(2))
          delta=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(delta).hexdigest()=='7028c6c2fd9979e14d5f7e629bc9dea70198b9d5813c303820f65acbeee616e6'
          pathlib.Path('v009.patch').write_bytes(delta)
          PY
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../v009.patch
          patch --batch -p1 < ../v009.patch
          grep -F "versionName '009'" app/build.gradle
          grep -F "versionCode 9" app/build.gradle
          grep -F "applicationId 'tw.ajo.autosubtitles.next'" app/build.gradle
          test -f app/src/main/java/tw/ajo/autosubtitles/NoiseReducer.java
          test -f app/src/main/java/tw/ajo/autosubtitles/SubtitleGeometry.java
          test -f app/src/main/res/drawable-nodpi/ic_launcher.webp
      - name: Create disposable build key (PRIVATE production key never uploaded)
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temporary009,O=Ajo,C=TW" -noprompt
      - name: Run v009 subtitle and noise processing tests
        run: |
          cd subtitle-build-work
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/ExportQuality.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java app/src/main/java/tw/ajo/autosubtitles/SubtitleGeometry.java app/src/main/java/tw/ajo/autosubtitles/NoiseReducer.java tests/CoreTests.java tests/NoiseAndGeometryTests.java
          java -cp tests/build CoreTests
          java -cp tests/build NoiseAndGeometryTests
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Compile version 009 installable APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK package and temporary signing
        run: |
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|application-label:"
      - name: Upload APK to be locally signed using preserved v008 credential
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_009-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package exact source without any private keystore
        run: |
          cd subtitle-build-work
          rm -rf tests/build signing
          zip -qr ../ajo-autosub_009-source-public.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests README.md
      - name: Upload build source archive
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_009-source-public
          path: ajo-autosub_009-source-public.zip
          if-no-files-found: error
