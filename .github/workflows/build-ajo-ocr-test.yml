name: Build Ajo OCR Test 001
on:
  push:
    branches: [ajo-ocr-test-001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AjoOCR_001.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AjoOCR_001.apk
          zip -r dist/AjoOCR_001_source.zip settings.gradle build.gradle gradle.properties app README.md .github -x 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: AjoOCR_001
          path: dist/
          if-no-files-found: error
