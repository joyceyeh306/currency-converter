          import base64,zlib
          from pathlib import Path
          payload=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-060/bundle.zlib.b64').read_text().strip()))
          root=Path('patches/ajo-autosub-060/generated')
          idx=0
          while idx<len(payload):
              end=payload.index(b'\n',idx);name=payload[idx:end].decode('utf-8');idx=end+1
              end=payload.index(b'\n',idx);count=int(payload[idx:end]);idx=end+1
              part=payload[idx:idx+count];idx+=count
              dest=root/name
              if '..' in dest.parts or dest.is_absolute():raise ValueError('unsafe path')
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(part)
              print('060 source:',name,len(part),flush=True)
          assert idx==len(payload)
