          package tw.ajo.autosubtitles;
          
          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          
          /**
           * 061: Trust the diarization service's utterance start/end, not character counts.
           *
           * The API supplies *segment* timestamps, not per-word timestamps. Splitting a
           * segment into timed pieces by number of Chinese characters invents timing and
           * can put a caption before/after the actual phrase. Keep one editable caption
           * per returned segment, retaining simultaneous speakers as separate captions.
           * When the model returns no second speaker, we never fabricate one.
           *
           * A legacy safety safeguard remains only for obviously suspect two-character
           * segments longer than eight seconds (see Version013Tests). Such a clip cannot
           * be rescued by unsupported word alignment; user timing review is still needed.
           */
          public final class SpeakerCaptionizer {
              public static final class Segment {
                  public final String speaker, text;
                  public final long fromMs, toMs;
                  public Segment(String speaker,String text,long fromMs,long toMs) {
                      this.speaker=speaker==null?"":speaker;
                      this.text=text==null?"":text;
                      this.fromMs=fromMs;this.toMs=toMs;
                  }
              }
              private SpeakerCaptionizer() {}
              public static List<Caption> convert(List<Segment> segments,long durationMs) {
                  ArrayList<Caption> out=new ArrayList<>();
                  if(segments==null || durationMs<=0)return out;
                  for(Segment s:segments) {
                      if(s==null || s.text.isBlank() || s.toMs<=s.fromMs || s.fromMs>=durationMs)continue;
                      long start=Math.max(0,s.fromMs),end=Math.min(durationMs,s.toMs);
                      if(end<=start)continue;
                      // Punctuation-only input must not produce a blank timed caption.
                      String text=CaptionPunctuation.strip(s.text).trim();
                      if(text.isEmpty())continue;
                      // Old 013 safety: a <=2 character phrase cannot linger for 11 seconds.
                      // Don't apply a duration rule to ordinary/long clauses or a 2-second
                      // phrase: that would be a fabricated end-time not supported by audio.
                      if(text.codePointCount(0,text.length())<=2 && end-start>8000) {
                          end=Math.min(end,start+1800);
                      }
                      Caption c=new Caption(start,end,text);
                      c.speaker=s.speaker;
                      out.add(c);
                  }
                  out.sort(Comparator.comparingLong(c->c.startMs));
                  return out;
              }
          }
