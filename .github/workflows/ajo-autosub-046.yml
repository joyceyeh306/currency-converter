name: Ajo Autosub 046 Readable Timing and Manual Merge
on:
  push:
    branches: [ajo-autosub-046-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 045 base and all prior regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-045.yml').read_text())['jobs']['build']['steps']
          done=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 NDK and native compiler':
                  done=True
                  break
              if 'run' in step:
                  print('045 stage:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert done and Path('subtitle-build-work/tests/Version045Tests.java').is_file()
          PYBASE
      - name: Apply 046 presentation-only timing and manual merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import brotli,base64
          data=brotli.decompress(base64.b64decode(Path('patches/ajo-autosub-046/bundle.br.b64').read_text().strip()))
          i=0;root=Path('patches/ajo-autosub-046/generated')
          while i<len(data):
              j=data.index(b'\n',i);name=data[i:j].decode();i=j+1
              j=data.index(b'\n',i);size=int(data[i:j]);i=j+1
              content=data[i:i+size];i+=size
              path=root/name
              assert '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
              print('046 source:',name,len(content),flush=True)
          assert i==len(data)
          PYBUNDLE
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-046/generated/046.patch
          patch --batch -p1 < ../patches/ajo-autosub-046/generated/046.patch
          cp ../patches/ajo-autosub-046/generated/app/src/main/java/tw/ajo/autosubtitles/SubtitleReadability046.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-046/generated/tests/Version046Tests.java tests/
          cp ../patches/ajo-autosub-046/generated/CHANGELOG_046.md .
          grep -F 'versionCode 46' app/build.gradle
          grep -F "versionName '046'" app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Test speech-timing preservation, readable tails, overlap, preview and SRT
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build046
          javac -encoding UTF-8 -d tests/build046 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SubtitleReadability046.java app/src/main/java/tw/ajo/autosubtitles/SubtitleLayers.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java tests/Version046Tests.java
          java -cp tests/build046 Version046Tests
      - name: Install Android SDK 36 and ARM64 native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Temporary CI signing key only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Temp046,O=Ajo,C=TW' -noprompt
      - name: Compile 046 ARM64 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
      - name: Verify compiled 046 and collect only non-private binaries
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='46'.*versionName='046'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_046-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and public signer tool
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-046-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5
