name: Deploy Ajo Where Pages

on:
  push:
    branches: [ajo-location-v1]
    paths:
      - 'viewer/**'
      - '.github/workflows/deploy-ajo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
