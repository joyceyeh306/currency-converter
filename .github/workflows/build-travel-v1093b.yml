name: Build Travel Notebook v1.0.93

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-travel-v1093b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CERT_SHA256: "a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
      PROJECT_DIR: "/tmp/work/ajo-travel-notebook-v1.0.93-source"

    steps:
      - name: Download verified v1.0.92 release artifact
        uses: actions/download-artifact@v4
        with:
          name: ajo-travel-notebook-v1.0.92-release
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joyceyeh306/currency-converter
          run-id: 37639132898

      - name: Restore v1.0.92 exact source
        shell: bash
        run: |
          set -euo pipefail
          test -f input/ajo-travel-notebook-v1.0.92-source.zip
          rm -rf /tmp/work && mkdir -p /tmp/work
          unzip -q input/ajo-travel-notebook-v1.0.92-source.zip -d /tmp/work
          test -d /tmp/work/ajo-travel-notebook-v1.0.92-source
          mv /tmp/work/ajo-travel-notebook-v1.0.92-source "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app.js"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Apply v1.0.93 global summary navigation patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          app=root/'app.js'
          idx=root/'app/src/main/assets/index.html'
          build=root/'app/build.gradle'
          readme=root/'SOURCE_MASTER_README.txt'

          def de(s):
              return s.replace('§', chr(96)).replace('¤', '$')

          js=app.read_text()
          lines=js.splitlines()

          helper1=de(r'''function openTripSection(tid,tab){const t=tripById(tid);if(!t)return;data.currentTripId=tid;route={tab,tripId:tid,dayId:null,spendOverview:false};if(tab==='alt')altFilter='全部';saveData();render()}''')
          helper2=de(r'''function globalTripSummaryCard(t,tab,countText,emptyText,kind){return §<article class="card global-trip-summary ¤{kind||''}" onclick="openTripSection('¤{t.id}','¤{tab}')"><div class="global-trip-summary-main"><div class="global-trip-summary-name">¤{esc(t.name)}</div><div class="global-trip-summary-sub">¤{esc(emptyText)}</div></div><div class="global-trip-summary-count">¤{esc(countText)}</div><div class="global-trip-summary-arrow">›</div></article>§}''')
          alt_line=de(r'''function renderAlt(){const scoped=route.tripId?tripById(route.tripId):null;const renderList=t=>{t.alternatives=t.alternatives||[];const list=t.alternatives.filter(a=>altFilter==='全部'||a.type===altFilter);if(!list.length)return §<div class="empty">¤{altFilter==='全部'?'還沒有備選地點':'這個分類目前沒有備選地點'}</div>§;return §<section class="itinerary alt-itinerary">¤{list.map(a=>{const status=a.status==='visited'?'已去':a.scheduledDate?§已排入 ¤{fmtDate(a.scheduledDate)}§:'';const detail=[status,a.area,a.note].filter(Boolean).join('・');return §<div class="item alt-item item-tappable" onclick="viewAlt('¤{a.id}')"><div class="time alt-time">¤{esc(a.type||'其他')}</div><div class="item-main"><div class="item-title">¤{esc(a.title)}</div>¤{detail?§<div class="item-note" title="¤{esc(detail)}">¤{esc(detail)}</div>§:''}</div></div>§}).join('')}</section>§};const filters=§<div class="alt-filter">¤{['全部',...altTypes].map(x=>§<button class="alt-chip ¤{altFilter===x?'on':''}" onclick="setAltFilter('¤{x}')">¤{x}</button>§).join('')}</div>§;if(scoped){¤('#screen').innerHTML=topbar('備選地點',false)+§<main class="content">¤{filters}¤{renderList(scoped)}</main><button class="fab" onclick="newAlt('¤{scoped.id}')">＋</button>§;return}if(!data.trips.length){¤('#screen').innerHTML=topbar('備選地點',false)+§<main class="content"><div class="empty">請先新增一趟旅程</div></main>§;return}const cards=data.trips.map(t=>{const count=(t.alternatives||[]).length;return globalTripSummaryCard(t,'alt',§¤{count} 個§,count?'點一下查看這趟旅程的備選地點':'尚未建立備選地點','summary-alt')}).join('');¤('#screen').innerHTML=topbar('備選地點',false)+§<main class="content global-summary-list">¤{cards}</main>§}''')
          memo_global=de(r'''if(!data.trips.length){¤('#screen').innerHTML=topbar('備忘',false)+§<main class="content"><div class="empty">請先新增一趟旅程</div></main>§;return}¤('#screen').innerHTML=topbar('備忘',false)+§<main class="content global-summary-list">¤{data.trips.map(t=>§<article class="card global-trip-summary summary-memo" onclick="openTripSection('¤{t.id}','memo')"><div class="global-trip-summary-main"><div class="global-trip-summary-name">¤{esc(t.name)}</div><div class="global-trip-summary-sub memo-summary-preview">¤{t.memo?esc(t.memo):'尚未建立備忘'}</div></div><div class="global-trip-summary-count">¤{t.memo?'已有備忘':'0'}</div><div class="global-trip-summary-arrow">›</div></article>§).join('')}</main>§}''')
          reminder_line=de(r'''function renderReminderTab(){const scoped=route.tripId?tripById(route.tripId):null;const listHtml=t=>{const arr=reminderScopeRows(t);return arr.length?§<div class="reminder-page-list">¤{arr.map(r=>§<div class="reminder-page-row"><div class="reminder-page-main"><div class="reminder-page-title">¤{esc(r.title||'旅行提醒')}</div><div class="reminder-page-meta">¤{fmtDateTime(r.at)}・¤{reminderTargetText(r)}</div></div><button class="tiny" onclick="editReminderFromPage('¤{t.id}','¤{r.id}')">編輯</button></div>§).join('')}</div>§:§<div class="empty">尚未設定提醒</div>§};if(scoped){¤('#screen').innerHTML=topbar('提醒',false)+§<main class="content">¤{listHtml(scoped)}</main><button class="fab" onclick="newReminderFromPage('¤{scoped.id}')">＋</button>§;return}if(!data.trips.length){¤('#screen').innerHTML=topbar('提醒',false)+§<main class="content"><div class="empty">請先新增一趟旅程</div></main>§;return}const cards=data.trips.map(t=>{const count=reminderScopeRows(t).length;return globalTripSummaryCard(t,'reminder',§¤{count} 個§,count?'點一下查看這趟旅程的提醒':'尚未設定提醒','summary-reminder')}).join('');¤('#screen').innerHTML=topbar('提醒',false)+§<main class="content global-summary-list">¤{cards}</main>§}''')
          orphan_line=de(r'''async function showOrphanAttachments(){const all=await getAllAttachments(),owners=attachmentOwnerIndex(),orphans=all.filter(a=>!owners.has(a.itemId));if(!orphans.length)return appAlert('目前沒有未分類附件');dlg('未分類附件',§<div class="attachment-orphan-list">¤{orphans.map(a=>attachHtml(a)).join('')}</div>§,§<button class="primary" onclick="closeDlg()">關閉</button>§)}''')
          attachment_line=de(r'''async function renderAttachmentTab(){const screen=¤('#screen');screen.innerHTML=topbar('附件',false)+§<main class="content"><div class="empty">正在讀取附件…</div></main>§;const all=await getAllAttachments();if(route.tab!=='attachments')return;const owners=attachmentOwnerIndex(),byTrip=new Map(),orphans=[];for(const a of all){const o=owners.get(a.itemId);if(!o){orphans.push(a);continue}if(!byTrip.has(o.tripId))byTrip.set(o.tripId,new Map());const m=byTrip.get(o.tripId);if(!m.has(a.itemId))m.set(a.itemId,{owner:o,files:[]});m.get(a.itemId).files.push(a)}const scoped=route.tripId?tripById(route.tripId):null;if(scoped){const rows=[...(byTrip.get(scoped.id)?.values()||[])];screen.innerHTML=topbar('附件',false)+§<main class="content">¤{rows.length?rows.map(r=>attachmentOverviewRow(r.owner,r.files)).join(''):'<div class="empty">這趟旅程目前沒有附件。可從證件、行程、住宿、交通／票券或備選地點加入。</div>'}</main>§;return}if(!data.trips.length&&!orphans.length){screen.innerHTML=topbar('附件',false)+§<main class="content"><div class="empty">請先新增一趟旅程</div></main>§;return}const cards=(data.trips||[]).map(t=>{const rows=[...(byTrip.get(t.id)?.values()||[])],count=rows.reduce((n,r)=>n+r.files.length,0);return globalTripSummaryCard(t,'attachments',§¤{count} 個§,count?'點一下查看這趟旅程的附件':'尚無附件','summary-attachment')}).join('');const orphanCard=orphans.length?§<article class="card global-trip-summary summary-attachment orphan-summary" onclick="showOrphanAttachments()"><div class="global-trip-summary-main"><div class="global-trip-summary-name">未分類附件</div><div class="global-trip-summary-sub">找不到所屬旅程的附件</div></div><div class="global-trip-summary-count">¤{orphans.length} 個</div><div class="global-trip-summary-arrow">›</div></article>§:'';screen.innerHTML=topbar('附件',false)+§<main class="content global-summary-list">¤{cards}¤{orphanCard}</main>§}''')

          out=[]
          inserted=False
          replaced={'alt':False,'memo':False,'reminder':False,'attachment':False}
          for line in lines:
              if line.startswith("function switchTab(tab){"):
                  out.append(line)
                  out.append(helper1)
                  out.append(helper2)
                  inserted=True
              elif line.startswith("function renderAlt(){"):
                  out.append(alt_line); replaced['alt']=True
              elif line.startswith("if(!data.trips.length){$('#screen').innerHTML=topbar('備忘'"):
                  out.append(memo_global); replaced['memo']=True
              elif line.startswith("function renderReminderTab(){"):
                  out.append(reminder_line); replaced['reminder']=True
              elif line.startswith("async function renderAttachmentTab(){"):
                  out.append(orphan_line)
                  out.append(attachment_line)
                  replaced['attachment']=True
              else:
                  out.append(line)

          if not inserted or not all(replaced.values()):
              raise SystemExit(f'patch targets missing inserted={inserted} replaced={replaced}')

          js='\n'.join(out)+'\n'
          js=js.replace('自助旅行筆記 v1.0.92</strong><small>正式 APK 版','自助旅行筆記 v1.0.93</strong><small>正式 APK 版',1)
          app.write_text(js)

          b=build.read_text().replace('versionCode 192','versionCode 193',1).replace("versionName '1.0.92'","versionName '1.0.93'",1)
          build.write_text(b)

          html=idx.read_text()
          html=html.replace('<title>自助旅行筆記 v1.0.92</title>','<title>自助旅行筆記 v1.0.93</title>',1)
          anchor='.memo-overview-card{background:#F5F1FA;border-color:#E3D9EF;border-left-color:#B7A1D3}'
          extra='''\n/* v1.0.93: global tabs are trip-level summaries; details open only after choosing a trip. */
.global-summary-list{display:flex;flex-direction:column;gap:12px}
.global-trip-summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px 14px 14px 16px;cursor:pointer;border-left:7px solid var(--yellow);min-height:92px}
.global-trip-summary-main{min-width:0}.global-trip-summary-name{font-size:1rem;line-height:1.35;margin-bottom:5px}.global-trip-summary-sub{font-size:.82rem;color:var(--muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.global-trip-summary-count{font-size:.8rem;color:var(--muted);white-space:nowrap}.global-trip-summary-arrow{font-size:1.55rem;line-height:1;color:#8a8475;margin-left:1px}.global-trip-summary:active{transform:scale(.995);filter:brightness(.992)}
.global-trip-summary.summary-alt{background:#FFF9E7;border-color:#E8DFAF;border-left-color:#F0C84A}
.global-trip-summary.summary-memo{background:#F5F1FA;border-color:#E3D9EF;border-left-color:#B7A1D3}
.global-trip-summary.summary-reminder{background:#FFF6D6;border-color:#EADDA4;border-left-color:#E9C14B}
.global-trip-summary.summary-attachment{background:#F1F8FB;border-color:#D9E9F0;border-left-color:#9BC7D9}
.memo-summary-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-orphan-list{display:grid;gap:9px}
'''
          if anchor not in html:
              raise SystemExit('CSS anchor missing')
          html=html.replace(anchor,anchor+extra,1)
          m=re.search(r'(<script(?:\s[^>]*)?>)(.*?)(</script>)',html,re.S|re.I)
          if not m:
              raise SystemExit('inline script missing')
          html=html[:m.start(2)] + js + html[m.end(2):]
          idx.write_text(html)

          header='''自助旅行筆記 v1.0.93 總覽入口修正版
基底：v1.0.92 正式版。

本版只整合 2026-10-07 討論確認的總覽頁調整：
1. 總備選：只顯示每趟旅程的備選總數，點旅程後進入該旅程的備選頁。
2. 總提醒：只顯示每趟旅程的提醒總數，點旅程後進入該旅程的提醒頁。
3. 總附件：只顯示每趟旅程的附件總數，點旅程後進入該旅程的附件頁；未分類附件另保留摘要入口。
4. 總備忘：顯示各旅程備忘摘要，點擊後直接進入該旅程的完整備忘頁，不再跳小型編輯視窗。
5. 旅程內頁功能與 v1.0.92 的備忘閱讀／編輯模式維持不變。
6. package 維持 tw.ajo.travelnotebook，versionCode 193，versionName 1.0.93。

'''
          readme.write_text(header+readme.read_text())
          PY

      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -q "applicationId 'tw.ajo.travelnotebook'" app/build.gradle
          grep -q "versionCode 193" app/build.gradle
          grep -q "versionName '1.0.93'" app/build.gradle
          grep -q "function openTripSection" app.js
          grep -q "function globalTripSummaryCard" app.js
          grep -q "summary-alt" app.js
          grep -q "summary-memo" app.js
          grep -q "summary-reminder" app.js
          grep -q "summary-attachment" app.js
          grep -q "showOrphanAttachments" app.js
          grep -q 'id="memoArea" readonly' app/src/main/assets/index.html
          grep -q "toggleMemoEdit" app/src/main/assets/index.html
          grep -q "const APPKEY='ajo_travel_notebook_v1'" app/src/main/assets/index.html
          grep -q "Android.shareText" app/src/main/assets/index.html
          grep -q "Android.getReceiptDataUrl" app/src/main/assets/index.html
          grep -q "Android.restoreReceiptPhoto" app/src/main/assets/index.html
          grep -q "pausedBySkip" app/src/main/assets/index.html
          grep -q "if(t?.completed)return'past'" app/src/main/assets/index.html
          grep -q "RECEIVE_BOOT_COMPLETED" app/src/main/AndroidManifest.xml
          grep -q "TIMEZONE_CHANGED" app/src/main/AndroidManifest.xml
          grep -q "MY_PACKAGE_REPLACED" app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          js=Path('app.js').read_text()
          m=re.search(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not m: raise SystemExit('inline script not found')
          if m.group(1)!=js: raise SystemExit('app.js and inline script differ')
          Path('/tmp/index.js').write_text(js)
          PY
          node --check /tmp/index.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf .gradle build app/build ~/.gradle/caches/build-cache-* || true
          gradle --no-daemon --no-build-cache --rerun-tasks clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > /tmp/classes-unsigned.dex
          test -s /tmp/classes-unsigned.dex

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          mkdir -p "$GITHUB_WORKSPACE/out"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o /tmp/testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o /tmp/testkey.x509.pem
          "$BT/zipalign" -f -p 4 "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" "$GITHUB_WORKSPACE/out/aligned.apk"
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93.apk" "$GITHUB_WORKSPACE/out/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93.apk" | tee "$GITHUB_WORKSPACE/out/signature.txt"
          CERT_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$GITHUB_WORKSPACE/out/signature.txt" | head -1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93.apk" | tee "$GITHUB_WORKSPACE/out/badging.txt"
          grep -q "package: name='tw.ajo.travelnotebook' versionCode='193' versionName='1.0.93'" "$GITHUB_WORKSPACE/out/badging.txt"
          unzip -p "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93.apk" classes.dex > /tmp/classes-signed.dex
          cmp /tmp/classes-unsigned.dex /tmp/classes-signed.dex
          unzip -t "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93.apk" >/dev/null
          {
            echo "PACKAGE=tw.ajo.travelnotebook"
            echo "VERSION_NAME=1.0.93"
            echo "VERSION_CODE=193"
            echo "SIGNER_CERT_SHA256=$CERT_SHA"
            echo "CLEAN_BUILD=PASS"
            echo "GLOBAL_ALT_SUMMARY=PASS"
            echo "GLOBAL_MEMO_DIRECT_LINK=PASS"
            echo "GLOBAL_REMINDER_SUMMARY=PASS"
            echo "GLOBAL_ATTACHMENT_SUMMARY=PASS"
            echo "MEMO_READING_MODE=PASS"
            echo "NATIVE_SHARE=PASS"
            echo "RECEIPT_BACKUP_RESTORE_BRIDGE=PASS"
            echo "REMINDER_RESCHEDULE_BOOT_TIMEZONE_UPDATE=PASS"
            echo "COMPLETED_TRIP_REMINDER_PAUSE=PASS"
          } > "$GITHUB_WORKSPACE/out/build-verification.txt"

      - name: Package exact source used
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/work
          zip -qr "$GITHUB_WORKSPACE/out/ajo-travel-notebook-v1.0.93-source.zip" ajo-travel-notebook-v1.0.93-source

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajo-travel-notebook-v1.0.93-release
          path: out/
          if-no-files-found: error
          retention-days: 1
