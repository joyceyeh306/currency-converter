name: Ajo Autosub 044 Noisy Speech Anchored Recovery
on:
  push:
    branches: [ajo-autosub-044-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 043 base and run historical tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-043.yml').read_text())['jobs']['build']['steps']
          done=False
          for step in steps:
              name=step.get('name','')
              if name=='Install Android SDK and ARM64 native toolchain':
                  done=True
                  break
              if 'run' in step:
                  print('043 stage:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert done and Path('subtitle-build-work/tests/Version043Tests.java').is_file()
          PYBASE
      - name: Apply 044 guarded wind/impulse recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import base64,brotli
          data=brotli.decompress(base64.b64decode(Path('patches/ajo-autosub-044/bundle.br.b64').read_text().strip()))
          i=0
          output=Path('patches/ajo-autosub-044/generated')
          while i<len(data):
              n=data.index(b'\n',i);name=data[i:n].decode();i=n+1
              n=data.index(b'\n',i);size=int(data[i:n]);i=n+1
              raw=data[i:i+size];i+=size
              p=output/name
              assert '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
              print('044 source:',name,len(raw))
          assert i==len(data)
          PYBUNDLE
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-044/generated/044.patch
          patch --batch -p1 < ../patches/ajo-autosub-044/generated/044.patch
          for name in SpeechBandActivity PcmWindFilter044 WhisperRecovery044; do
            cp ../patches/ajo-autosub-044/generated/app/src/main/java/tw/ajo/autosubtitles/$name.java app/src/main/java/tw/ajo/autosubtitles/
          done
          cp ../patches/ajo-autosub-044/generated/tests/Version044Tests.java tests/
          cp ../patches/ajo-autosub-044/generated/CHANGELOG_044.md .
          grep -F 'versionCode 44' app/build.gradle
          grep -F "versionName '044'" app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Test 044 timing guards, sound anchors and original PCM preservation
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build044
          javac -encoding UTF-8 -d tests/build044 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SpeechBandActivity.java app/src/main/java/tw/ajo/autosubtitles/PcmWindFilter044.java app/src/main/java/tw/ajo/autosubtitles/WhisperRecovery044.java tests/Version044Tests.java
          java -cp tests/build044 Version044Tests
      - name: Install Android SDK 36 NDK and native compiler
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Generate disposable CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Temp044,O=Ajo,C=TW' -noprompt
      - name: Compile ARM64 Android 044 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and preserve only public build intermediates
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='44'.*versionName='044'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_044-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and signature tool; never private user keystore
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-044-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5