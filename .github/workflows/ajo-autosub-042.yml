name: Ajo Autosub 042 Overlap and Phrase Review
on:
  push:
    branches: [ajo-autosub-042-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild verified 041 from audited 040 and run all prior tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-041.yml').read_text())['jobs']['build']['steps']
          done=False
          for step in steps:
              name=step.get('name','')
              if name=='Install native SDK 36':
                  done=True
                  break
              if 'run' in step:
                  print('041 base:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert done and Path('subtitle-build-work/tests/Version041Tests.java').is_file()
          PYBASE
      - name: Apply 042 overlap and opt-in timed phrase patches
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-042/042.patch
          patch --batch -p1 < ../patches/ajo-autosub-042/042.patch
          cp ../patches/ajo-autosub-042/WhisperReviewCandidates.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-042/Version042Tests.java tests/
          cp ../patches/ajo-autosub-042/CHANGELOG_042.md .
          grep -F "versionCode 42" app/build.gradle
          grep -F "versionName '042'" app/build.gradle
      - name: Verify overlapping intervals and protected original captions
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build042
          javac -encoding UTF-8 -d tests/build042 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/AndroidCaptionTiming.java app/src/main/java/tw/ajo/autosubtitles/WhisperReviewCandidates.java tests/Version042Tests.java
          java -cp tests/build042 Version042Tests
      - name: Install Android SDK 36 and ARM64 native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Create disposable CI signing key, never upload private original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temp042,O=Ajo,C=TW" -noprompt
      - name: Compile Android 042 ARM64 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Verify 042 package and prepare private local signing
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='42'.*versionName='042'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_042-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary binary and apksigner, no original signing key
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-042-temp-and-signer
          path: build-out/
          retention-days: 5
          if-no-files-found: error
