name: Ajo Autosub 073 Taiwanese Oral Fidelity A-B
on:
  push:
    branches: [ajo-autosub-073-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 071 source through its identical steps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-071.yml').read_text())['jobs']['build']['steps']
          stop=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 NDK and ARM64 compiler':
                  stop=True
                  break
              if 'run' in step:
                  print('071:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert stop and Path('subtitle-build-work/app/src/main/java/tw/ajo/autosubtitles/WhisperConfidenceTrace071.java').is_file()
          PYBASE
      - name: Apply 072 diagnostic-only patch and run regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY072'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-072/bundle.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='710f19ef2467952ab7f578ad37837d11e10c0a25f30fa99dd0abd4dd644c1dd6'
          Path('subtitle-build-work/072.patch').write_bytes(raw)
          PY072
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 072.patch
          patch --batch -p1 < 072.patch
          grep -F 'versionCode 72' app/build.gradle
          grep -F "versionName '072'" app/build.gradle
          mkdir -p tests/build072
          javac -encoding UTF-8 -d tests/build072 \
            app/src/main/java/tw/ajo/autosubtitles/WhisperConfidenceTrace071.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperDualReport072.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperNative.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperSegments.java \
            app/src/main/java/tw/ajo/autosubtitles/Caption.java \
            app/src/main/java/tw/ajo/autosubtitles/CaptionPunctuation.java \
            tests/Version072Tests.java
          java -cp tests/build072 Version072Tests
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Apply 073 oral-faithfulness A-B diagnostics and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY073'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-073/bundle.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='03c0923ca1a773e761f0ae2c54fd58c5482c24c685eb5518fc43bcced3277682'
          Path('subtitle-build-work/073.patch').write_bytes(raw)
          PY073
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 073.patch
          patch --batch -p1 < 073.patch
          grep -F 'versionCode 73' app/build.gradle
          grep -F "versionName '073'" app/build.gradle
          mkdir -p tests/build073
          javac -encoding UTF-8 -d tests/build073 \
            app/src/main/java/tw/ajo/autosubtitles/WhisperConfidenceTrace071.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperDualReport072.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperPromptReport073.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperNative.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperSegments.java \
            app/src/main/java/tw/ajo/autosubtitles/Caption.java \
            app/src/main/java/tw/ajo/autosubtitles/CaptionPunctuation.java \
            tests/Version073Tests.java
          java -cp tests/build073 Version073Tests
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Install Android SDK 36 ARM64 tools
        shell: bash
        run: |
          set -eu
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || true
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Temp073,O=Ajo,C=TW' -noprompt
      - name: Compile 073 ARM64 Android APK
        run: gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
      - name: Verify 073 version and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='73'.*versionName='073'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_073-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and apksigner
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-073-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5
