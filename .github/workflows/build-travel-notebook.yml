name: Build Travel Notebook APK

on:
  push:
    branches: [ travel-notebook-build ]
    paths:
      - 'travel_build/**'
      - '.github/workflows/build-travel-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore travel notebook source
        run: |
          cat travel_build/part*.b64 | tr -d '\n' | base64 -d > /tmp/ajo.zip
          mkdir -p /tmp/ajo
          unzip -q /tmp/ajo.zip -d /tmp/ajo
          test -f /tmp/ajo/ajo_build_min/settings.gradle

      - name: Build debug APK
        working-directory: /tmp/ajo/ajo_build_min
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajo-travel-notebook-apk
          path: /tmp/ajo/ajo_build_min/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to build branch
        run: |
          mkdir -p travel_output
          cp /tmp/ajo/ajo_build_min/app/build/outputs/apk/debug/app-debug.apk travel_output/ajo-travel-notebook-v1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- travel_output/ajo-travel-notebook-v1.0.0.apk
          git commit -m "Publish travel notebook APK v1.0.0" || exit 0
          git push origin HEAD:travel-notebook-build
