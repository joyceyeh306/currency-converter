name: Build Photo Compare Release Kit
on:
  push:
    branches: [tmp-photo-compare-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: unzip -o photo_compare_source.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Collect release kit
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: plant-photo-compare-release-kit
          path: |
            app-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
