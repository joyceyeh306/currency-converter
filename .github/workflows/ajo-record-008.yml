name: Ajo Record 008 Android Speech and Safe Stop
on:
  push:
    branches: [ajo-record-008-build]
    paths:
      - '.github/workflows/ajo-record-008.yml'
      - 'patches/ajo-record-008/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the verified 007 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-record-007.yml').read_text())['jobs']['build']['steps']
          found=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 and ARM64 NDK':
                  found=True
                  break
              if 'run' in step:
                  print('Restore 007:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert found and Path('subtitle-build-work/app/src/main/java/tw/ajo/record/MainActivity.java').is_file()
          PY
      - name: Apply 008 safe-stop and Android system recognition, test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,brotli,hashlib
          from pathlib import Path
          raw=brotli.decompress(base64.b64decode(Path('patches/ajo-record-008/bundle008.br.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='7df57e685a18cd4138bf3c88e4f6ee18e984e6973085e434364a3a544027706b'
          Path('subtitle-build-work/008.patch').write_bytes(raw)
          PY
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 008.patch
          patch --batch -p1 < 008.patch
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('app/src/main/java/tw/ajo/record/RecordingService.java')
          s=p.read_text()
          old='if(WhisperModel.verified(model)&&fallbackStarted.compareAndSet(false,true))recognizer.submit(RecordingService.this::liveRecognizeLoop);'
          new=chr(10).join([
              'boolean ready=false;',
              '                    try{ready=WhisperModel.verified(model);}catch(Exception ignored){}',
              '                    if(ready&&fallbackStarted.compareAndSet(false,true))recognizer.submit(RecordingService.this::liveRecognizeLoop);'
          ])
          assert s.count(old)==1,'Expected exactly one model-check branch'
          p.write_text(s.replace(old,new))
          PYFIX
          grep -F 'versionCode 8' app/build.gradle
          grep -F "versionName '008'" app/build.gradle
          grep -F "applicationId 'tw.ajo.record'" app/build.gradle
          grep -F 'EXTRA_AUDIO_SOURCE' app/src/main/java/tw/ajo/record/SystemSpeech008.java
          grep -F 'SystemSpeech008' app/src/main/java/tw/ajo/record/RecordingService.java
          if grep -F 'runFullQuality066(model,lastPcm' app/src/main/java/tw/ajo/record/RecordingService.java; then
            echo "Unexpected old full-recording overwrite" >&2
            exit 1
          fi
          test ! -f signing/ajo-autosub-signing.keystore
          mkdir -p tests/build008
          javac -encoding UTF-8 -d tests/build008 \
            app/src/main/java/tw/ajo/record/SystemTranscript008.java \
            app/src/main/java/tw/ajo/record/TranscriptSafety008.java \
            ../patches/ajo-record-008/TEST_008.java
          java -cp tests/build008 TEST_008
      - name: Install SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || true
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - name: Compile and verify 008 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='tw.ajo.record' versionCode='8' versionName='008'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-record_008-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
          sha256sum "$APK" > build-out/sha256.txt
      - name: Upload APK for private production signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-record-008-temp-and-signer
          path: build-out/
          retention-days: 7
          if-no-files-found: error
