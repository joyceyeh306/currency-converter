name: Build Travel Notebook APK Stable

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-travel-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout travel build branch
        uses: actions/checkout@v6
        with:
          ref: travel-notebook-build
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore travel notebook source
        run: |
          cat travel_build/part*.b64 | tr -d '\n' | base64 -d > /tmp/ajo.zip
          mkdir -p /tmp/ajo
          unzip -q /tmp/ajo.zip -d /tmp/ajo
          test -f /tmp/ajo/ajo_build_min/settings.gradle

      - name: Apply v1.0.1 baseline
        run: python3 travel_build/apply-v101.py

      - name: Apply v1.0.2 system bar fix and compact layout
        run: |
          python3 travel_build/apply-v102.py
          cp travel_build/ic_launcher_foreground_v102.xml /tmp/ajo/ajo_build_min/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Apply v1.0.3 JSON trip format
        run: python3 travel_build/apply-v103.py

      - name: Apply v1.0.4 tested UI, app name and larger icon
        run: |
          python3 -m py_compile travel_build/apply-v104.py
          python3 travel_build/apply-v104.py
          cp travel_build/ic_launcher_foreground_v104.xml /tmp/ajo/ajo_build_min/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Apply v1.0.5 multi-day ticket passes
        run: |
          python3 -m py_compile travel_build/apply-v105.py
          python3 travel_build/apply-v105.py
          grep -q "versionName '1.0.5'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function passesForDay' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q '票券／通行證' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html

      - name: Apply v1.0.6 travel workflow update
        run: |
          cat travel_build/v106gzpart* | tr -d '\n' | base64 -d | gunzip > /tmp/apply-v106.py
          python3 -m py_compile /tmp/apply-v106.py
          python3 /tmp/apply-v106.py
          python3 -m py_compile travel_build/apply-v106b.py
          python3 travel_build/apply-v106b.py
          grep -q "versionName '1.0.6'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q '交通／票券' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function openReminders' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function openTripMemo' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'class AttachmentViewerActivity' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/AttachmentViewerActivity.java
          grep -q 'class ReminderReceiver' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/ReminderReceiver.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index.js

      - name: Apply v1.0.7 icon size fix
        run: |
          python3 -m py_compile travel_build/apply-v107.py
          python3 travel_build/apply-v107.py
          cp travel_build/ic_launcher_foreground_v107.xml /tmp/ajo/ajo_build_min/app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q "versionName '1.0.7'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'android:scaleX="0.96"' /tmp/ajo/ajo_build_min/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Apply v1.0.8 UX and alternate places
        run: |
          python3 -m py_compile travel_build/apply-v108a.py travel_build/apply-v108b.py travel_build/apply-v108c.py
          python3 travel_build/apply-v108a.py
          python3 travel_build/apply-v108b.py
          python3 travel_build/apply-v108c.py
          grep -q "versionName '1.0.8'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q "旅程','trips'.*備選.*備忘.*字卡.*匯率" /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function renderAlt' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function finishCosts' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function appAlert' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          if grep -q 'navigator.clipboard' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html; then exit 1; fi
          if grep -qE '(^|[^A-Za-z])alert\(' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v108.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v108.js

      - name: Apply v1.0.9 time wheel and expense read mode
        run: |
          python3 -m py_compile travel_build/apply-v109.py
          python3 travel_build/apply-v109.py
          grep -q "versionName '1.0.9'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function openTimeWheel' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function newCost' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'cost-card read-mode' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v109.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v109.js

      - name: Apply v1.0.10 inline time picker fix
        run: |
          python3 -m py_compile travel_build/apply-v110.py
          python3 travel_build/apply-v110.py
          grep -q "versionName '1.0.10'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function toggleInlineTimeWheel' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'id="inlineTimeWheel"' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          if grep -q 'function openTimeWheel' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html; then exit 1; fi
          if grep -q '<buttn' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v110.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v110.js

      - name: Apply v1.0.11 horizontal overflow and scroll fix
        run: |
          python3 -m py_compile travel_build/apply-v111.py
          python3 travel_build/apply-v111.py
          grep -q "versionName '1.0.11'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'overflow-x:hidden' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'grid-template-columns:minmax(0,1fr) 142px' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q '.topbar{position:relative' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v111.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v111.js

      - name: Apply v1.0.12 sticky day bar and expense width fix
        run: |
          python3 -m py_compile travel_build/apply-v112.py
          python3 travel_build/apply-v112.py
          grep -q "versionName '1.0.12'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q '.topbar.day-sticky{position:sticky' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q "daySticky=route.tab==='trips'&&route.dayId" /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'grid-template-columns:minmax(0,1fr) 116px' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'grid-template-columns:minmax(0,1fr) 106px' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v112.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v112.js

      - name: Apply v1.0.13 sticky header regression fix
        run: |
          python3 -m py_compile travel_build/apply-v113.py
          python3 travel_build/apply-v113.py
          grep -q "versionName '1.0.13'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'overflow-x:clip' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'body{touch-action:pan-y}' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q '.topbar.day-sticky{position:sticky' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v113.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v113.js

      - name: Apply v1.0.14 open active trip today on startup
        run: |
          python3 -m py_compile travel_build/apply-v114.py
          python3 travel_build/apply-v114.py
          grep -q "versionName '1.0.14'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function applyStartupRoute' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'applyStartupRoute();render();' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v114.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v114.js

      - name: Apply v1.0.15 receipt OCR
        run: |
          cat travel_build/v115afixpart* | tr -d '\n' | base64 -d > /tmp/apply-v115a.py
          cat travel_build/v115bpart* | tr -d '\n' | base64 -d > /tmp/apply-v115b.py
          python3 -m py_compile /tmp/apply-v115a.py /tmp/apply-v115b.py travel_build/apply-v115c.py travel_build/apply-v115d.py
          python3 /tmp/apply-v115a.py
          python3 /tmp/apply-v115b.py
          python3 travel_build/apply-v115c.py
          python3 travel_build/apply-v115d.py
          grep -q "versionName '1.0.15'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q "play-services-mlkit-text-recognition:19.0.1" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q "play-services-mlkit-text-recognition-korean:16.0.1" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' /tmp/ajo/ajo_build_min/app/src/main/AndroidManifest.xml
          grep -q 'android.useAndroidX=true' /tmp/ajo/ajo_build_min/gradle.properties
          grep -q 'function receiptOcrResult' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'scanReceipt(String source)' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v115.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v115.js

      - name: Apply v1.0.16 OPPO receipt picker fix
        run: |
          python3 -m py_compile travel_build/apply-v116.py
          python3 travel_build/apply-v116.py
          grep -q "versionName '1.0.16'" /tmp/ajo/ajo_build_min/app/build.gradle
          ! grep -q "\${iconSvg('camera')}<br>拍照收據" /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'setPackage("com.coloros.gallery3d")' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java
          grep -q 'Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v116.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v116.js

      - name: Apply v1.0.17 multi-receipt queue
        run: |
          python3 -m py_compile travel_build/apply-v117.py
          python3 travel_build/apply-v117.py
          grep -q "versionName '1.0.17'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function receiptGallerySelected' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function advanceReceiptQueue' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q '第 ${batchIndex} / ${batchTotal} 張' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE,true' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java
          grep -q 'scanReceiptUri(String uriText)' /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ajo/ajo_build_min/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/travel-index-v117.js').write_text(m.group(1))
          PY
          node --check /tmp/travel-index-v117.js

      - name: Apply v1.0.18 receipt parser fix
        run: |
          python3 -m py_compile travel_build/apply-v118.py travel_build/test-v118.py
          python3 travel_build/apply-v118.py
          grep -q "versionName '1.0.18'" /tmp/ajo/ajo_build_min/app/build.gradle
          grep -q 'function receiptAmountLabelScore' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          grep -q 'function receiptIdContext' /tmp/ajo/ajo_build_min/app/src/main/assets/index.html
          python3 travel_build/test-v118.py

      - name: Package v1.0.18 complete source master
        run: |
          cat > /tmp/ajo/ajo_build_min/SOURCE_MASTER_README.txt <<'EOF'
          自助旅行筆記 v1.0.18 完整原始母檔
          ==================================
          版本：1.0.18
          Android package：tw.ajo.travelnotebook

          這份 ZIP 是經過 v1.0.1～v1.0.18 所有修正後的「完整展開原始碼」，
          可直接當作下一個對話／下一版開發的唯一母版。
          不需要重新套用 travel_build 的歷史 patch 檔。

          新對話建議說法：
          「請以我上傳的『自助旅行筆記 v1.0.18 完整原始母檔』作為唯一母版，
          不要從舊 APK 或更早版本重建。先完整讀取原始碼後，再依我的新需求修改。」

          v1.0.8 主要狀態：
          - 底部：旅程｜備選｜備忘｜字卡｜匯率
          - 設定移至首頁右上角
          - 新增備選地點（可導航、加入行程、移到備選、附件）
          - 字卡移除無作用的剪貼簿按鈕
          - 原生 alert 已改為 App 內中文提示
          - 花費區改為閱讀模式：先顯示分類合計與今日總額，下方用較小字顯示每筆明細
          - 新增／編輯花費改用獨立視窗，刪除只在編輯畫面出現
          - 行程時間改為 24 小時制滾輪式時間選擇器
          - v1.0.10：時間滾輪改為直接內嵌在新增／編輯行程表單，不再開第二層底部視窗
          - v1.0.11：禁止整頁左右滑動；花費長備註固定在左欄最多兩行，不再壓到右側金額
          - v1.0.12：只有每日頁最上方黃色日期列固定；提醒／備忘／附件會正常捲走；花費備註仍維持兩行但可用寬度加大
          - v1.0.13：修正禁止左右滑動造成 sticky 日期列失效；改用 clip 阻止橫向移動，同時保留日期列固定
          - v1.0.14：App 真正啟動時若今天落在進行中的旅程內，直接開啟今天的每日行程；若該旅程今天尚未建立日期頁，則進入該旅程總覽
          - v1.0.15：花費區新增「收據」快速記帳；可拍照或從相簿選，使用 ML Kit 韓文＋拉丁文字 OCR，自動猜店名、分類與 1～3 個可能總金額，確認後才入帳；收據照片預設不保留，可自行勾選保留
          - v1.0.16：收據入口拿掉「拍照收據」前的相機圖示，讓兩個按鈕文字對齊；「從相簿選」在 OPPO／ColorOS 優先直接開啟 OPPO 相簿，而不是系統檔案選擇器
          - v1.0.17：「從相簿選」支援一次多選收據；App 會逐張 OCR、顯示第幾張／共幾張，儲存後自動進下一張；可略過單張或取消全部，最後顯示建立／略過統計
          - v1.0.18：重做收據金額與店名判讀；排除日期、電話、護照、卡號、核准號、條碼等非金額數字；退稅收據優先抓實付／ 승인금액／信用卡／Receive Amount；修正 Busan 被誤判成 bus 交通；新增藥局、ARTBOX、Olive Young、롯데、寢具等購物分類
          - 保留 v1.0.7 縮小後的桌面圖示
          - v1.0.6 的提醒、內建 PDF/圖片附件檢視、交通／票券等功能均保留
          EOF
          cd /tmp/ajo
          zip -qr /tmp/ajo-travel-notebook-v1.0.18-source.zip ajo_build_min
          test -s /tmp/ajo-travel-notebook-v1.0.18-source.zip

      - name: Build unsigned release APK
        id: buildapk
        continue-on-error: true
        working-directory: /tmp/ajo/ajo_build_min
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/ajo-build.log

      - name: Sign APK with stable AOSP test key
        id: signapk
        if: steps.buildapk.outcome == 'success'
        continue-on-error: true
        run: |
          curl -fsSL --retry 5 --retry-all-errors 'https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8' -o /tmp/testkey.pk8
          curl -fsSL --retry 5 --retry-all-errors 'https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem' -o /tmp/testkey.x509.pem
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 /tmp/ajo/ajo_build_min/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ajo-v118-aligned.apk
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out /tmp/ajo-travel-notebook-v1.0.18.apk /tmp/ajo-v118-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/ajo-travel-notebook-v1.0.18.apk | tee /tmp/apk-signature.txt

      - name: Publish result to travel branch
        if: always()
        run: |
          mkdir -p travel_output
          printf 'build=%s\nsign=%s\nsource=%s\nversion=1.0.18\n' '${{ steps.buildapk.outcome }}' '${{ steps.signapk.outcome }}' '${{ github.sha }}' > travel_output/status.txt
          if [ -f /tmp/ajo-build.log ]; then tail -n 250 /tmp/ajo-build.log > travel_output/build-log.txt; fi
          if [ -f /tmp/apk-signature.txt ]; then cat /tmp/apk-signature.txt > travel_output/signature.txt; fi
          if [ -f /tmp/ajo/ajo_build_min/app/src/main/assets/index.html ]; then
            cp /tmp/ajo/ajo_build_min/app/src/main/assets/index.html travel_output/current-index.html
          fi
          if [ -f /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java ]; then
            cp /tmp/ajo/ajo_build_min/app/src/main/java/tw/ajo/travelnotebook/MainActivity.java travel_output/current-MainActivity.java
          fi
          if [ -f /tmp/ajo/ajo_build_min/app/build.gradle ]; then
            cp /tmp/ajo/ajo_build_min/app/build.gradle travel_output/current-build.gradle
          fi
          if [ -f /tmp/ajo/ajo_build_min/app/src/main/AndroidManifest.xml ]; then
            cp /tmp/ajo/ajo_build_min/app/src/main/AndroidManifest.xml travel_output/current-AndroidManifest.xml
          fi
          if [ -f /tmp/ajo-travel-notebook-v1.0.18.apk ]; then
            cp /tmp/ajo-travel-notebook-v1.0.18.apk travel_output/ajo-travel-notebook-v1.0.18.apk
          fi
          if [ -f /tmp/ajo-travel-notebook-v1.0.18-source.zip ]; then
            cp /tmp/ajo-travel-notebook-v1.0.18-source.zip travel_output/ajo-travel-notebook-v1.0.18-source.zip
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- travel_output
          git commit -m "Travel notebook v1.0.18 stable-signed build" || exit 0
          git push origin HEAD:travel-notebook-build

      - name: Fail if build or signing failed
        if: steps.buildapk.outcome != 'success' || steps.signapk.outcome != 'success'
        run: exit 1
