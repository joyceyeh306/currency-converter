name: Build Travel Notebook APK Temporary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-travel-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout travel build branch
        uses: actions/checkout@v6
        with:
          ref: travel-notebook-build
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore travel notebook source
        run: |
          cat travel_build/part*.b64 | tr -d '\n' | base64 -d > /tmp/ajo.zip
          mkdir -p /tmp/ajo
          unzip -q /tmp/ajo.zip -d /tmp/ajo
          test -f /tmp/ajo/ajo_build_min/settings.gradle

      - name: Build debug APK
        id: buildapk
        continue-on-error: true
        working-directory: /tmp/ajo/ajo_build_min
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/ajo-build.log

      - name: Publish result to travel branch
        if: always()
        run: |
          mkdir -p travel_output
          printf 'outcome=%s\nsource=%s\n' '${{ steps.buildapk.outcome }}' '${{ github.sha }}' > travel_output/status.txt
          if [ -f /tmp/ajo-build.log ]; then tail -n 250 /tmp/ajo-build.log > travel_output/build-log.txt; fi
          if [ -f /tmp/ajo/ajo_build_min/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp /tmp/ajo/ajo_build_min/app/build/outputs/apk/debug/app-debug.apk travel_output/ajo-travel-notebook-v1.0.0.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- travel_output
          git commit -m "Travel notebook build result" || exit 0
          git push origin HEAD:travel-notebook-build

      - name: Fail if APK build failed
        if: steps.buildapk.outcome != 'success'
        run: exit 1
