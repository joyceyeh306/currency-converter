name: Ajo Autosub 006 Android Build
on:
  push:
    branches: [ajo-autosub-006-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified v005 source
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64,brotli,hashlib,io,pathlib,tarfile
          blob=''.join(pathlib.Path(f'subtitle-build-payload/v004p{i}.txt').read_text() for i in range(3))
          data=brotli.decompress(base64.b64decode(blob,validate=True))
          assert hashlib.sha256(data).hexdigest()=='493f16fcc7c764e2063dd775745b7aa3dba4f27cf2cf5d4756bb68778563ef7c'
          target=pathlib.Path('subtitle-build-work')
          target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data)) as tar: tar.extractall(target,filter='data')
          patch=brotli.decompress(base64.b64decode(pathlib.Path('subtitle-build-payload/v005patch.txt').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='6920d01e4d8e63930e20827499b01b95d09843465c5bc4beb3c74b7c29405d63'
          pathlib.Path('v005.patch').write_bytes(patch)
          PY
          cd subtitle-build-work
          git apply --check ../v005.patch
          git apply ../v005.patch
      - name: Apply and verify v006 changes
        run: |
          python3 - <<'PY'
          import base64,brotli,hashlib,pathlib
          encoded=pathlib.Path('subtitle-build-payload/v006patch.txt').read_text().strip()
          data=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='b58df0f91d38c1232eb23d5b63823ba5b82d4beb612d1a665ba167d94bbcd66d'
          pathlib.Path('v006.patch').write_bytes(data)
          PY
          cd subtitle-build-work
          git apply --check ../v006.patch
          git apply ../v006.patch
          grep -F "versionName '006'" app/build.gradle
          test -f app/src/main/java/tw/ajo/autosubtitles/SubtitlePainter.java
          grep -F 'SubtitlePainter.draw' app/src/main/java/tw/ajo/autosubtitles/SubtitleExporter.java
          if grep -q 'preferOffline' app/src/main/java/tw/ajo/autosubtitles/MainActivity.java; then exit 2; fi
      - name: Generate ONLY temporary signing key
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 9000 -dname "CN=TemporaryBuild,O=Ajo,C=TW" -noprompt
      - name: Test subtitle logic
        run: |
          cd subtitle-build-work
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/ExportQuality.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java tests/CoreTests.java
          java -cp tests/build CoreTests
      - name: Install SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Build temporary Android APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_006-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package source without signing secret
        run: |
          cd subtitle-build-work
          rm -rf tests/build
          zip -qr ../ajo-autosub_006-source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests README.md .github
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_006-source
          path: ajo-autosub_006-source.zip
          if-no-files-found: error
