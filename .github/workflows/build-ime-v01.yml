name: Build Ajo IME v0.8

on:
  push:
    branches: [ ime-v01-build ]
    paths:
      - 'imeapp/**'
      - '.github/workflows/build-ime-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable IME debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ajo-ime-debug-keystore-v1

      - name: Create signing key when missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Ajo IME,O=Android,C=TW' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify retained stable Ajo signing key
        run: |
          set -e
          export LC_ALL=C
          KEY_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Stable signing key SHA256=$KEY_SHA"
          test "$KEY_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Assemble precise v0.8 keyboard source
        run: |
          set -e
          cat imeapp/v05/PreciseKeyboardView.part1 \
              imeapp/v05/PreciseKeyboardView.part2 \
              imeapp/v05/PreciseKeyboardView.part3 \
              imeapp/v05/PreciseKeyboardView.part4 \
              imeapp/v05/PreciseKeyboardView.part5 \
              > imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java
          grep -q 'class PreciseKeyboardView' imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java
          grep -q '倉頡 → English → 注音' imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java

      - name: Apply v0.8 interaction refinements
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path('imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java')
          s = path.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected source fragment not found:\n' + old[:180])
              s = s.replace(old, new, 1)

          rep(
          '''    private final Map<String, List<String>> cj = new HashMap<>();
              private final Map<String, List<String>> zy = new HashMap<>();''',
          '''    private final Map<String, List<String>> cj = new HashMap<>();
              private final Map<String, List<String>> cjExact = new HashMap<>();
              private final Map<String, List<String>> zy = new HashMap<>();''')

          rep(
          '''    private boolean modeMenu = false;
              private int kaoOff = 0;
              private long downAt = 0;''',
          '''    private boolean modeMenu = false;
              private int kaoOff = 0;
              private int candOff = 0;
              private long downAt = 0;
              private boolean longPressDirect = false;''')

          rep(
          '''        final String value;
                  Hit(RectF r, String action, String value) {
                      this.r = r;
                      this.action = action;
                      this.value = value;
                  }''',
          '''        final String value;
                  final String label;
                  Hit(RectF r, String action, String value) {
                      this(r, action, value, value);
                  }
                  Hit(RectF r, String action, String value, String label) {
                      this.r = r;
                      this.action = action;
                      this.value = value;
                      this.label = label;
                  }''')

          rep('''        loadCangjie();
                  loadZhuyin();''', '''        loadCangjie();
                  loadCangjieExact();
                  loadZhuyin();''')

          rep(
          '''        expanded = false;
                  modeMenu = false;
                  syncComposition();''',
          '''        expanded = false;
                  modeMenu = false;
                  candOff = 0;
                  syncComposition();''')

          rep(
          '''    private float keyScale() { return settings.getInt("key_text_size", 100) / 100f; }''',
          '''    private float keyScale() {
                  int v = settings.getInt("key_text_size", 100);
                  return Math.max(70, Math.min(100, v)) / 100f;
              }''')

          rep(
          '''    private void loadZhuyin() {''',
          '''    private void loadCangjieExact() {
                  try (BufferedReader b = new BufferedReader(new InputStreamReader(
                          getContext().getAssets().open("cangjie_exact.tsv"), StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = b.readLine()) != null) {
                          int i = line.indexOf('\\t');
                          if (i <= 0) continue;
                          String values = line.substring(i + 1).trim();
                          if (!values.isEmpty()) cjExact.put(line.substring(0, i), Arrays.asList(values.split(" +")));
                      }
                  } catch (Exception ignored) {
                      cjExact.put("mwyl", Arrays.asList("面"));
                  }
              }

              private void loadZhuyin() {''')

          rep(
          '''    private void drawKey(Canvas c, float x1, float y1, float x2, float y2,
                                   String label, float size, String action, String value) {
                  RectF r = rect(x1, y1, x2, y2);
                  p.setColor(Color.WHITE);
                  c.drawRoundRect(r, dp(8), dp(8), p);
                  if (label != null && !label.isEmpty()) {
                      t.setColor(Color.BLACK);
                      t.setTextAlign(Paint.Align.CENTER);
                      t.setTextSize(dp(size * keyScale()));
                      android.graphics.Rect bounds = new android.graphics.Rect();
                      t.getTextBounds(label, 0, label.length(), bounds);
                      float baseline = r.centerY() - (bounds.top + bounds.bottom) / 2f;
                      c.drawText(label, r.centerX(), baseline, t);
                  }
                  if (action != null) hits.add(new Hit(new RectF(r), action, value));
              }''',
          '''    private void drawKey(Canvas c, float x1, float y1, float x2, float y2,
                                   String label, float size, String action, String value) {
                  drawKeyInternal(c, x1, y1, x2, y2, label, size, action, value, false);
              }

              private void drawMainKey(Canvas c, float x1, float y1, float x2, float y2,
                                       String label, float size, String action, String value) {
                  drawKeyInternal(c, x1, y1, x2, y2, label, size, action, value, true);
              }

              private void drawKeyInternal(Canvas c, float x1, float y1, float x2, float y2,
                                           String label, float size, String action, String value, boolean scaleMainText) {
                  RectF r = rect(x1, y1, x2, y2);
                  p.setColor(Color.WHITE);
                  c.drawRoundRect(r, dp(8), dp(8), p);
                  if (label != null && !label.isEmpty()) {
                      t.setColor(Color.BLACK);
                      t.setTextAlign(Paint.Align.CENTER);
                      t.setTextSize(dp(size * (scaleMainText ? keyScale() : 1f)));
                      android.graphics.Rect bounds = new android.graphics.Rect();
                      t.getTextBounds(label, 0, label.length(), bounds);
                      float baseline = r.centerY() - (bounds.top + bounds.bottom) / 2f;
                      c.drawText(label, r.centerX(), baseline, t);
                  }
                  if (action != null) hits.add(new Hit(new RectF(r), action, value, label));
              }''')

          rep('''drawKey(c,x,0,x+96,122,c1[i],17.68f,"CJ",String.valueOf(k1[i]));''', '''drawMainKey(c,x,0,x+96,122,c1[i],17.68f,"CJ",String.valueOf(k1[i]));''')
          rep('''drawKey(c,x,155,x+96,282,c2[i],17.68f,"CJ",String.valueOf(k2[i]));''', '''drawMainKey(c,x,155,x+96,282,c2[i],17.68f,"CJ",String.valueOf(k2[i]));''')
          rep('''drawKey(c,x,318,x+96,444,c3[i],17.0f,"CJ",String.valueOf(k3[i]));''', '''drawMainKey(c,x,318,x+96,444,c3[i],17.68f,"CJ",String.valueOf(k3[i]));''')
          rep('''drawKey(c,x,0,x+96,122,q1[i],27,"LETTER",q1[i]);''', '''drawMainKey(c,x,0,x+96,122,q1[i],17.68f,"LETTER",q1[i]);''')
          rep('''drawKey(c,x,155,x+96,282,q2[i],27,"LETTER",q2[i]);''', '''drawMainKey(c,x,155,x+96,282,q2[i],17.68f,"LETTER",q2[i]);''')
          rep('''drawKey(c,x,318,x+96,444,q3[i],27,"LETTER",q3[i]);''', '''drawMainKey(c,x,318,x+96,444,q3[i],17.68f,"LETTER",q3[i]);''')
          rep('''drawKey(c,x,0,x+88,108,z1[i],25,"ZY",z1[i]);''', '''drawMainKey(c,x,0,x+88,108,z1[i],17.68f,"ZY",z1[i]);''')
          rep('''drawKey(c,x,122,x+88,236,z2[i],25,"ZY",z2[i]);''', '''drawMainKey(c,x,122,x+88,236,z2[i],17.68f,"ZY",z2[i]);''')
          rep('''drawKey(c,x,252,x+88,365,z3[i],25,"ZY",z3[i]);''', '''drawMainKey(c,x,252,x+88,365,z3[i],17.68f,"ZY",z3[i]);''')
          rep('''drawKey(c,x,382,x+88,494,z4[i],24,"ZY",z4[i]);''', '''drawMainKey(c,x,382,x+88,494,z4[i],17.68f,"ZY",z4[i]);''')

          rep(
          '''        int n=Math.min(items.size(), cols*rows);
                  t.setTextAlign(Paint.Align.CENTER);
                  t.setTextSize(dp(22*candScale()));
                  t.setColor(Color.BLACK);
                  for(int i=0;i<n;i++) {
                      int row=i/cols, col=i%cols;
                      RectF r=new RectF(col*cw,row*h,(col+1)*cw,(row+1)*h);
                      c.drawText(items.get(i),r.centerX(),row*h+h*.67f,t);
                      hits.add(new Hit(r,"CAND",items.get(i)));
                  }''',
          '''        int pageSize=cols*rows;
                  if(candOff>=items.size()) candOff=0;
                  int n=Math.max(0,Math.min(items.size()-candOff,pageSize));
                  t.setTextAlign(Paint.Align.CENTER);
                  t.setTextSize(dp(22*candScale()));
                  t.setColor(Color.BLACK);
                  for(int i=0;i<n;i++) {
                      int row=i/cols, col=i%cols;
                      RectF r=new RectF(col*cw,row*h,(col+1)*cw,(row+1)*h);
                      String item=items.get(candOff+i);
                      c.drawText(item,r.centerX(),row*h+h*.67f,t);
                      hits.add(new Hit(r,"CAND",item));
                  }''')

          old_candidates = '''    private List<String> candidates() {
                  if(mode==Mode.CANGJIE) {
                      if(cjCode.isEmpty()) return withLearnedNext(Arrays.asList("的","嗎","為","成","過","變","法","我","你","是","有","在","不","人"));
                      List<String> a=cj.get(cjCode);
                      return a==null ? Collections.emptyList() : boost(a);
                  }
                  if(mode==Mode.ZHUYIN) {
                      if(zyCode.isEmpty()) return withLearnedNext(Arrays.asList("的","我","是","了","不","在","有","你","這","人","要","好","就","也"));
                      LinkedHashSet<String> out=new LinkedHashSet<>();
                      List<String> exact=zy.get(zyCode);
                      if(exact!=null) out.addAll(exact);
                      for(Map.Entry<String,List<String>> e:zy.entrySet()) if(e.getKey().startsWith(zyCode)) out.addAll(e.getValue());
                      return boost(new ArrayList<>(out));
                  }
                  return Arrays.asList("i","the","i’m","and","to","you","a","is","of","it","that","for","in","on");
              }
          '''
          new_candidates = '''    private List<String> candidates() {
                  if(mode==Mode.CANGJIE) {
                      if(cjCode.isEmpty()) return withLearnedNext(Arrays.asList("的","嗎","為","成","過","變","法","我","你","是","有","在","不","人"));
                      LinkedHashSet<String> out=new LinkedHashSet<>();
                      List<String> exact=cjExact.get(cjCode);
                      if(exact!=null) out.addAll(boost(exact));
                      List<String> pref=cj.get(cjCode);
                      if(pref!=null) for(String item:boost(pref)) out.add(item);
                      return new ArrayList<>(out);
                  }
                  if(mode==Mode.ZHUYIN) {
                      if(zyCode.isEmpty()) return withLearnedNext(Arrays.asList("的","我","是","了","不","在","有","你","這","人","要","好","就","也"));
                      LinkedHashSet<String> out=new LinkedHashSet<>();
                      List<String> exact=zy.get(zyCode);
                      if(exact!=null) out.addAll(boost(exact));
                      ArrayList<String> pref=new ArrayList<>();
                      for(Map.Entry<String,List<String>> e:zy.entrySet()) {
                          if(!e.getKey().equals(zyCode)&&e.getKey().startsWith(zyCode)) pref.addAll(e.getValue());
                      }
                      for(String item:boost(pref)) out.add(item);
                      return new ArrayList<>(out);
                  }
                  return Arrays.asList("i","the","i’m","and","to","you","a","is","of","it","that","for","in","on");
              }
          '''
          rep(old_candidates,new_candidates)

          rep(
          '''    private List<String> withLearnedNext(List<String> base) {
                  LinkedHashSet<String> out=new LinkedHashSet<>();
                  if(learningEnabled()&&!lastCommitted.isEmpty()) out.addAll(learnedNext(lastCommitted));
                  out.addAll(base);
                  return new ArrayList<>(out);
              }''',
          '''    private List<String> withLearnedNext(List<String> base) {
                  LinkedHashSet<String> out=new LinkedHashSet<>();
                  if(learningEnabled()&&!lastCommitted.isEmpty()) out.addAll(learnedNext(lastCommitted));
                  out.addAll(sentencePunctuation(lastCommitted));
                  out.addAll(base);
                  return new ArrayList<>(out);
              }

              private List<String> sentencePunctuation(String prev) {
                  if(prev==null||prev.isEmpty()) return Collections.emptyList();
                  String tail=prev.substring(prev.length()-1);
                  if("嗎".equals(tail)||"呢".equals(tail)||"嘛".equals(tail)) return Arrays.asList("？","。","！");
                  if("吧".equals(tail)||"啦".equals(tail)||"喔".equals(tail)||"啊".equals(tail)) return Arrays.asList("。","！","？");
                  if("了".equals(tail)||"呀".equals(tail)) return Arrays.asList("。","，","！");
                  return Collections.emptyList();
              }''')

          rep(
          '''    private void choose(String s) {
                  if(s==null||s.isEmpty()) return;
                  svc.commit(s);
                  learn(s);
                  cjCode="";
                  zyCode="";
                  expanded=false;
                  syncComposition();
                  invalidate();
              }''',
          '''    private void choose(String s) {
                  if(s==null||s.isEmpty()) return;
                  svc.commit(s);
                  learn(s);
                  if(isSentencePunctuation(s)) lastCommitted="";
                  cjCode="";
                  zyCode="";
                  candOff=0;
                  expanded=false;
                  syncComposition();
                  invalidate();
              }

              private boolean isSentencePunctuation(String s) {
                  return s!=null && !s.isEmpty() && "，。？！、…；：,.?!".contains(s);
              }''')

          rep(
          '''    private Hit findHit(float x,float y) {
                  // Exact visible key wins first.
                  for(int i=hits.size()-1;i>=0;i--) if(hits.get(i).r.contains(x,y)) return hits.get(i);
          ''',
          '''    private boolean isCangjiePeriod(Hit h) {
                  return page==Page.MAIN && mode==Mode.CANGJIE && "PUNCT".equals(h.action) && "。".equals(h.value);
              }

              private boolean isCangjieYi(Hit h) {
                  return page==Page.MAIN && mode==Mode.CANGJIE && "CJ".equals(h.action) && "m".equals(h.value);
              }

              private Hit findHit(float x,float y) {
                  // Exact visible key wins first, except that the left edge of 。 is deliberately biased toward 一.
                  for(int i=hits.size()-1;i>=0;i--) {
                      Hit h=hits.get(i);
                      if(!h.r.contains(x,y)) continue;
                      if(isCangjiePeriod(h) && x<h.r.left+dp(10)) continue;
                      return h;
                  }
          ''')

          rep(
          '''            RectF rr=new RectF(h.r);
                      rr.inset(-padX,-padY);
                      if(!rr.contains(x,y)) continue;''',
          '''            RectF rr=new RectF(h.r);
                      rr.inset(-padX,-padY);
                      if(isCangjiePeriod(h)) rr.left=h.r.left+dp(10);
                      if(isCangjieYi(h)) rr.right+=dp(18);
                      if(!rr.contains(x,y)) continue;''')

          rep(
          '''    @Override public boolean onTouchEvent(MotionEvent e) {
                  float x=e.getX(),y=e.getY();
                  if(e.getAction()==MotionEvent.ACTION_DOWN) {
                      downAt=SystemClock.uptimeMillis();
                      downX=x; downY=y;
                      downHit=findHit(x,y);
                      backspaceRepeating=false;
                      if(downHit!=null&&"BACK".equals(downHit.action)) {
                          repeatHandler.postDelayed(repeatBackspace,420);
                      }
                      return true;
                  }
                  if(e.getAction()==MotionEvent.ACTION_CANCEL) {
                      repeatHandler.removeCallbacks(repeatBackspace);
                      downHit=null;
                      return true;
                  }
                  if(e.getAction()!=MotionEvent.ACTION_UP) return true;

                  repeatHandler.removeCallbacks(repeatBackspace);
                  float dx=x-downX,dy=y-downY;
                  float adx=Math.abs(dx),ady=Math.abs(dy);
          ''',
          '''    private void pageCandidates(boolean forward) {
                  List<String> items=candidates();
                  int pageSize=7*(expanded?3:1);
                  if(forward) {
                      if(candOff+pageSize<items.size()) candOff+=pageSize;
                  } else {
                      candOff=Math.max(0,candOff-pageSize);
                  }
                  invalidate();
              }

              @Override public boolean onTouchEvent(MotionEvent e) {
                  float x=e.getX(),y=e.getY();
                  if(e.getAction()==MotionEvent.ACTION_DOWN) {
                      downAt=SystemClock.uptimeMillis();
                      downX=x; downY=y;
                      downHit=findHit(x,y);
                      backspaceRepeating=false;
                      longPressDirect=false;
                      if(downHit!=null&&"BACK".equals(downHit.action)) {
                          repeatHandler.postDelayed(repeatBackspace,420);
                      }
                      if(downHit!=null&&("CJ".equals(downHit.action)||"ZY".equals(downHit.action))) {
                          repeatHandler.postDelayed(directSymbolLongPress,430);
                      }
                      return true;
                  }
                  if(e.getAction()==MotionEvent.ACTION_CANCEL) {
                      repeatHandler.removeCallbacks(repeatBackspace);
                      repeatHandler.removeCallbacks(directSymbolLongPress);
                      downHit=null;
                      return true;
                  }
                  if(e.getAction()==MotionEvent.ACTION_MOVE) {
                      if(Math.hypot(x-downX,y-downY)>dp(22)) repeatHandler.removeCallbacks(directSymbolLongPress);
                      return true;
                  }
                  if(e.getAction()!=MotionEvent.ACTION_UP) return true;

                  repeatHandler.removeCallbacks(repeatBackspace);
                  repeatHandler.removeCallbacks(directSymbolLongPress);
                  float dx=x-downX,dy=y-downY;
                  float adx=Math.abs(dx),ady=Math.abs(dy);
          ''')

          rep(
          '''        if(page==Page.KAOMOJI&&ady>dp(34)&&ady>adx*1.25f) {''',
          '''        if(page!=Page.EMOJI&&page!=Page.KAOMOJI&&downY<candH()*(expanded?3:1)&&adx>dp(34)&&adx>ady*1.25f) {
                      feedback();
                      pageCandidates(dx<0);
                      downHit=null;
                      return true;
                  }

                  if(page==Page.KAOMOJI&&ady>dp(34)&&ady>adx*1.25f) {''')

          rep(
          '''        if(downHit!=null&&"SPACE".equals(downHit.action)) {''',
          '''        if(downHit!=null&&"SPACE".equals(downHit.action)&&cjCode.isEmpty()&&zyCode.isEmpty()) {''')

          rep(
          '''        Hit up=findHit(x,y);
                  float move=(float)Math.hypot(dx,dy);''',
          '''        if(longPressDirect) {
                      downHit=null;
                      return true;
                  }

                  Hit up=findHit(x,y);
                  float move=(float)Math.hypot(dx,dy);''')

          rep(
          '''    private final Runnable repeatBackspace=new Runnable() {''',
          '''    private final Runnable directSymbolLongPress=new Runnable() {
                  @Override public void run() {
                      if(downHit==null||!("CJ".equals(downHit.action)||"ZY".equals(downHit.action))) return;
                      longPressDirect=true;
                      feedback();
                      cjCode="";
                      zyCode="";
                      candOff=0;
                      expanded=false;
                      svc.commit(downHit.label);
                      lastCommitted="";
                      syncComposition();
                      invalidate();
                  }
              };

              private final Runnable repeatBackspace=new Runnable() {''')

          rep(
          '''            case "CJ": if(cjCode.length()<5){cjCode+=h.value;syncComposition();invalidate();} break;
                      case "ZY": if(zyCode.length()<8){zyCode+=h.value;syncComposition();invalidate();} break;''',
          '''            case "CJ": if(cjCode.length()<5){cjCode+=h.value;candOff=0;syncComposition();invalidate();} break;
                      case "ZY": if(zyCode.length()<8){zyCode+=h.value;candOff=0;syncComposition();invalidate();} break;''')

          rep(
          '''            case "PUNCT": svc.commit(h.value); lastCommitted=""; page=Page.MAIN; syncComposition(); invalidate(); break;''',
          '''            case "PUNCT": commitPunctuation(h.value); break;''')

          rep(
          '''            case "EXPAND": expanded=!expanded; invalidate(); break;''',
          '''            case "EXPAND": expanded=!expanded; candOff=0; invalidate(); break;''')

          rep(
          '''    private void commitLetter(String s) {''',
          '''    private void commitPunctuation(String s) {
                  svc.commit(s);
                  if(!lastCommitted.isEmpty()) learn(s);
                  lastCommitted="";
                  page=Page.MAIN;
                  candOff=0;
                  syncComposition();
                  invalidate();
              }

              private void commitLetter(String s) {''')

          rep(
          '''            cjCode=cjCode.substring(0,cjCode.length()-1);
                      syncComposition(); invalidate(); return;''',
          '''            cjCode=cjCode.substring(0,cjCode.length()-1);
                      candOff=0;
                      syncComposition(); invalidate(); return;''')

          rep(
          '''            zyCode=zyCode.substring(0,zyCode.length()-Character.charCount(cp));
                      syncComposition(); invalidate(); return;''',
          '''            zyCode=zyCode.substring(0,zyCode.length()-Character.charCount(cp));
                      candOff=0;
                      syncComposition(); invalidate(); return;''')

          rep(
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false;
                  syncComposition(); invalidate();''',
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false; candOff=0;
                  syncComposition(); invalidate();''')
          rep(
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false;
                  syncComposition(); invalidate();''',
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false; candOff=0;
                  syncComposition(); invalidate();''')
          rep(
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false;
                  syncComposition(); invalidate();''',
          '''        cjCode=""; zyCode=""; expanded=false; modeMenu=false; candOff=0;
                  syncComposition(); invalidate();''')

          path.write_text(s, encoding='utf-8')
          PY
          grep -q 'directSymbolLongPress' imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java
          grep -q 'sentencePunctuation' imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java
          grep -q 'cjExact' imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java

      - name: Build complete Cangjie 3 prefix and exact dictionaries
        run: |
          set -e
          mkdir -p imeapp/app/src/main/assets
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/CanCLID/yune/main/apps/yune-web/public/schema/cangjie3.dict.yaml \
            -o /tmp/cangjie3.dict.yaml
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          src = Path('/tmp/cangjie3.dict.yaml').read_text(encoding='utf-8')
          if '倉頡三代補完計畫' not in src:
              raise SystemExit('Downloaded dictionary is not the expected Cangjie 3 source')

          rows = defaultdict(list)
          exact = defaultdict(list)
          in_data = False
          for raw in src.splitlines():
              if raw.strip() == '...':
                  in_data = True
                  continue
              if not in_data or not raw or raw.startswith('#'):
                  continue
              parts = raw.split('\t')
              if len(parts) < 2:
                  continue
              text, code = parts[0].strip(), parts[1].strip().lower()
              if len(text) != 1 or not code or not code.isalpha():
                  continue
              if text not in exact[code]:
                  exact[code].append(text)
              for n in range(1, min(5, len(code)) + 1):
                  key = code[:n]
                  if text not in rows[key]:
                      rows[key].append(text)

          if '面' not in exact.get('mwyl', []):
              raise SystemExit('Cangjie 3 exact verification failed: 面 must be MWYL')

          prefix_out = Path('imeapp/app/src/main/assets/cangjie_prefix.tsv')
          with prefix_out.open('w', encoding='utf-8') as f:
              for key in sorted(rows):
                  f.write(key + '\t' + ' '.join(rows[key]) + '\n')

          exact_out = Path('imeapp/app/src/main/assets/cangjie_exact.tsv')
          with exact_out.open('w', encoding='utf-8') as f:
              for key in sorted(exact):
                  f.write(key + '\t' + ' '.join(exact[key]) + '\n')

          print('Cangjie 3 prefixes:', len(rows), 'bytes:', prefix_out.stat().st_size)
          print('Cangjie 3 exact codes:', len(exact), 'bytes:', exact_out.stat().st_size)
          print('Verified exact: 面 = MWYL (一田卜中)')
          PY

      - name: Build complete Zhuyin single-character dictionary
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/chewing/libchewing-data/main/dict/chewing/word.csv \
            -o /tmp/word.csv
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          rows = defaultdict(list)
          with open('/tmp/word.csv', 'r', encoding='utf-8-sig', newline='') as f:
              for row in csv.reader(f):
                  if not row or row[0].startswith('#') or len(row) < 3:
                      continue
                  text = row[0].strip()
                  zhuyin = row[2].strip()
                  if len(text) != 1 or not zhuyin or ' ' in zhuyin:
                      continue
                  if text not in rows[zhuyin]:
                      rows[zhuyin].append(text)

          out = Path('imeapp/app/src/main/assets/zhuyin.tsv')
          with out.open('w', encoding='utf-8') as f:
              for key in sorted(rows):
                  f.write(key + '\t' + ' '.join(rows[key]) + '\n')
          print('Zhuyin syllables:', len(rows), 'characters:', sum(map(len, rows.values())), 'bytes:', out.stat().st_size)
          PY

      - name: Build APK
        run: gradle -p imeapp :app:assembleDebug --no-daemon

      - name: Verify APK metadata and stable certificate
        run: |
          set -e
          APK=imeapp/app/build/outputs/apk/debug/app-debug.apk
          BADGE=$(${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK" | head -n 2)
          echo "$BADGE"
          echo "$BADGE" | grep -q "versionCode='9' versionName='0.8'"
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -n 8
          APK_SHA=$(${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')
          echo "APK signer SHA256=$APK_SHA"
          test "$APK_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Prepare artifact
        run: cp imeapp/app/build/outputs/apk/debug/app-debug.apk '阿喬輸入法_v0.8_輸入細節修正版.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ajo-ime-v0.8-apk
          path: '阿喬輸入法_v0.8_輸入細節修正版.apk'
          if-no-files-found: error
