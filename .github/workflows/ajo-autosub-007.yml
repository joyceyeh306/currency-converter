name: Ajo Autosub 007 Android Build
on:
  push:
    branches: [ajo-autosub-007-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified v006 source
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64,brotli,hashlib,io,pathlib,tarfile
          encoded=''.join(pathlib.Path(f'subtitle-build-payload/v006full{i}.txt').read_text() for i in range(5))
          blob=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(blob).hexdigest()=='d56db068bb84c3de58a47278dc09d00f4dddb10cdb656d3719b2220d9a11b2e7'
          target=pathlib.Path('subtitle-build-work')
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(blob)) as tar: tar.extractall(target,filter='data')
          PY
          sed -i 's/this::syncPreviewOverlayBounds/MainActivity.this::syncPreviewOverlayBounds/g' subtitle-build-work/app/src/main/java/tw/ajo/autosubtitles/MainActivity.java
      - name: Apply v007 verified patch
        run: |
          python3 - <<'PY'
          import base64,brotli,hashlib,pathlib
          encoded=''.join(pathlib.Path(f'subtitle-build-payload/v007part{i}.txt').read_text() for i in range(2))
          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e6d37e339ec5679e0ab2731b73269a0d49894ab5a40aea59a813d8a912f4aea3'
          pathlib.Path('v007.patch').write_bytes(patch)
          PY
          cd subtitle-build-work
          patch --dry-run -p1 < ../v007.patch
          patch -p1 < ../v007.patch
          grep -F "versionName '007'" app/build.gradle
          grep -F "versionCode 7" app/build.gradle
          ! grep -q 'revealEditingField' app/src/main/java/tw/ajo/autosubtitles/MainActivity.java
      - name: Temporary build signing credential
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 9000 -dname "CN=TemporaryBuild,O=Ajo,C=TW" -noprompt
      - name: Subtitle timing tests
        run: |
          cd subtitle-build-work
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/ExportQuality.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java tests/CoreTests.java
          java -cp tests/build CoreTests
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Assemble temporary debug APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Upload temporary APK for local original-key resigning
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_007-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload verified full source without keys
        run: |
          cd subtitle-build-work
          rm -rf tests/build
          printf '%s\n' "ㄚ喬自動字幕 007" "Fix: edit list no longer jumps when the keyboard opens; natural speech pause segmentation." > README.md
          zip -qr ../ajo-autosub_007-public-source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_007-public-source
          path: ajo-autosub_007-public-source.zip
          if-no-files-found: error
