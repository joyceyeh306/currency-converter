name: Build Ajo Step Counter 003
on:
  push:
    branches: [ajo-step-001-build]
    paths:
      - 'ajo-stepcounter-001/**'
      - '.github/workflows/build-ajo-step-001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit check (pure Java)
        run: |
          mkdir -p /tmp/step-test
          javac -d /tmp/step-test ajo-stepcounter-001/app/src/main/java/tw/ajo/stepcounter/StepMath.java ajo-stepcounter-001/app/src/main/java/tw/ajo/stepcounter/GoalMath.java ajo-stepcounter-001/tests/StepMathTest.java ajo-stepcounter-001/tests/GoalMathTest.java
          java -cp /tmp/step-test StepMathTest
          java -cp /tmp/step-test GoalMathTest
      - name: Cache personal signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ajo-step-001.jks
          key: ajo-step-001-keystore-release-v1
      - name: Generate signing key if absent
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/ajo-step-001.jks ]; then
            keytool -genkeypair -keystore ~/.android/ajo-step-001.jks -storepass android -keypass android -alias ajostep -dname "CN=Ajo Step Counter,O=Ajo,C=TW" -keyalg RSA -keysize 3072 -validity 10000
          fi
      - name: Compile Android release APK
        working-directory: ajo-stepcounter-001
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify release certificate
        run: |
          ls -lh ajo-stepcounter-001/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ajo-stepcounter-001/app/build/outputs/apk/release/app-release.apk
      - name: Build distribution ZIP and stable filenames
        run: |
          mkdir -p release
          cp ajo-stepcounter-001/app/build/outputs/apk/release/app-release.apk release/ajo-stepcounter_003.apk
          rm -f release/ajo-stepcounter_003_source.zip
          zip -rq release/ajo-stepcounter_003_source.zip ajo-stepcounter-001 -x '*/build/*' '*/.gradle/*' '*.gradle.lockfile'
          ls -lh release
      - name: Upload install APK and complete source
        uses: actions/upload-artifact@v4
        with:
          name: ajo-stepcounter-003
          path: |
            release/ajo-stepcounter_003.apk
            release/ajo-stepcounter_003_source.zip
          if-no-files-found: error
      - name: Publish both files on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/ajo-stepcounter_003.apk release/ajo-stepcounter_003_source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Ajo Step Counter 003 APK and source archive"
            git push
          fi
