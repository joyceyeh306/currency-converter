name: Ajo Autosub 040 Gap Review Build
on:
  push:
    branches: [ajo-autosub-040-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore audited 039 sources and run all prior checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml brotli
          python3 - <<'PY039'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-039.yml').read_text())['jobs']['build']['steps']
          done=False
          for step in steps:
              name=step.get('name','')
              if name=='Install Android SDK 36 and native toolchain':
                  done=True
                  break
              if 'run' in step:
                  print('039 stage:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert done and Path('subtitle-build-work/app/src/main/java/tw/ajo/autosubtitles/MainActivity.java').is_file()
          PY039
      - name: Apply 040 targeted review-only additions
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-040/040.patch
          patch --batch -p1 < ../patches/ajo-autosub-040/040.patch
          cp ../patches/ajo-autosub-040/SubtitleGapReview.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-040/ReviewPcmClip.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-040/Version040Tests.java tests/
          cp ../patches/ajo-autosub-040/CHANGELOG_040.md ./
          grep -F "versionName '040'" app/build.gradle
          grep -F 'versionCode 40' app/build.gradle
      - name: Check 040 gap policy, PCM slicing and subtitle preservation
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build040
          javac -encoding UTF-8 -cp tests/build -d tests/build040 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/SubtitleGapReview.java app/src/main/java/tw/ajo/autosubtitles/ReviewPcmClip.java tests/Version040Tests.java
          java -cp tests/build040 Version040Tests
      - name: Install Android 36 native SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Create disposable build key for unsigned-delivery intermediate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temp040,O=Ajo,C=TW" -noprompt
      - name: Compile 040 Android ARM64 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Verify package version and Android signature
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='40'.*versionName='040'"
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
      - name: Collect build artifacts without private signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-out
          cp subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk build-out/ajo-autosub_040-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload APK and signer tool for original private key signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-040-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5
