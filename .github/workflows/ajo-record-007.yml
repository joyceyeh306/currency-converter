name: Ajo Record 007 Build
on:
  push:
    branches: [ajo-record-007-build]
    paths:
      - '.github/workflows/ajo-record-007.yml'
      - 'patches/ajo-record-007/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified Record 006 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYRESTORE'
          import yaml,subprocess
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-record-006.yml').read_text())['jobs']['build']['steps']
          restored=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 and ARM64 NDK':
                  restored=True
                  break
              if 'run' in step:
                  print('Restore 006:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert restored and Path('subtitle-build-work/app/src/main/java/tw/ajo/record/MainActivity.java').exists()
          PYRESTORE
      - name: Apply 007 cloud integration patch and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-record-007/bundle007.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='3da87a90f73d8cea7c9635bedd6443b90c95b0b137faa7a656d34315b50bd8e4'
          Path('subtitle-build-work/007.patch').write_bytes(raw)
          PYPATCH
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 007.patch
          patch --batch -p1 < 007.patch
          grep -F 'versionCode 7' app/build.gradle
          grep -F "versionName '007'" app/build.gradle
          grep -F "applicationId 'tw.ajo.record'" app/build.gradle
          test -f app/src/main/java/tw/ajo/autosubtitles/CloudTranscriber.java
          test -f app/src/main/java/tw/ajo/autosubtitles/CloudKeyStore007.java
          test -f app/src/main/java/tw/ajo/record/CloudTimed007.java
          test -f app/src/main/java/tw/ajo/record/CloudAudio007.java
          grep -F 'runFullQuality066' app/src/main/java/tw/ajo/record/MainActivity.java
          test ! -f signing/ajo-autosub-signing.keystore
          mkdir -p tests/build007 tests/stub007/tw/ajo/record
          printf '%s\n' 'package tw.ajo.record; public final class TranscriptText { public static String traditional(String s){return s==null?"":s;} }' > tests/stub007/tw/ajo/record/TranscriptText.java
          javac -encoding UTF-8 -d tests/build007 \
            tests/stub007/tw/ajo/record/TranscriptText.java \
            app/src/main/java/tw/ajo/autosubtitles/Caption.java \
            app/src/main/java/tw/ajo/autosubtitles/SpeakerCaptionizer.java \
            app/src/main/java/tw/ajo/autosubtitles/CloudCaption007.java \
            app/src/main/java/tw/ajo/record/TimedTranscript005.java \
            app/src/main/java/tw/ajo/record/CloudTimed007.java \
            app/src/main/java/tw/ajo/record/AudioFiles.java \
            app/src/main/java/tw/ajo/record/CloudAudio007.java \
            ../patches/ajo-record-007/TEST_007.java
          java -cp tests/build007 TEST_007
      - name: Install Android SDK 36 and ARM64 NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || true
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - name: Compile and verify Record 007 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='tw.ajo.record' versionCode='7' versionName='007'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-record_007-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
          sha256sum "$APK" > build-out/sha256.txt
      - name: Upload temp APK and signer for private production signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-record-007-temp-and-signer
          path: build-out/
          retention-days: 7
          if-no-files-found: error
