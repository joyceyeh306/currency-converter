name: Ajo Autosub 034 Early Audio Recovery Build
on:
  push:
    branches: [ajo-autosub-034-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild audited 029 source from previous public workflow
        run: |
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBUILD'
          import yaml, subprocess
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-029.yml').read_text())['jobs']['build']['steps']
          tests={'Run v026 CPU performance policy and full regression tests','Run 027 HDR output fidelity checks','Run 028 persistence tests','Test 029 independent Whisper state, CPU timing and notifications'}
          for step in steps:
              name=step.get('name','')
              if name.startswith('Create disposable build key'): break
              if 'run' in step:
                  print('Rebuilding prior version:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          for step in steps:
              if step.get('name') in tests:
                  print('Checking prior version:',step['name'],flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          PYBUILD
      - name: Apply 030 high-performance native CPU patch
        run: |
          mkdir -p subtitle-build-v030
          base64 --decode subtitle-build-payload/v030bundle.b64 | tar -xz -C subtitle-build-v030
          cd subtitle-build-work
          python3 - <<'PYDIFF'
          from pathlib import Path
          p=Path('../subtitle-build-v030/v030.patch')
          s=p.read_text()
          start=s.index('--- a/tests/Version027Tests.java')
          end=s.index('--- a/tests/Version028Tests.java',start)
          s=s[:start]+s[end:]
          s=s[:s.index('--- a/README.md')]
          p.write_text(s)
          PYDIFF
          patch --dry-run --batch -p1 < ../subtitle-build-v030/v030.patch
          patch --batch -p1 < ../subtitle-build-v030/v030.patch
          python3 - <<'PYUP'
          import re
          from pathlib import Path
          p=Path('tests/Version027Tests.java')
          s=p.read_text()
          s=re.sub(r'versionCode (27|28|29)', 'versionCode 30',s)
          s=re.sub(r"versionName '(027|028|029)'", "versionName '030'",s)
          assert 'versionCode 30' in s and "versionName '030'" in s
          p.write_text(s)
          PYUP
          printf '\n\n## 030 Whisper native CPU optimization\nSee CHANGELOG_030.md for ARM64 O3 and dotprod/FP16 settings.\n' >> README.md
          cp ../subtitle-build-v030/Version030Tests.java tests/Version030Tests.java
          cp ../subtitle-build-v030/CHANGELOG_030.md CHANGELOG_030.md
          grep -F "versionName '030'" app/build.gradle
          grep -F 'versionCode 30' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Retest 027 to 030 with updated version
        run: |
          cd subtitle-build-work
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java
          java -cp tests/build Version027Tests
          java -cp tests/build Version028Tests
          java -cp tests/build Version029Tests
          java -cp tests/build Version030Tests
      - name: Apply 031 surgical tail-recovery patch
        run: |
          mkdir -p subtitle-build-v031
          base64 --decode subtitle-build-payload/v031bundle.b64 | tar -xz -C subtitle-build-v031
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../subtitle-build-v031/v031_core.patch
          patch --batch -p1 < ../subtitle-build-v031/v031_core.patch
          cp ../subtitle-build-v031/app/src/main/cpp/whisper_tail_recovery.h app/src/main/cpp/whisper_tail_recovery.h
          cp ../subtitle-build-v031/tests/Version031Tests.java tests/Version031Tests.java
          cp ../subtitle-build-v031/tests/Version031NativeTests.cpp tests/Version031NativeTests.cpp
          cp ../subtitle-build-v031/CHANGELOG_031.md CHANGELOG_031.md
          printf '\n\n## 031 Conservative speech tail verification\nSee CHANGELOG_031.md.\n' >> README.md
          python3 - <<'PYVERS'
          from pathlib import Path
          for version in (27,28,29,30):
              p=Path(f'tests/Version{version:03d}Tests.java')
              s=p.read_text().replace('versionCode 30','versionCode 31').replace("versionName '030'","versionName '031'")
              assert 'versionCode 31' in s and "versionName '031'" in s, str(p)
              p.write_text(s)
          PYVERS
          grep -F "versionName '031'" app/build.gradle
          grep -F 'versionCode 31' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Verify 031 native tail policy and complete old regression
        run: |
          cd subtitle-build-work
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/Version031NativeTests.cpp -o tests/v031-native
          ./tests/v031-native
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java tests/Version031Tests.java
          java -cp tests/build Version027Tests
          java -cp tests/build Version028Tests
          java -cp tests/build Version029Tests
          java -cp tests/build Version030Tests
          java -cp tests/build Version031Tests
      - name: Apply 032 UI-only layout changes
        run: |
          mkdir -p subtitle-build-v032
          base64 --decode subtitle-build-payload/v032bundle.b64 | tar -xz -C subtitle-build-v032
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../subtitle-build-v032/v032.patch
          patch --batch -p1 < ../subtitle-build-v032/v032.patch
          mkdir -p app/src/main/res/drawable
          cp ../subtitle-build-v032/app/src/main/res/drawable/*.xml app/src/main/res/drawable/
          cp ../subtitle-build-v032/tests/Version032Tests.java tests/Version032Tests.java
          cp ../subtitle-build-v032/CHANGELOG_032.md CHANGELOG_032.md
          printf '\n\n## 032 UI simplification\nSee CHANGELOG_032.md for the icon row and recognition settings relocation.\n' >> README.md
          python3 - <<'PYVERS'
          from pathlib import Path
          for version in (27,28,29,30,31):
              p=Path(f'tests/Version{version:03d}Tests.java')
              s=p.read_text().replace('versionCode 31','versionCode 32').replace("versionName '031'","versionName '032'")
              assert 'versionCode 32' in s and "versionName '032'" in s,str(p)
              p.write_text(s)
          PYVERS
          grep -F "versionName '032'" app/build.gradle
          grep -F 'versionCode 32' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Verify 032 layout, original native behavior and all regressions
        run: |
          cd subtitle-build-work
          ./tests/v031-native
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java tests/Version031Tests.java tests/Version032Tests.java
          for v in 027 028 029 030 031 032; do java -cp tests/build Version${v}Tests; done
      - name: Apply 033 typography patch and download licensed embedded fonts
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-v033
          base64 --decode subtitle-build-payload/v033bundle.b64 | tar -xz -C subtitle-build-v033
          cd subtitle-build-work
          python3 - <<'PYREADME'
          from pathlib import Path
          p=Path('../subtitle-build-v033/v033.patch')
          s=p.read_text()
          tag='diff -ruN a/README.md b/README.md'
          start=s.index(tag)
          end=s.index('diff -ruN ',start+len(tag))
          s=s[:start]+s[end:]
          p.write_text(s)
          PYREADME
          patch --dry-run --batch -p1 < ../subtitle-build-v033/v033.patch
          patch --batch -p1 < ../subtitle-build-v033/v033.patch
          printf '\n\n## 033 字幕字型與校對流程\n詳見 CHANGELOG_033.md。\n' >> README.md
          mkdir -p app/src/main/assets/fonts app/src/main/assets/licenses
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/fonts/iansui.ttf https://raw.githubusercontent.com/ButTaiwan/iansui/main/fonts/ttf/Iansui-Regular.ttf
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/fonts/huninn.ttf https://github.com/justfont/open-huninn-font/releases/download/v2.1/jf-openhuninn-2.1.ttf
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/licenses/iansui-OFL.txt https://raw.githubusercontent.com/ButTaiwan/iansui/main/OFL.txt
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/licenses/huninn-OFL.txt https://raw.githubusercontent.com/justfont/open-huninn-font/master/LICENSE
          python3 - <<'PYFONTS'
          from pathlib import Path
          import re
          for font in ('iansui','huninn'):
              p=Path('app/src/main/assets/fonts')/(font+'.ttf')
              data=p.read_bytes()
              assert len(data)>1000000,(font,'too small',len(data))
              assert data[:4] in (b'\x00\x01\x00\x00', b'OTTO'),(font,'invalid TTF/OTF')
              lic=(Path('app/src/main/assets/licenses')/(font+'-OFL.txt')).read_text(encoding='utf-8-sig')
              assert 'SIL OPEN FONT LICENSE' in lic.upper(),font
              print(font,len(data),'bytes font validated; license included')
          PYFONTS
          python3 - <<'PYVERS'
          from pathlib import Path
          import re
          for v in range(27,33):
              p=Path(f'tests/Version{v:03d}Tests.java')
              s=p.read_text()
              s=re.sub(r'versionCode (?:2[7-9]|3[0-2])','versionCode 33',s)
              s=re.sub(r"versionName '(?:02[7-9]|03[0-2])'", "versionName '033'",s)
              assert 'versionCode 33' in s and "versionName '033'" in s,str(p)
              p.write_text(s)
          PYVERS
          grep -F "versionName '033'" app/build.gradle
          grep -F 'versionCode 33' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Run 027 through 033 source and native regression
        run: |
          cd subtitle-build-work
          ./tests/v031-native
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java tests/Version031Tests.java tests/Version032Tests.java tests/Version033Tests.java
          for v in 027 028 029 030 031 032 033; do java -cp tests/build Version${v}Tests; done
      - name: Apply 034 conditional missing-speech recovery
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-v034
          base64 --decode subtitle-build-payload/v034bundle.b64 | tar -xz -C subtitle-build-v034
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../subtitle-build-v034/034.patch
          patch --batch -p1 < ../subtitle-build-v034/034.patch
          cp ../subtitle-build-v034/whisper_early_recovery.h app/src/main/cpp/whisper_early_recovery.h
          cp ../subtitle-build-v034/Version034Tests.java tests/Version034Tests.java
          cp ../subtitle-build-v034/Version034NativeTests.cpp tests/Version034NativeTests.cpp
          cp ../subtitle-build-v034/CHANGELOG_034.md CHANGELOG_034.md
          python3 - <<'PYVERS'
          from pathlib import Path
          for v in range(27,34):
              p=Path('tests')/(f'Version{v:03d}Tests.java')
              s=p.read_text().replace('versionCode 33','versionCode 34').replace("versionName '033'","versionName '034'")
              if v==31:s=s.replace('new long[6]','new long[8]')
              assert 'versionCode 34' in s and "versionName '034'" in s,str(p)
              p.write_text(s)
          PYVERS
          printf '\n\n## 034 Late speech after noisy opening\nSee CHANGELOG_034.md for conservative independent suffix decoding.\n' >> README.md
          grep -F "versionName '034'" app/build.gradle
          grep -F 'versionCode 34' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Validate 034 acoustic gate and 027-034 regressions
        run: |
          cd subtitle-build-work
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/Version034NativeTests.cpp -o tests/v034-native
          ./tests/v034-native
          ./tests/v031-native
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java tests/Version031Tests.java tests/Version032Tests.java tests/Version033Tests.java tests/Version034Tests.java
          for v in 027 028 029 030 031 032 033 034; do java -cp tests/build Version${v}Tests; done
      - name: Install Android SDK 36 and native toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Create disposable temporary signing credential
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temp034,O=Ajo,C=TW" -noprompt
      - name: Compile 034 ARM64 Android APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Confirm real ggml ARM64 compiler optimization flags
        run: |
          cd subtitle-build-work
          python3 - <<'PYFLAGS'
          import glob,json,shlex,re
          paths=glob.glob('app/.cxx/**/compile_commands.json',recursive=True)
          assert paths,'Missing native compile command database'
          cpu=[]
          for p in paths:
              for c in json.load(open(p)):
                  if '/ggml-cpu/' in c['file'] and c['file'].endswith(('ggml-cpu.cpp','quants.c')):
                      cpu.append(c)
          assert cpu,'No ggml CPU translation units found'
          for c in cpu:
              argv=shlex.split(c['command']) if 'command' in c else c['arguments']
              print('ARM compiler command:',c['file'].split('/')[-1], ' '.join(argv[-70:]),flush=True)
              opts=[v for v in argv if re.fullmatch(r'-O[0123s]',v)]
              assert opts and opts[-1]=='-O3',(c['file'],opts)
              assert '-march=armv8.2-a+fp16+dotprod' in argv,c['file']
              print(c['file'].split('/')[-1],opts,'ARM dotprod / fp16 confirmed')
          PYFLAGS
      - name: Verify temporary APK package and signature
        run: |
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'versionCode=.34.|versionName=.034.'
      - name: Upload temporary APK for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_034-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package full source without private keystore
        run: |
          cd subtitle-build-work
          rm -rf tests/build tests/v031-native tests/v034-native signing
          zip -qr ../ajo-autosub_034-public-source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests app/src/main/assets README.md CHANGELOG_027.md CHANGELOG_028.md CHANGELOG_029.md CHANGELOG_030.md CHANGELOG_031.md CHANGELOG_032.md CHANGELOG_033.md CHANGELOG_034.md
      - name: Upload 034 public source
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_034-public-source
          path: ajo-autosub_033-public-source.zip
          if-no-files-found: error