name: Ajo Autosub 041 Conservative Timing Review
on:
  push:
    branches: [ajo-autosub-041-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore reviewed 040 with all earlier regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-040.yml').read_text())['jobs']['build']['steps']
          processed=False
          for step in steps:
              name=step.get('name','')
              if name=='Install Android 36 native SDK toolchain':
                  processed=True
                  break
              if 'run' in step:
                  print('040 base:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert processed, '040 workflow restoration stage missing'
          assert Path('subtitle-build-work/app/src/main/java/tw/ajo/autosubtitles/MainActivity.java').is_file()
          PYBASE
      - name: Apply 041 boundary-review source without private signing material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import base64,brotli
          raw=brotli.decompress(base64.b64decode(Path('patches/ajo-autosub-041/bundle.br.b64').read_text().strip()))
          pos=0; root=Path('patches/ajo-autosub-041/generated')
          while pos<len(raw):
              nl=raw.index(b'\n',pos); name=raw[pos:nl].decode(); pos=nl+1
              nl=raw.index(b'\n',pos); size=int(raw[pos:nl]); pos=nl+1
              data=raw[pos:pos+size]; pos+=size
              out=root/name; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
              print(name,len(data))
          assert pos==len(raw)
          PYBUNDLE
          cd subtitle-build-work
          patch --dry-run -p1 < ../patches/ajo-autosub-041/generated/041.patch
          patch --batch -p1 < ../patches/ajo-autosub-041/generated/041.patch
          cp ../patches/ajo-autosub-041/generated/app/src/main/java/tw/ajo/autosubtitles/SpeechBoundaryReview.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-041/generated/tests/Version041Tests.java tests/
          cp ../patches/ajo-autosub-041/generated/CHANGELOG_041.md .
          grep -F "versionName '041'" app/build.gradle
          grep -F 'versionCode 41' app/build.gradle
          test ! -e signing/ajo-autosub-signing.keystore
      - name: Test 041 real acoustic edges and no automatic caption modifications
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build041
          javac -encoding UTF-8 -d tests/build041 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SpeechBoundaryReview.java tests/Version041Tests.java
          java -cp tests/build041 Version041Tests
      - name: Install native SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Temporary CI signing key only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temp041,O=Ajo,C=TW" -noprompt
      - name: Compile 041 Android ARM64 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Verify 041 package and temporary signing
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='41'.*versionName='041'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_041-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and local-signing tool
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-041-temp-and-signer
          path: build-out/
          retention-days: 5
          if-no-files-found: error
