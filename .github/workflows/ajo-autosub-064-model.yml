name: Ajo 064 Research Obtain Official Whisper Model
on:
  push:
    branches: [ajo-autosub-064-whisper-test]
    paths: [.github/workflows/ajo-autosub-064-model.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  obtain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download upstream public whisper.cpp Small Q5_1 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 500 -o model/ggml-small-q5_1.bin 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin'
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  model/ggml-small-q5_1.bin' | sha256sum -c -
          test "$(stat -c %s model/ggml-small-q5_1.bin)" -gt 180000000
      - uses: actions/upload-artifact@v4
        with:
          name: official-whisper-small-q5_1-model
          path: model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
