name: Ajo Phone Master 001 Build
on:
  push:
    branches: [ajo-phone-master-001]
    paths:
      - 'ajo-phone-master/001/**'
      - '.github/workflows/ajo-phone-master-001.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract complete Android project
        run: |
          mkdir -p ajo-phone-master/001/build
          base64 --decode ajo-phone-master/001/source.tar.gz.b64 | tar -xz -C ajo-phone-master/001/build
      - name: Compile APK
        run: gradle --no-daemon --stacktrace -p ajo-phone-master/001/build :app:assembleDebug
      - name: Name APK and hash
        run: |
          cp ajo-phone-master/001/build/app/build/outputs/apk/debug/app-debug.apk ajo-phone-master_001.apk
          sha256sum ajo-phone-master_001.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-phone-master_001
          path: ajo-phone-master_001.apk
          if-no-files-found: error
          retention-days: 90
