name: Build Ajo IME v0.9.5 Direct

on:
  push:
    branches: [ ime-v01-build ]
    paths:
      - '.github/workflows/build-ime-v09-direct.yml'
      - '.github/scripts/v091_fix.py'
      - '.github/scripts/v092_fix.py'
      - '.github/scripts/v093_fix.py'
      - '.github/scripts/v094_fix.py'
      - '.github/scripts/v094_note_fix.py'
      - '.github/scripts/v095_fix.py'
      - 'imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java'
      - 'imeapp/app/src/main/java/tw/ajo/ime/MainActivity.java'
      - 'imeapp/app/src/main/java/tw/ajo/ime/AjoImeService.java'
      - 'imeapp/app/src/main/AndroidManifest.xml'
      - 'imeapp/app/build.gradle'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable IME signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ajo-ime-debug-keystore-v1

      - name: Create signing key when missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Ajo IME,O=Android,C=TW' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify retained signing key
        run: |
          set -e
          export LC_ALL=C
          KEY_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Stable signing key SHA256=$KEY_SHA"
          test "$KEY_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Apply v0.9.5 revision
        run: python3 .github/scripts/v095_fix.py

      - name: Build Cangjie 3 dictionaries
        run: |
          set -e
          mkdir -p imeapp/app/src/main/assets
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/CanCLID/yune/main/apps/yune-web/public/schema/cangjie3.dict.yaml \
            -o /tmp/cangjie3.dict.yaml
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          src=Path('/tmp/cangjie3.dict.yaml').read_text(encoding='utf-8')
          if '倉頡三代補完計畫' not in src: raise SystemExit('Unexpected Cangjie source')
          pref=defaultdict(list); exact=defaultdict(list); data=False
          for raw in src.splitlines():
              if raw.strip()=='...': data=True; continue
              if not data or not raw or raw.startswith('#'): continue
              parts=raw.split('\t')
              if len(parts)<2: continue
              text,code=parts[0].strip(),parts[1].strip().lower()
              if len(text)!=1 or not code or not code.isalpha(): continue
              if text not in exact[code]: exact[code].append(text)
              for n in range(1,min(5,len(code))+1):
                  key=code[:n]
                  if text not in pref[key]: pref[key].append(text)
          if '面' not in exact.get('mwyl',[]): raise SystemExit('Cangjie 3 verification failed: 面 must be MWYL')
          for name,rows in [('cangjie_prefix.tsv',pref),('cangjie_exact.tsv',exact)]:
              out=Path('imeapp/app/src/main/assets')/name
              with out.open('w',encoding='utf-8') as f:
                  for key in sorted(rows): f.write(key+'\t'+' '.join(rows[key])+'\n')
              print(name,len(rows),out.stat().st_size)
          PY

      - name: Build Zhuyin dictionary
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/chewing/libchewing-data/main/dict/chewing/word.csv \
            -o /tmp/word.csv
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path
          rows=defaultdict(list)
          with open('/tmp/word.csv','r',encoding='utf-8-sig',newline='') as f:
              for row in csv.reader(f):
                  if not row or row[0].startswith('#') or len(row)<3: continue
                  text=row[0].strip(); z=row[2].strip()
                  if len(text)!=1 or not z or ' ' in z: continue
                  if text not in rows[z]: rows[z].append(text)
          out=Path('imeapp/app/src/main/assets/zhuyin.tsv')
          with out.open('w',encoding='utf-8') as f:
              for key in sorted(rows): f.write(key+'\t'+' '.join(rows[key])+'\n')
          print('Zhuyin',len(rows),out.stat().st_size)
          PY

      - name: Build APK
        run: gradle -p imeapp :app:assembleDebug --no-daemon

      - name: Verify APK metadata and certificate
        run: |
          set -e
          APK=imeapp/app/build/outputs/apk/debug/app-debug.apk
          BADGE=$(${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK" | head -n 2)
          echo "$BADGE"
          echo "$BADGE" | grep -q "versionCode='15' versionName='0.9.5'"
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -n 8
          APK_SHA=$(${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')
          echo "APK signer SHA256=$APK_SHA"
          test "$APK_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Prepare artifact
        run: cp imeapp/app/build/outputs/apk/debug/app-debug.apk '阿喬輸入法_v0.9.5_常用字與操作修正版.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ajo-ime-v0.9.5-apk
          path: '阿喬輸入法_v0.9.5_常用字與操作修正版.apk'
          if-no-files-found: error
