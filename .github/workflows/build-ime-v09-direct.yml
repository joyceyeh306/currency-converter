name: Build Ajo IME v0.9.14 Direct

on:
  push:
    branches: [ ime-v01-build ]
    paths:
      - '.github/workflows/build-ime-v09-direct.yml'
      - '.github/scripts/v091_fix.py'
      - '.github/scripts/v092_fix.py'
      - '.github/scripts/v093_fix.py'
      - '.github/scripts/v094_fix.py'
      - '.github/scripts/v094_note_fix.py'
      - '.github/scripts/v095_fix.py'
      - '.github/scripts/v095_runner.py'
      - '.github/scripts/v096_fix.py'
      - '.github/scripts/v096_runner.py'
      - '.github/scripts/v097_fix.py'
      - '.github/scripts/v098_fix.py'
      - '.github/scripts/v099_fix.py'
      - '.github/scripts/v0910_fix.py'
      - '.github/scripts/v0911_fix.py'
      - '.github/scripts/v0912_fix.py'
      - '.github/scripts/v0913_fix.py'
      - '.github/scripts/v0914_fix.py'
      - '.github/assets/ajo_icon_144.webp.b64'
      - 'imeapp/app/src/main/java/tw/ajo/ime/PreciseKeyboardView.java'
      - 'imeapp/app/src/main/java/tw/ajo/ime/MainActivity.java'
      - 'imeapp/app/src/main/java/tw/ajo/ime/AjoImeService.java'
      - 'imeapp/app/src/main/java/tw/ajo/ime/MicPermissionActivity.java'
      - 'imeapp/app/src/main/AndroidManifest.xml'
      - 'imeapp/app/build.gradle'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable IME signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ajo-ime-debug-keystore-v1

      - name: Create signing key when missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Ajo IME,O=Android,C=TW' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify retained signing key
        run: |
          set -e
          export LC_ALL=C
          KEY_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Stable signing key SHA256=$KEY_SHA"
          test "$KEY_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Apply v0.9.14 revision
        run: python3 .github/scripts/v0914_fix.py

      - name: Build Cangjie 3 dictionaries
        run: |
          set -e
          mkdir -p imeapp/app/src/main/assets
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/CanCLID/yune/main/apps/yune-web/public/schema/cangjie3.dict.yaml \
            -o /tmp/cangjie3.dict.yaml
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          src=Path('/tmp/cangjie3.dict.yaml').read_text(encoding='utf-8')
          if '倉頡三代補完計畫' not in src: raise SystemExit('Unexpected Cangjie source')
          pref=defaultdict(list); exact=defaultdict(list); data=False
          for raw in src.splitlines():
              if raw.strip()=='...': data=True; continue
              if not data or not raw or raw.startswith('#'): continue
              parts=raw.split('\t')
              if len(parts)<2: continue
              text,code=parts[0].strip(),parts[1].strip().lower()
              if len(text)!=1 or not code or not code.isalpha(): continue
              if text not in exact[code]: exact[code].append(text)
              for n in range(1,min(5,len(code))+1):
                  key=code[:n]
                  if text not in pref[key]: pref[key].append(text)
          if '面' not in exact.get('mwyl',[]): raise SystemExit('Cangjie 3 verification failed: 面 must be MWYL')
          if '干' not in exact.get('mj',[]): raise SystemExit('Cangjie 3 verification failed: 干 must be MJ')
          if '甘' not in exact.get('tm',[]): raise SystemExit('Cangjie 3 verification failed: 甘 must be TM')
          if '占' not in exact.get('yr',[]): raise SystemExit('Cangjie 3 verification failed: 占 must be YR')
          for name,rows in [('cangjie_prefix.tsv',pref),('cangjie_exact.tsv',exact)]:
              out=Path('imeapp/app/src/main/assets')/name
              with out.open('w',encoding='utf-8') as f:
                  for key in sorted(rows): f.write(key+'\t'+' '.join(rows[key])+'\n')
              print(name,len(rows),out.stat().st_size)
          PY

      - name: Build Zhuyin dictionaries
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/chewing/libchewing-data/main/dict/chewing/word.csv \
            -o /tmp/word.csv
          curl -fL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/chewing/libchewing-data/main/dict/chewing/tsi.csv \
            -o /tmp/tsi.csv
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          rows=defaultdict(list)
          with open('/tmp/word.csv','r',encoding='utf-8-sig',newline='') as f:
              for row in csv.reader(f):
                  if not row or row[0].startswith('#') or len(row)<3: continue
                  text=row[0].strip(); z=row[2].strip()
                  if len(text)!=1 or not z or ' ' in z: continue
                  if text not in rows[z]: rows[z].append(text)

          out=Path('imeapp/app/src/main/assets/zhuyin.tsv')
          with out.open('w',encoding='utf-8') as f:
              for key in sorted(rows): f.write(key+'\t'+' '.join(rows[key])+'\n')
          print('Zhuyin chars',len(rows),out.stat().st_size)

          # Build a Taiwan Traditional Chinese common-character rank from
          # libchewing word frequencies. The top 4500 single characters are
          # enough to promote normal daily-use two-root exacts while keeping
          # obscure exact-code characters behind useful prefix candidates.
          freq={}
          with open('/tmp/word.csv','r',encoding='utf-8-sig',newline='') as f:
              for row in csv.reader(f):
                  if not row or row[0].startswith('#') or len(row)<2: continue
                  text=row[0].strip()
                  if len(text)!=1: continue
                  try: weight=int(row[1].strip())
                  except Exception: continue
                  if weight>freq.get(text,-1): freq[text]=weight
          ranked=sorted(freq.items(),key=lambda kv:(-kv[1],kv[0]))
          common=[ch for ch,_ in ranked[:4500]]
          for must in ['占','干','甘']:
              if must not in common:
                  raise SystemExit(f'Common-character verification failed: {must} not in top 4500')
          common_out=Path('imeapp/app/src/main/assets/common_chars.tsv')
          with common_out.open('w',encoding='utf-8') as f:
              total=len(common)
              for idx,ch in enumerate(common):
                  f.write(f'{ch}\t{total-idx}\n')
          print('Common chars',len(common),common_out.stat().st_size,'占 rank=',common.index('占')+1)


          # Build "first Bopomofo symbol of every syllable" phrase keys.
          # Example: 我們 = ㄨㄛˇ ㄇㄣ˙ -> ㄨㄇ.
          phrase_best=defaultdict(dict)
          order=0
          with open('/tmp/tsi.csv','r',encoding='utf-8-sig',newline='') as f:
              for row in csv.reader(f):
                  if not row or row[0].startswith('#') or len(row)<3: continue
                  text=row[0].strip()
                  phones=row[2].strip().split()
                  if len(text)<2 or len(text)>6 or len(phones)!=len(text): continue
                  try: weight=int(row[1].strip())
                  except Exception: weight=0
                  initials=[]
                  valid=True
                  for phone in phones:
                      first=None
                      for ch in phone:
                          if '\u3105' <= ch <= '\u312f':
                              first=ch
                              break
                      if first is None:
                          valid=False
                          break
                      initials.append(first)
                  if not valid: continue
                  key=''.join(initials)
                  old=phrase_best[key].get(text)
                  if old is None or weight>old[0]:
                      phrase_best[key][text]=(weight,order)
                  order+=1

          initials_rows={}
          for key,items in phrase_best.items():
              ranked=sorted(items.items(),key=lambda kv:(-kv[1][0],kv[1][1]))
              initials_rows[key]=[text for text,_ in ranked[:36]]

          sample=initials_rows.get('ㄨㄇ',[])
          if '我們' not in sample:
              raise SystemExit('Zhuyin initials verification failed: ㄨㄇ must include 我們')

          out2=Path('imeapp/app/src/main/assets/zhuyin_initials.tsv')
          with out2.open('w',encoding='utf-8') as f:
              for key in sorted(initials_rows): f.write(key+'\t'+' '.join(initials_rows[key])+'\n')
          print('Zhuyin initials',len(initials_rows),out2.stat().st_size,'ㄨㄇ=',sample[:10])
          PY

      - name: Build APK
        run: gradle -p imeapp :app:assembleDebug --no-daemon

      - name: Verify APK metadata, icon, microphone permission and certificate
        run: |
          set -e
          APK=imeapp/app/build/outputs/apk/debug/app-debug.apk
          BADGE=$(${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK" | head -n 2)
          echo "$BADGE"
          echo "$BADGE" | grep -q "versionCode='24' versionName='0.9.14'"
          ICON=$(unzip -Z1 "$APK" | grep -E '^res/mipmap[^/]*/ic_launcher\.webp$' | head -n1)
          test -n "$ICON"
          unzip -p "$APK" "$ICON" >/tmp/ajo_launcher.webp
          ICON_SHA=$(sha256sum /tmp/ajo_launcher.webp | awk '{print $1}')
          echo "Launcher icon $ICON SHA256=$ICON_SHA"
          test "$ICON_SHA" = "fcc5763d332070c751a8e39d84b2f87dd5f5944c3181d09cff2b983ec64244a5"
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -n 8
          APK_SHA=$(${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')
          echo "APK signer SHA256=$APK_SHA"
          test "$APK_SHA" = "9d3d3c77112475d20d2b032063a6fdb25b6712870d1c89115c98fe8a781a60fd"

      - name: Prepare artifact
        run: cp imeapp/app/build/outputs/apk/debug/app-debug.apk '阿喬輸入法_v0.9.14_二碼完整字排序修正版.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ajo-ime-v0.9.14-apk
          path: '阿喬輸入法_v0.9.14_二碼完整字排序修正版.apk'
          if-no-files-found: error
