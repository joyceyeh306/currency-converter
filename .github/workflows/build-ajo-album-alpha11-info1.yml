name: Build Ajo Album alpha11-info1 from stable1

on:
  push:
    branches: [codex/album-alpha11-version-info]
    paths:
      - 'photo_manager_app/**'
      - '.github/workflows/build-ajo-album-alpha11-info1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Verify accepted slim7 ancestry and protected files
        run: |
          git merge-base --is-ancestor fc7a6e48e0ba2536e8b7ffbe003a970b6c370c45 HEAD
          git diff --exit-code fc7a6e48e0ba2536e8b7ffbe003a970b6c370c45 -- photo_manager_app/app/src/main/java/tw/ajo/photomanager/CollectionScreen.kt photo_manager_app/app/src/main/java/tw/ajo/photomanager/MapScreens.kt photo_manager_app/app/src/main/java/tw/ajo/photomanager/ViewerScreen.kt photo_manager_app/app/src/main/assets photo_manager_app/app/src/main/AndroidManifest.xml
      - name: Install SDK and restore icon
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p photo_manager_app/app/src/main/res/drawable
          tr -d '\n\r ' < photo_manager_build/icon.b64 | base64 -d > photo_manager_app/app/src/main/res/drawable/app_icon.png
      - name: Build from Kotlin source
        working-directory: photo_manager_app
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign and verify matching certificate
        run: |
          mkdir -p output
          curl --retry 3 -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o /tmp/testkey.pk8
          curl --retry 3 -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o /tmp/testkey.x509.pem
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 photo_manager_app/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out output/ajo-album-v2.0.0-alpha11-info1.apk /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/ajo-album-v2.0.0-alpha11-info1.apk | tee output/signature.txt
          grep -q a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc output/signature.txt
      - name: Export exact sources and provenance
        run: |
          git archive --format=zip --prefix=ajo-album-alpha11-info1/ HEAD photo_manager_app photo_manager_build/icon.b64 .github/workflows/build-ajo-album-alpha11-info1.yml > output/ajo-album-v2.0.0-alpha11-info1-source.zip
          git archive --format=zip --prefix=ajo-album-alpha11-stable1/ 8dd319049a5170e61a706a30b60575337a044cea photo_manager_app photo_manager_build/icon.b64 > output/ajo-album-v2.0.0-alpha11-stable1-source.zip
          git rev-parse HEAD > output/source-commit.txt
          sha256sum output/*.apk output/*.zip > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-album-alpha11-info1-apk-and-source
          path: output/*
          retention-days: 90
