name: MemoryJo v1.2.48 native shortcut DEX
on:
  push:
    branches:
      - memoryjo-v1248-shortcut-build
    paths:
      - .github/workflows/memoryjo-v1248-shortcut.yml
      - memoryjo-v1248-ci/BookActivity.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shortcut-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile addon referencing original MainActivity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/stubsrc/tw/joyce/xiaobenben build/stubclasses build/classes build/dex
          printf '%s\n' 'package tw.joyce.xiaobenben; public class MainActivity extends android.app.Activity {}' > build/stubsrc/tw/joyce/xiaobenben/MainActivity.java
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/stubclasses build/stubsrc/tw/joyce/xiaobenben/MainActivity.java
          jar cf build/mainstub.jar -C build/stubclasses .
          javac -source 8 -target 8 -cp "$ANDROID_JAR:build/mainstub.jar" -d build/classes memoryjo-v1248-ci/BookActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --release --min-api 26 --lib "$ANDROID_JAR" --classpath build/mainstub.jar --output build/dex $(find build/classes -name '*.class')
          sha256sum build/dex/classes.dex
          echo "DEX_BYTES=$(stat -c%s build/dex/classes.dex)"
      - uses: actions/upload-artifact@v4
        with:
          name: memoryjo-v1248-classes2-dex
          path: build/dex/classes.dex
          retention-days: 7
