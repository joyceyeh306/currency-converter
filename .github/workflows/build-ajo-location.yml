name: Build Ajo Where v1

on:
  push:
    branches: [ajo-location-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: ajo_where
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect release kit
        run: |
          cp ajo_where/app/build/outputs/apk/release/app-release-unsigned.apk app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: ajo-where-v1-release-kit
          path: |
            app-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
