name: Ajo Phone Master 003 Build
on:
  push:
    branches: [ajo-phone-master-003-build]
    paths:
      - 'ajo-phone-master/003/source.tar.gz.b64'
      - '.github/workflows/ajo-phone-master-003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract 003 full source
        run: |
          mkdir -p ajo-phone-master/003/build
          base64 --decode ajo-phone-master/003/source.tar.gz.b64 | tar -xz -C ajo-phone-master/003/build
          test -f ajo-phone-master/003/build/app/build.gradle
      - name: Build 003
        run: gradle --no-daemon --stacktrace -p ajo-phone-master/003/build :app:assembleRelease
      - name: Collect unsigned release candidate
        run: |
          cp ajo-phone-master/003/build/app/build/outputs/apk/release/app-release-unsigned.apk ajo-phone-master_003-unsigned-release.apk
          sha256sum ajo-phone-master_003-unsigned-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ajo-phone-master_003-unsigned-release.apk | head -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-phone-master-003-unsigned-release
          path: ajo-phone-master_003-unsigned-release.apk
          if-no-files-found: error
          retention-days: 30
