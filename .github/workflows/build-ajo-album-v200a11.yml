name: Build Ajo Album v2.0.0-alpha11

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ajo-album-v200a11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout album source branch
        uses: actions/checkout@v6
        with:
          ref: photo-manager-v1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore selected app icon
        run: |
          mkdir -p photo_manager_app/app/src/main/res/drawable
          tr -d '\n\r ' < photo_manager_build/icon.b64 | base64 -d > /tmp/ajo-photo-icon.png
          cp /tmp/ajo-photo-icon.png photo_manager_app/app/src/main/res/drawable/app_icon.png

      - name: Verify alpha11 sources
        run: |
          grep -q "versionName '2.0.0-alpha11'" photo_manager_app/app/build.gradle
          grep -q "dragTargetId" photo_manager_app/app/src/main/java/tw/ajo/photomanager/CollectionScreen.kt
          grep -q "fun PhotoOrganizerScreen" photo_manager_app/app/src/main/java/tw/ajo/photomanager/OrganizerScreen.kt
          grep -q "keywordsFor" photo_manager_app/app/src/main/java/tw/ajo/photomanager/AlbumData.kt
          grep -q "repository.matchesKeyword" photo_manager_app/app/src/main/java/tw/ajo/photomanager/MainActivity.kt
          grep -q "dayOfMonth.toString() + \"日\"" photo_manager_app/app/src/main/java/tw/ajo/photomanager/MainActivity.kt
          grep -q "Only remember the destination" photo_manager_app/app/src/main/java/tw/ajo/photomanager/CollectionScreen.kt
          grep -q "softWrap = false" photo_manager_app/app/src/main/java/tw/ajo/photomanager/MainActivity.kt
          grep -q "isTilesScaledToDpi = true" photo_manager_app/app/src/main/java/tw/ajo/photomanager/MapScreens.kt
          grep -q "smart:other_devices" photo_manager_app/app/src/main/java/tw/ajo/photomanager/CollectionScreen.kt
          grep -q "pendingCollectionDeleteKeys" photo_manager_app/app/src/main/java/tw/ajo/photomanager/MainActivity.kt

      - name: Build release APK
        working-directory: photo_manager_app
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/ajo-album-v200a11-build.log

      - name: Sign APK
        run: |
          # Use the GitHub AOSP mirror first. It is the same public Android test
          # key used by previous builds, but avoids transient googlesource 503s.
          for i in {1..6}; do
            curl --connect-timeout 15 --max-time 45 -fsSL 'https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8' -o /tmp/testkey.pk8 && [ -s /tmp/testkey.pk8 ] && break
            sleep 3
          done
          for i in {1..6}; do
            curl --connect-timeout 15 --max-time 45 -fsSL 'https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem' -o /tmp/testkey.x509.pem && [ -s /tmp/testkey.x509.pem ] && break
            sleep 3
          done
          test -s /tmp/testkey.pk8
          test -s /tmp/testkey.x509.pem
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 photo_manager_app/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ajo-album-v2.0.0-alpha11-aligned.apk
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out /tmp/ajo-album-v2.0.0-alpha11.apk /tmp/ajo-album-v2.0.0-alpha11-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/ajo-album-v2.0.0-alpha11.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajo-album-v2.0.0-alpha11
          path: /tmp/ajo-album-v2.0.0-alpha11.apk
          retention-days: 30
