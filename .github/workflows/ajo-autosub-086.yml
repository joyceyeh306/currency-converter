name: Ajo Autosub 086 Compact Pill Time Buttons
on:
  push:
    branches: [ajo-autosub-086-build]
  pull_request:
    branches: [ajo-autosub-085-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 071 source through its identical steps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-071.yml').read_text())['jobs']['build']['steps']
          stop=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 NDK and ARM64 compiler':
                  stop=True
                  break
              if 'run' in step:
                  print('071:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert stop and Path('subtitle-build-work/app/src/main/java/tw/ajo/autosubtitles/WhisperConfidenceTrace071.java').is_file()
          PYBASE
      - name: Apply 072 diagnostic-only patch and run regressions
        shell: bash
