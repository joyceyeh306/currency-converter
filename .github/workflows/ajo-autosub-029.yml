          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='6b7e96284744a831b094d27881e440d51b55c90fc45a94d0b6289849a9689d39', 'bad v025 patch'
          pathlib.Path('v025.patch').write_bytes(patch)
          PY
