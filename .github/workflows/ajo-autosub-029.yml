          grep -F "versionName '025'" app/build.gradle
          grep -F "versionCode 25" app/build.gradle
          grep -F 'AndroidWordTiming.align(recognizedParts,voice,' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          test -f app/src/main/java/tw/ajo/autosubtitles/AndroidWordTiming.java
          test -f tests/Version025Tests.java
      - name: Apply verified 026 Whisper CPU experiment patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('subtitle-build-payload')
          encoded=''.join((p/('v026patch'+str(i)+'.txt')).read_text().strip() for i in range(2))
          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='cd9ef1bc7b9f80a99a66e13a449ce771d63b241c6da80b40206824779c362a70','bad v026 patch'
          pathlib.Path('v026.patch').write_bytes(patch)
