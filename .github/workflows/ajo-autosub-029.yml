          grep -F 'androidModelDownloadTag=modelTag' app/src/main/java/tw/ajo/autosubtitles/MainActivity.java
          test -f tests/Version021Tests.java
      - name: Apply verified 022 audio feed and three-mode timers patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('subtitle-build-payload')
          encoded=''.join((p/('v022patch'+str(i)+'.txt')).read_text().strip() for i in range(2))
          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e128c5f43dbd25512e58e42312d769a1a5c86eebc4f4ff85bbba362b02f6d724','bad v022 patch'
          pathlib.Path('v022.patch').write_bytes(patch)
          PY
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../v022.patch
          patch --batch -p1 < ../v022.patch
          grep -F "versionName '022'" app/build.gradle
          grep -F "versionCode 22" app/build.gradle
          grep -F 'deliveredBytes.addAndGet(read)' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          grep -F 'pendingWindows.addFirst(new FreeRecognitionPlan.Window(realEnd, plannedEnd, 0))' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          grep -F 'startRecognitionClock("雲端多人辨識")' app/src/main/java/tw/ajo/autosubtitles/MainActivity.java
          test -f tests/Version022Tests.java
      - name: Apply verified 023 subtitle interval correction patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('subtitle-build-payload')
          encoded=''.join((p/('v023patch'+str(i)+'.txt')).read_text().strip() for i in range(2))
          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e51c8ec4115da2776b8f61cadb2257199010a1b18a572a4614cad8c5b5ec0b36','bad v023 patch'
          # v022's generated README differs between local source and Actions reconstruction.
          # The code/test/Gradle hunks stay SHA-verified; strip only the README prose hunk.
          begin=patch.index(b'--- a/README.md\n+++ b/README.md\n')
          end=patch.index(b'--- /dev/null\n+++ b/CHANGELOG_023.md',begin)
          pathlib.Path('v023.patch').write_bytes(patch[:begin]+patch[end:])
          PY
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../v023.patch
          patch --batch -p1 < ../v023.patch
          printf '\n\n## 023 Android 字幕時間修正\n詳見 CHANGELOG_023.md。字幕時間經合理性檢查，仍需要 OPPO 實機測試。\n' >> README.md
          grep -F "versionName '023'" app/build.gradle
          grep -F "versionCode 23" app/build.gradle
          grep -F 'AndroidCaptionTiming.repair(captions,voice,cursorMs,currentEndMs)' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          test -f app/src/main/java/tw/ajo/autosubtitles/AndroidCaptionTiming.java
          test -f tests/Version023Tests.java
      - name: Apply verified 024 voice anchored subtitle timing patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,brotli,hashlib
          p=pathlib.Path('subtitle-build-payload')
          encoded=''.join((p/('v024patch'+str(i)+'.txt')).read_text().strip() for i in range(3))
