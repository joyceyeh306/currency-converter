          patch --batch -p1 < ../v024.patch
          printf '\n\n## 024 Android 聲音時間錨點\n詳見 CHANGELOG_024.md。依真實聲音活動與停頓估計字幕時間，仍須 OPPO 實機比對。\n' >> README.md
          grep -F "versionName '024'" app/build.gradle
          grep -F "versionCode 24" app/build.gradle
          grep -F 'CHUNK_MS = 6000;' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          grep -F 'AndroidVoiceAlignment.align(transcriptPieces, voice, cursorMs, currentEndMs)' app/src/main/java/tw/ajo/autosubtitles/AudioRecognizer.java
          test -f app/src/main/java/tw/ajo/autosubtitles/AndroidVoiceAlignment.java
          test -f tests/Version024Tests.java
      - name: Apply verified 025 timestamp validation and transcript recovery patch
