name: Build Ajo Photo Text 003
on:
  push:
    branches: [ajo-ocr-rebuild-003]
    paths:
      - 'ajo-phototext-003/**'
      - '.github/workflows/build-ajo-phototext-003.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cache personal signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ajo-phototext-003.jks
          key: ajo-phototext-003-keystore-release-v1
      - name: Generate signing key if absent
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/ajo-phototext-003.jks ]; then
            keytool -genkeypair -keystore ~/.android/ajo-phototext-003.jks -storepass android -keypass android -alias ajophototext -dname "CN=Ajo Photo Text,O=Ajo,C=TW" -keyalg RSA -keysize 3072 -validity 10000
          fi
      - name: Compile Android release APK
        working-directory: ajo-phototext-003
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify release certificate
        run: |
          ls -lh ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
      - name: Build distribution ZIP and stable filenames
        run: |
          mkdir -p release
          cp ajo-phototext-003/app/build/outputs/apk/release/app-release.apk release/AjoPhotoText_003.apk
          rm -f release/AjoPhotoText_003_source.zip
          zip -rq release/AjoPhotoText_003_source.zip ajo-phototext-003 -x '*/build/*' '*/.gradle/*' '*.gradle.lockfile'
          ls -lh release
      - name: Upload install APK and complete source
        uses: actions/upload-artifact@v4
        with:
          name: AjoPhotoText-003
          path: |
            release/AjoPhotoText_003.apk
            release/AjoPhotoText_003_source.zip
          if-no-files-found: error
      - name: Publish both files on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/AjoPhotoText_003.apk release/AjoPhotoText_003_source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Ajo Photo Text 003 APK and source archive"
            git push
          fi
