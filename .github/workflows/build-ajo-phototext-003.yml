name: Build Ajo Photo Text 007
on:
  push:
    branches: [ajo-ocr-rebuild-003]
    paths:
      - 'ajo-phototext-003/**'
      - '.github/workflows/build-ajo-phototext-003.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cache personal signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ajo-phototext-003.jks
          key: ajo-phototext-003-keystore-release-v1
      - name: Require original 003 signing key
        run: |
          mkdir -p ~/.android
          test -s ~/.android/ajo-phototext-003.jks || { echo "003 signing key unavailable; refusing to generate a different key"; exit 1; }
      - name: Compile Android release APK
        working-directory: ajo-phototext-003
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify release certificate
        run: |
          ls -lh ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OLD=$("$BT/apksigner" verify --print-certs release/AjoPhotoText_003.apk | grep 'certificate SHA-256 digest:')
          NEW=$("$BT/apksigner" verify --print-certs ajo-phototext-003/app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256 digest:')
          echo "$OLD"
          echo "$NEW"
          test -n "$OLD" && test "$OLD" = "$NEW"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 ajo-phototext-003/app/build/outputs/apk/release/app-release.apk
      - name: Build distribution ZIP and stable filenames
        run: |
          mkdir -p release
          cp ajo-phototext-003/app/build/outputs/apk/release/app-release.apk release/AjoPhotoText_007.apk
          rm -f release/AjoPhotoText_007_source.zip
          zip -rq release/AjoPhotoText_007_source.zip ajo-phototext-003 -x '*/build/*' '*/.gradle/*' '*.gradle.lockfile'
          ls -lh release
      - name: Upload install APK and complete source
        uses: actions/upload-artifact@v4
        with:
          name: AjoPhotoText-007
          path: |
            release/AjoPhotoText_007.apk
            release/AjoPhotoText_007_source.zip
          if-no-files-found: error
      - name: Publish both files on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/AjoPhotoText_007.apk release/AjoPhotoText_007_source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Ajo Photo Text 007 APK and source archive"
            git push
          fi
