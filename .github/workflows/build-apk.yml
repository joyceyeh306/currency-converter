name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply source hotfix
        run: sed -i 's/private TextView makeResultRow/private LinearLayout makeResultRow/' app/src/main/java/com/joyce/currencyconverter/MainActivity.java

      - name: Prepare built-in image assets
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for src, dst in [
              ('app/icon/ic_launcher.webp.b64', 'app/src/main/res/drawable/ic_launcher.webp'),
              ('app/icon/flags_sprite.png.b64', 'app/src/main/res/drawable-nodpi/flags_sprite.png'),
          ]:
              data = ''.join(Path(src).read_text().split())
              data += '=' * ((4 - len(data) % 4) % 4)
              Path(dst).write_bytes(base64.b64decode(data, validate=False))
          PY

      - name: Apply built-in flag image patch
        run: python3 .github/patch_flags.py

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
