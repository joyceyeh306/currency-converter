name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: currency-converter-debug-keystore-v1

      - name: Create stable signing key when missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Prepare embedded assets
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/java/com/joyce/currencyconverter
          python3 - <<'PY'
          import base64
          from pathlib import Path

          launcher = ''.join(Path('app/icon/ic_launcher.webp.b64').read_text().split())
          launcher += '=' * ((4 - len(launcher) % 4) % 4)
          Path('app/src/main/res/drawable/ic_launcher.webp').write_bytes(
              base64.b64decode(launcher, validate=False)
          )

          flags = ''.join(Path('app/icon/flags_sprite.png.b64').read_text().split())
          raw = base64.b64decode(flags + '=' * ((4 - len(flags) % 4) % 4), validate=False)
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'flag sprite is not a PNG'
          assert len(raw) > 7000, 'flag sprite is unexpectedly small'

          java = (
              'package com.joyce.currencyconverter;\n\n'
              'final class FlagSprite {\n'
              '    static final String DATA = "' + flags + '";\n'
              '    private FlagSprite() {}\n'
              '}\n'
          )
          Path('app/src/main/java/com/joyce/currencyconverter/FlagSprite.java').write_text(
              java, encoding='utf-8'
          )
          print('Flag sprite bytes:', len(raw))
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
