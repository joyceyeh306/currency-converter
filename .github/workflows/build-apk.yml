name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: currency-converter-debug-keystore-v1

      - name: Create stable signing key when missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Prepare launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          python3 - <<'PY'
          import base64
          from pathlib import Path
          launcher = ''.join(Path('app/icon/ic_launcher.webp.b64').read_text().split())
          launcher += '=' * ((4 - len(launcher) % 4) % 4)
          Path('app/src/main/res/drawable/ic_launcher.webp').write_bytes(
              base64.b64decode(launcher, validate=False)
          )
          PY

      - name: Download built-in flag images
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-nodpi
          countries="tw us eu jp kr gb ch no cn hk sg au nz ca th my id ph vn in ae sa tr se dk pl cz hu mx za"
          for c in $countries; do
            echo "Downloading $c"
            curl -fL --retry 3 --retry-delay 1 "https://flagcdn.com/w80/${c}.png" \
              -o "app/src/main/res/drawable-nodpi/flag_${c}.png"
            test -s "app/src/main/res/drawable-nodpi/flag_${c}.png"
          done
          ls -lh app/src/main/res/drawable-nodpi/flag_*.png

      - name: Apply resource flag patch
        run: python3 .github/patch_resource_flags.py

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
