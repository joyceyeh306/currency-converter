name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply source hotfix
        run: sed -i 's/private TextView makeResultRow/private LinearLayout makeResultRow/' app/src/main/java/com/joyce/currencyconverter/MainActivity.java

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
