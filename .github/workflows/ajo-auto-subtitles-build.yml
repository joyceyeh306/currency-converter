name: Ajo Autosub 004 Android Build
on:
  push:
    branches: [ajo-autosub-004-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified v004 source
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64,brotli,hashlib,io,pathlib,tarfile
          payload=''.join(pathlib.Path(f'subtitle-build-payload/v004p{i}.txt').read_text() for i in range(3))
          binary=brotli.decompress(base64.b64decode(payload,validate=True))
          expected='493f16fcc7c764e2063dd775745b7aa3dba4f27cf2cf5d4756bb68778563ef7c'
          assert hashlib.sha256(binary).hexdigest()==expected, 'v004 source archive digest mismatch'
          target=pathlib.Path('subtitle-build-work')
          target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(binary)) as t:
              t.extractall(target,filter='data')
          print('Verified v004 source tree')
          PY
      - name: Generate TEMPORARY signing key for compilation only
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 9000 -dname "CN=TemporaryBuild,O=Ajo,C=TW" -noprompt
          echo 'NOTICE: The APK will be RESIGNED locally with the preserved private v003 keystore before delivery.'
      - name: Test subtitle timing and quality
        run: |
          cd subtitle-build-work
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java app/src/main/java/tw/ajo/autosubtitles/ExportQuality.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java tests/CoreTests.java
          java -cp tests/build CoreTests
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Build temporary debug APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK for LOCAL re-signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_004-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package public Android APK signer tool
        run: |
          mkdir -p android-apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-apksigner-tool/
          cp "$ANDROID_HOME"/build-tools/35.0.0/lib/* android-apksigner-tool/lib/
          chmod +x android-apksigner-tool/apksigner
          echo 'Packaged apksigner without any private key'
      - name: Upload signer utility
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: android-apksigner-tool/
          if-no-files-found: error
