name: Ajo Autosub 003 Installation Fix
on:
  push:
    branches: [ajo-autosub-003-install-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct exact source archive
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64, brotli, hashlib, io, pathlib, tarfile
          payload = ''.join(pathlib.Path(f'subtitle-build-payload/p{i:02d}.txt').read_text() for i in range(5))
          data = brotli.decompress(base64.b64decode(payload, validate=True))
          expected = '01ec58eec826db374424ee1498263c9d4029508f12bf47a16cfbe406a94ca6ca'
          assert hashlib.sha256(base64.b64decode(payload)).hexdigest() == expected, "Payload SHA256 mismatch"
          target = pathlib.Path('subtitle-build-work')
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data)) as tar:
              tar.extractall(target, filter='data')
          print('Source archive rebuilt; files:', len(list(target.rglob('*'))))
          PY
      - name: Set compile SDK 36
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/' subtitle-build-work/app/build.gradle
          echo 'android.suppressUnsupportedCompileSdk=36' >> subtitle-build-work/gradle.properties
      - name: Apply subtitles v002 changes
        run: |
          python3 - <<'PY'
          import base64, brotli, hashlib, pathlib
          encoded = ''.join(pathlib.Path(f'subtitle-build-payload/002delta{i}.txt').read_text() for i in range(2))
          patch = brotli.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0b30f557869276f6ff5ce61f2fa55b45a894f0ac99c58ef53081926b790b5d11', 'v002 patch digest mismatch'
          pathlib.Path('002.patch').write_bytes(patch)
          print('v002 patch verified:', len(patch), 'bytes')
          PY
          cd subtitle-build-work
          git apply --check ../002.patch
          git apply ../002.patch
          grep -F "versionName '002'" app/build.gradle
          grep -F 'preferOffline.setChecked(false)' app/src/main/java/tw/ajo/autosubtitles/MainActivity.java
      - name: Make v003 installable alongside v001
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('subtitle-build-work')
          gradle=root/'app/build.gradle'
          s=gradle.read_text()
          changes={
            "applicationId 'tw.ajo.autosubtitles'": "applicationId 'tw.ajo.autosubtitles.next'",
            "versionCode 2": "versionCode 3",
            "versionName '002'": "versionName '003'"
          }
          for old,new in changes.items():
            assert s.count(old)==1, (old,s.count(old))
            s=s.replace(old,new)
          gradle.write_text(s)
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          assert m.count('android:label="ㄚ喬自動字幕"')==1
          manifest.write_text(m.replace('android:label="ㄚ喬自動字幕"', 'android:label="ㄚ喬自動字幕 003"'))
          (root/'README.md').write_text(
            '# ㄚ喬自動字幕 003（安裝衝突修正版）\\n\\n'
            '此版使用 tw.ajo.autosubtitles.next，避免與已安裝的 001 版發生不同簽章衝突。\\n'
            '它是獨立 App，不會自動帶入原 App 的字幕資料。\\n'
            '往後版號 004、005 必須保持相同 applicationId，並使用隨 ZIP 保留的 signing/ajo-autosub-signing.keystore 進行簽章，方能覆蓋更新。\\n'
            '簽章備份屬私人金鑰，請勿公開上傳。此版為測試用途，尚待 OPPO 實機驗證。\\n',
            encoding='utf-8')
          print('applicationId=tw.ajo.autosubtitles.next versionCode=3 versionName=003')
          PY
      - name: Generate and preserve v003 signing certificate
        run: |
          mkdir -p "$HOME/.android" subtitle-build-work/signing
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=AjoAutosub003,O=Personal App,C=TW" -noprompt
          cp "$HOME/.android/debug.keystore" subtitle-build-work/signing/ajo-autosub-signing.keystore
          cat > subtitle-build-work/signing/README.txt <<'TXT'
          This is the PRIVATE Android signing key for ajo-autosub 003 and future updates.
          Keep this file private. Do NOT upload it to a public GitHub repository.
          Debug keystore alias: androiddebugkey
          Debug keystore passwords: android / android
          Android applicationId: tw.ajo.autosubtitles.next
          TXT
      - name: Compile subtitle core classes
        run: |
          cd subtitle-build-work
          mkdir -p build/verify
          javac -encoding UTF-8 -d build/verify app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SrtCodec.java app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Assemble debug APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_003-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify signed APK and create complete source ZIP
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          cd subtitle-build-work
          zip -qr ../ajo-autosub_003.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties .github README.md signing
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_003-source
          path: ajo-autosub_003.zip
          if-no-files-found: error
