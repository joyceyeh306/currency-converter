name: Ajo Auto Subtitles Android Build
on:
  push:
    branches: [ajo-auto-subtitles-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct exact source archive
        run: |
          python3 -m pip install brotli
          python3 - <<'PY'
          import base64, brotli, hashlib, io, pathlib, tarfile
          payload = ''.join(pathlib.Path(f'subtitle-build-payload/p{i:02d}.txt').read_text() for i in range(5))
          data = brotli.decompress(base64.b64decode(payload, validate=True))
          expected = '01ec58eec826db374424ee1498263c9d4029508f12bf47a16cfbe406a94ca6ca'
          assert hashlib.sha256(base64.b64decode(payload)).hexdigest() == expected, "Payload SHA256 mismatch"
          target = pathlib.Path('subtitle-build-work')
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data)) as tar:
              tar.extractall(target, filter='data')
          print('Source archive rebuilt; files:', len(list(target.rglob('*'))))
          PY
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Assemble debug APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ajo-auto-subtitles-v1.0.0-alpha01-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
