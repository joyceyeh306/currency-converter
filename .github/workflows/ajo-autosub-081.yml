      - name: Apply 077 single-paid rollback and English safety guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY077'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-077/bundle.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='5fe4d2bf72ec25f5692ef158a52a04c3eaab4f51b5c714f0a6d3a93db1fd3fb5'
          Path('subtitle-build-work/077.patch').write_bytes(raw)
          PY077
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 077.patch
          patch --batch -p1 < 077.patch
          grep -F 'versionCode 77' app/build.gradle
          grep -F "versionName '077'" app/build.gradle
          mkdir -p tests/build077
          javac -encoding UTF-8 -d tests/build077 \
            app/src/main/java/tw/ajo/autosubtitles/Caption.java \
            app/src/main/java/tw/ajo/autosubtitles/CaptionPunctuation.java \
            app/src/main/java/tw/ajo/autosubtitles/CaptionSplitter.java \
            app/src/main/java/tw/ajo/autosubtitles/SpeechTiming.java \
            app/src/main/java/tw/ajo/autosubtitles/SpeakerCaptionizer.java \
