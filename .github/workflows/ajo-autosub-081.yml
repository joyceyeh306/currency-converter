            app/src/main/java/tw/ajo/autosubtitles/WhisperReview076.java \
            tests/Version074Tests.java \
            tests/Version075Tests.java \
            tests/Version076Tests.java \
            tests/Version077Tests.java
          java -cp tests/build077 Version074Tests
          java -cp tests/build077 Version075Tests
          java -cp tests/build077 Version076Tests
          java -cp tests/build077 Version077Tests
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Apply 078 offline Chinese typography normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY078'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-078/bundle.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='d1657ea2006005c107b7604a82dd985c2b37ab253de7bc819c42d81b07506bc0'
          Path('subtitle-build-work/078.patch').write_bytes(raw)
          PY078
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 078.patch
          patch --batch -p1 < 078.patch
          # Variant guard is a separate audited source patch, never a runtime change.
          echo '0139bd12cc04bb30acd154ae26de73d3d5e316c4c1b379dc102eaf64a578a61b  ../patches/ajo-autosub-078/taiwan-variant-guard.patch' | sha256sum -c -
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-078/taiwan-variant-guard.patch
          patch --batch -p1 < ../patches/ajo-autosub-078/taiwan-variant-guard.patch
          grep -F 'versionCode 78' app/build.gradle
          grep -F "versionName '078'" app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Apply 079 compact, persistent UI groups and verify handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY079'
          import base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-079/ui-migration.zlib.b64').read_text().strip()))
          assert hashlib.sha256(data).hexdigest()=='0db43fd394424c9534dadfa023636a5350ee2b28222309f58ec2411718e09861'
          Path('subtitle-build-work/079-ui-migration.py').write_bytes(data)
          PY079
          cd subtitle-build-work
          python3 079-ui-migration.py
          grep -F 'versionCode 79' app/build.gradle
          grep -F "versionName '079'" app/build.gradle
          python3 - <<'PYCHECK'
          from pathlib import Path
          s=Path('app/src/main/java/tw/ajo/autosubtitles/MainActivity.java').read_text()
          for key in ['ajo_079_settings_advanced','ajo_079_settings_diagnostics','ajo_079_editor_segments','ajo_079_editor_ai']:
              assert s.count('"'+key+'"')==1
          for x in ['runOverlapSecondPass043()','showTimingReviewList()','reviewMissingVoice062()',
                    'showPromptCompareDialog073()','showOralCandidateList074()','showOralPriority076()',
                    'retryCaptionWithWhisper(c)','showCandidateForEditedCaption074(c)',
                    'reviewCaptionTiming(c)','splitEditingCaption()',
                    'mergeEditingCaption()','mergeNextCaption046()','playCaptionRange(c)']:
              assert x in s, x
          assert s.index('editingStartLabel=addTimeStepper(editingBody') < s.index('LinearLayout segmentTools079=')
          assert s.index('LinearLayout segmentTools079=') < s.index('LinearLayout aiTools079=')
          assert s.count('private LinearLayout addFoldSection079(')==1
          print('079: UI grouping, feature handlers, and editor time-step order verified')
          PYCHECK
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Apply 080 restored quick split/merge layout and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY080'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-080/layout-fix.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='8a268b998a32174b68f166cee06a256745307c9c73eee9b67a12dd184000fff9'
          Path('subtitle-build-work/080.patch').write_bytes(raw)
          PY080
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 080.patch
          patch --batch -p1 < 080.patch
          python3 - <<'PYCHECK080'
          from pathlib import Path
          s=Path('app/src/main/java/tw/ajo/autosubtitles/MainActivity.java').read_text()
          code=s[s.index('private void openCaptionEditor'):s.index('private void updateLocalAppearanceLabels')]
          a=['editingBody.addView(editingText','editingBody.addView(controls)','editingBody.addView(splitter)','editingStartLabel=addTimeStepper','editingEndLabel=addTimeStepper','editingBody.addView(toggleStyle)','LinearLayout segmentTools080=','LinearLayout aiTools079=','editingBody.addView(nav)']
          assert all(code.count(x)==1 for x in a)
          assert all(code.index(a[i])<code.index(a[i+1]) for i in range(len(a)-1))
          for x in ['split.setOnClickListener(v->splitEditingCaption());','merge.setOnClickListener(v->mergeEditingCaption());','mergeNext.setOnClickListener(v->mergeNextCaption046());','previous.setOnClickListener(v -> moveEditingSelection(-1));','next.setOnClickListener(v -> moveEditingSelection(1));']:
              assert x in code,x
          assert 'segmentTools079' not in code
          assert 'ajo_079_settings_advanced' in s and 'ajo_079_settings_diagnostics' in s
          b=Path('app/build.gradle').read_text()
          assert 'versionCode 80' in b and "versionName '080'" in b
          print('080 original fast-access editor order: PASS')
          PYCHECK080
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Apply 081 consistent button heights, gaps and haptic feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY081'
          import base64,zlib,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('patches/ajo-autosub-081/ui-haptic.zlib.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='41e3cdf9faf9e32159f1ebfcbac5e6d23b9618873329f8ff5a09833c636fafd4'
          Path('subtitle-build-work/081-ui-haptic.py').write_bytes(raw)
          PY081
          cd subtitle-build-work
          python3 081-ui-haptic.py
          # The missing-voice dialog already has an argument named 'which'.
          # Use a different name for its positive/negative button loop.
          python3 - <<'PYFIX081'
          from pathlib import Path
          p=Path('app/src/main/java/tw/ajo/autosubtitles/MainActivity.java')
          s=p.read_text()
          start=s.index('private void showMissingVoiceItem062(')
          end=s.index('private void retryCaptionWithWhisper(',start)
          section=s[start:end]
          section=section.replace('for(int which:new int[]{AlertDialog.BUTTON_POSITIVE,AlertDialog.BUTTON_NEGATIVE})',
                                  'for(int buttonKind:new int[]{AlertDialog.BUTTON_POSITIVE,AlertDialog.BUTTON_NEGATIVE})')
          section=section.replace('Button b=dlg.getButton(which);','Button b=dlg.getButton(buttonKind);')
          assert 'for(int buttonKind:new int[]{AlertDialog.BUTTON_POSITIVE,AlertDialog.BUTTON_NEGATIVE})' in section
          assert 'Button b=dlg.getButton(buttonKind);' in section
          s=s[:start]+section+s[end:]
          p.write_text(s)
          PYFIX081
          python3 - <<'PYCHECK081'
          from pathlib import Path
          s=Path('app/src/main/java/tw/ajo/autosubtitles/MainActivity.java').read_text()
          assert s.count('private final class AjoHapticButton extends Button')==1
          assert s.count('private final class HapticDialogBuilder extends AlertDialog.Builder')==1
          assert 'new AlertDialog.Builder(' not in s
          assert s.count('new HapticDialogBuilder(')>40
          assert s.count('new AjoHapticButton(this)')==1
          for k in ['AjoHapticImageButton','AjoHapticRadioButton','AjoHapticCheckBox','dp(52)','dp(48)']:
              assert k in s
          assert s.index('editingBody.addView(controls)')<s.index('editingBody.addView(splitter)')<s.index('editingStartLabel=addTimeStepper')
          g=Path('app/build.gradle').read_text()
          assert 'versionCode 81' in g and "versionName '081'" in g
          print('081 haptic and layout source checks: PASS')
          PYCHECK081
          test ! -f signing/ajo-autosub-signing.keystore

      - name: Install Android SDK 36 ARM64 tools
        shell: bash
        run: |
          set -eu
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || true
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Temp081,O=Ajo,C=TW' -noprompt
      - name: Compile 081 ARM64 Android APK
        run: gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
      - name: Update legacy 078 regression version assertion for 081
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          python3 - <<'PYTEST'
          from pathlib import Path
          p=Path('tests/Version078Tests.java')
          s=p.read_text()
          old="ok(gradle.contains(\"versionCode 78\")&&gradle.contains(\"versionName '078'\"),\"version 078\");"
          new="ok(gradle.contains(\"versionCode 81\")&&gradle.contains(\"versionName '081'\"),\"version 081 (078 recognition behavior)\");"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PYTEST

      - name: Resolve Opencc4j and run 078 Java regressions
        shell: bash
        run: |
          set -euo pipefail
          gradle -p subtitle-build-work :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/ajo078-deps.txt
          grep 'opencc4j:1.14.0' /tmp/ajo078-deps.txt
          cd subtitle-build-work
          JARS=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -name '*.jar' -type f | paste -sd: -)
          test -n "$JARS"
          mkdir -p tests/build078
          javac -encoding UTF-8 -cp "$JARS" -d tests/build078 \
            app/src/main/java/tw/ajo/autosubtitles/Caption.java \
            app/src/main/java/tw/ajo/autosubtitles/WhisperCandidate074.java \
            app/src/main/java/tw/ajo/autosubtitles/TaiwanTraditional078.java \
            tests/Version078Tests.java
          java -cp "tests/build078:$JARS" Version078Tests

      - name: Verify 081 version and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='81'.*versionName='081'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_081-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and apksigner
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-081-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5
