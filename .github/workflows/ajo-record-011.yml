name: Ajo Record 011 Microphone Input and Gain
on:
  push:
    branches: [ajo-record-011-build]
    paths:
      - '.github/workflows/ajo-record-011.yml'
      - 'patches/ajo-record-011/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 010 source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYRESTORE'
          import yaml,subprocess
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-record-010.yml').read_text())['jobs']['build']['steps']
          found=False
          for step in steps:
              if step.get('name')=='Install SDK 36 and ARM64 tools':
                  found=True
                  break
              if 'run' in step:
                  print('Restore 010:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert found and Path('subtitle-build-work/app/src/main/java/tw/ajo/record/RecordingService.java').is_file()
          PYRESTORE
      - name: Apply 011 microphone patch and run PCM safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY011'
          from pathlib import Path
          import base64,zlib,hashlib
          s=Path('patches/ajo-record-011/bundle011.zlib.b64').read_text().strip()
          raw=zlib.decompress(base64.b64decode(s))
          assert hashlib.sha256(raw).hexdigest()=='a1bf4882f9a269a2129dfcb545cdb5f6a106ad98fbf12f408e2a7770ae7733a3','patch checksum mismatch'
          Path('subtitle-build-work/011.patch').write_bytes(raw)
          PY011
          cd subtitle-build-work
          patch --dry-run --batch -p1 < 011.patch
          patch --batch -p1 < 011.patch
          grep -F 'versionCode 11' app/build.gradle
          grep -F "versionName '011'" app/build.gradle
          grep -F "applicationId 'tw.ajo.record'" app/build.gradle
          test -f app/src/main/java/tw/ajo/record/AdaptiveVoiceGain011.java
          grep -F 'VOICE_RECOGNITION' app/src/main/java/tw/ajo/record/RecordingService.java
          grep -F 'AutomaticGainControl.create' app/src/main/java/tw/ajo/record/RecordingService.java
          grep -F 'AudioFiles.makeWav(lastRawPcm' app/src/main/java/tw/ajo/record/RecordingService.java
          test ! -f signing/ajo-autosub-signing.keystore
          mkdir -p tests/build011
          javac -encoding UTF-8 -d tests/build011 \
             app/src/main/java/tw/ajo/record/AdaptiveVoiceGain011.java \
             ../patches/ajo-record-011/TEST_GAIN_011.java
          java -cp tests/build011 TEST_GAIN_011
      - name: Install SDK 36 and ARM64 NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || true
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - name: Compile and verify Record 011
        shell: bash
        run: |
          set -euo pipefail
          gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='tw.ajo.record' versionCode='11' versionName='011'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-record_011-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
          sha256sum "$APK" > build-out/sha256.txt
      - name: Upload temporary APK for original signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-record-011-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 7
