name: Ajo Photo Text 001
on:
  push:
    branches: [ajo-photo-text-001-build]
    paths: ['ajo-photo-text-001/**']
  pull_request:
    branches: [main]
    paths: ['ajo-photo-text-001/**']
  workflow_dispatch:
jobs:
  build-photo-text:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ajo-photo-text-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-photo-text-001
          path: ajo-photo-text-001/app/build/outputs/apk/debug/app-debug.apk
