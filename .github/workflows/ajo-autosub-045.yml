name: Ajo Autosub 045 Repeated Hallucination Recovery
on:
  push:
    branches: [ajo-autosub-045-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified 044 complete source and regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBASE'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-044.yml').read_text())['jobs']['build']['steps']
          found=False
          for step in steps:
              if step.get('name')=='Install Android SDK 36 NDK and native compiler':
                  found=True
                  break
              if 'run' in step:
                  print('044 base:',step.get('name'),flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          assert found and Path('subtitle-build-work/tests/Version044Tests.java').is_file()
          PYBASE
      - name: Apply 045 acoustic-evidence based recovery improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import brotli,base64
          raw=brotli.decompress(base64.b64decode(Path('patches/ajo-autosub-045/bundle.br.b64').read_text().strip()))
          i=0;root=Path('patches/ajo-autosub-045/generated')
          while i<len(raw):
              j=raw.index(b'\n',i);name=raw[i:j].decode();i=j+1
              j=raw.index(b'\n',i);length=int(raw[i:j]);i=j+1
              data=raw[i:i+length];i+=length
              p=root/name
              assert '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              print(name,length,flush=True)
          assert i==len(raw)
          PYBUNDLE
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../patches/ajo-autosub-045/generated/045.patch
          patch --batch -p1 < ../patches/ajo-autosub-045/generated/045.patch
          cp ../patches/ajo-autosub-045/generated/app/src/main/java/tw/ajo/autosubtitles/WhisperRecovery045.java app/src/main/java/tw/ajo/autosubtitles/
          cp ../patches/ajo-autosub-045/generated/tests/Version045Tests.java tests/
          cp ../patches/ajo-autosub-045/generated/CHANGELOG_045.md .
          grep -F "versionName '045'" app/build.gradle
          grep -F 'versionCode 45' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Run 044 and 045 regression suites, including observed eight-cue failure
        shell: bash
        run: |
          set -euo pipefail
          cd subtitle-build-work
          mkdir -p tests/build045
          javac -encoding UTF-8 -d tests/build045 app/src/main/java/tw/ajo/autosubtitles/Caption.java app/src/main/java/tw/ajo/autosubtitles/SpeechBandActivity.java app/src/main/java/tw/ajo/autosubtitles/PcmWindFilter044.java app/src/main/java/tw/ajo/autosubtitles/WhisperRecovery044.java app/src/main/java/tw/ajo/autosubtitles/WhisperRecovery045.java tests/Version044Tests.java tests/Version045Tests.java
          java -cp tests/build045 Version044Tests
          java -cp tests/build045 Version045Tests
      - name: Install Android SDK 36 NDK and native compiler
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Generate disposable CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Temp045,O=Ajo,C=TW' -noprompt
      - name: Compile ARM64 Android 045 APK
        run: gradle -p subtitle-build-work :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and preserve only public build intermediates
        shell: bash
        run: |
          set -euo pipefail
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='45'.*versionName='045'"
          mkdir -p build-out
          cp "$APK" build-out/ajo-autosub_045-temp.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-out/apksigner.jar
      - name: Upload temporary APK and signature tool; never private user keystore
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub-045-temp-and-signer
          path: build-out/
          if-no-files-found: error
          retention-days: 5