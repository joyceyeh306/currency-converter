name: Build Ajo Photo Manager v1

on:
  push:
    branches: [ photo-manager-v1 ]
    paths:
      - '.github/workflows/build-photo-manager-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: photo-manager-v1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore selected app icon
        run: |
          mkdir -p photo_manager_app/app/src/main/res/drawable
          mkdir -p photo_manager_app/app/src/main/assets
          tr -d '\n\r ' < photo_manager_build/icon.b64 | base64 -d > /tmp/ajo-photo-icon.png
          file /tmp/ajo-photo-icon.png
          cp /tmp/ajo-photo-icon.png photo_manager_app/app/src/main/res/drawable/app_icon.png
          cp /tmp/ajo-photo-icon.png photo_manager_app/app/src/main/assets/icon.png

      - name: Sanity check sources
        run: |
          test -f photo_manager_app/gradle.properties
          test -f photo_manager_app/app/src/main/java/tw/ajo/photomanager/MainActivity.java
          test -f photo_manager_app/app/src/main/assets/index.html
          test -s photo_manager_app/app/src/main/res/drawable/app_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('photo_manager_app/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/photo-manager.js').write_text(m.group(1))
          PY
          node --check /tmp/photo-manager.js
          grep -q "android.useAndroidX=true" photo_manager_app/gradle.properties
          grep -q "versionName '1.0.0'" photo_manager_app/app/build.gradle
          grep -q "ㄚ喬照片管家" photo_manager_app/app/src/main/AndroidManifest.xml

      - name: Build unsigned release APK
        id: buildapk
        continue-on-error: true
        working-directory: photo_manager_app
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/photo-manager-build.log

      - name: Sign APK with stable AOSP test key
        id: signapk
        if: steps.buildapk.outcome == 'success'
        continue-on-error: true
        run: |
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/testkey.x509.pem
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 photo_manager_app/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ajo-photo-manager-v1.0.0-aligned.apk
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out /tmp/ajo-photo-manager-v1.0.0.apk /tmp/ajo-photo-manager-v1.0.0-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/ajo-photo-manager-v1.0.0.apk | tee /tmp/photo-manager-signature.txt

      - name: Upload APK artifact
        id: uploadapk
        if: steps.signapk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ajo-photo-manager-v1.0.0
          path: /tmp/ajo-photo-manager-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish build status
        if: always()
        run: |
          mkdir -p photo_manager_output
          printf 'version=1.0.0\nbuild=%s\nsign=%s\nrun_id=%s\nsource=%s\n' \
            '${{ steps.buildapk.outcome }}' '${{ steps.signapk.outcome }}' '${{ github.run_id }}' '${{ github.sha }}' \
            > photo_manager_output/status.txt
          if [ -f /tmp/photo-manager-build.log ]; then tail -n 300 /tmp/photo-manager-build.log > photo_manager_output/build-log.txt; fi
          if [ -f /tmp/photo-manager-signature.txt ]; then cp /tmp/photo-manager-signature.txt photo_manager_output/signature.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- photo_manager_output
          git commit -m "Publish ㄚ喬照片管家 v1.0.0 build status" || exit 0
          git push origin HEAD:photo-manager-v1

      - name: Fail if build or signing failed
        if: steps.buildapk.outcome != 'success' || steps.signapk.outcome != 'success'
        run: exit 1
