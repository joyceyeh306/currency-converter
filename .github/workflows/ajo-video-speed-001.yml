name: Ajo Video Speed 001 Build
on:
  push:
    branches: [ajo-video-speed-001-build]
    paths:
      - 'ajo-video-speed/001/source.tar.gz.b64'
      - '.github/workflows/ajo-video-speed-001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack reproducible 001 project
        run: |
          mkdir -p ajo-video-speed/001/project
          base64 -d ajo-video-speed/001/source.tar.gz.b64 | tar -xz -C ajo-video-speed/001/project
          test -f ajo-video-speed/001/project/app/build.gradle
      - name: Compile unsigned release APK
        run: gradle --no-daemon --stacktrace -p ajo-video-speed/001/project :app:assembleRelease
      - name: Collect unsigned APK and local signing tools
        run: |
          cp ajo-video-speed/001/project/app/build/outputs/apk/release/app-release-unsigned.apk ajo-video-speed_001-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ajo-video-speed_001-unsigned.apk | head -n 4
          sha256sum ajo-video-speed_001-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ajo-video-speed-001-signing-candidate
          path: |
            ajo-video-speed_001-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30
