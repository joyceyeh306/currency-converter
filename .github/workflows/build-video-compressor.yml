name: Build Video Compressor APK

on:
  push:
    branches: [ video-compressor-build ]
    paths:
      - 'video-compressor/**'
      - '.github/workflows/build-video-compressor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p video-compressor :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp video-compressor/app/build/outputs/apk/debug/app-debug.apk /tmp/video-compressor-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-compressor-v1.0-apk
          path: /tmp/video-compressor-v1.0.apk
          if-no-files-found: error
