name: Build Video Compressor APK

on:
  push:
    branches: [ video-compressor-build ]
    paths:
      - 'video-compressor/**'
      - '.github/workflows/build-video-compressor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Apply OPPO MediaStore picker fix
        run: python3 video-compressor/ci_patch_v14.py

      - name: Apply metadata preservation fix
        run: python3 video-compressor/ci_patch_v15.py

      - name: Apply delete-original option
        run: python3 video-compressor/ci_patch_v16.py

      - name: Apply output-size estimate fix
        run: python3 video-compressor/ci_patch_v17.py

      - name: Apply v1.8 state and system-bar fixes
        run: python3 video-compressor/ci_patch_v18.py

      - name: Install exact selected launcher artwork
        run: |
          python3 video-compressor/ci_icon_v22.py
          EXPECTED='193da67e825bb528facde86d8a89dc6f9de53b8d70bdc7172d821a5177282136'
          grep -q 'android:icon="@mipmap/ic_launcher"' video-compressor/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' video-compressor/app/src/main/AndroidManifest.xml
          test ! -e video-compressor/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e video-compressor/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test ! -e video-compressor/app/src/main/res/drawable/ic_launcher_foreground.xml
          test ! -e video-compressor/app/src/main/res/drawable/ic_launcher_background.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            P="video-compressor/app/src/main/res/mipmap-$d/ic_launcher.jpg"
            R="video-compressor/app/src/main/res/mipmap-$d/ic_launcher_round.jpg"
            test "$(sha256sum "$P" | cut -d' ' -f1)" = "$EXPECTED"
            test "$(sha256sum "$R" | cut -d' ' -f1)" = "$EXPECTED"
            file "$P" | grep -q '256x256'
          done

      - name: Add LAME native libraries
        run: |
          rm -rf /tmp/lame-aar video-compressor/app/src/main/jniLibs
          mkdir -p /tmp/lame-aar video-compressor/app/src/main/jniLibs
          curl -fsSL 'https://repo1.maven.org/maven2/net/qiujuer/lame/lame/1.0.0/lame-1.0.0.aar' -o /tmp/lame.aar
          unzip -q /tmp/lame.aar 'jni/*' -d /tmp/lame-aar
          cp -R /tmp/lame-aar/jni/* video-compressor/app/src/main/jniLibs/
          test -f video-compressor/app/src/main/jniLibs/arm64-v8a/libmp3lame-lib.so

      - name: Build release APK
        run: gradle -p video-compressor :app:assembleRelease --stacktrace

      - name: Verify packaged launcher icon is selected bitmap
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="video-compressor/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep '^application-icon-' /tmp/badging.txt
          if grep '^application-icon-' /tmp/badging.txt | grep -q '\.xml'; then
            echo 'ERROR: packaged launcher icon resolves to XML'
            exit 1
          fi
          ICON_PATH=$(sed -n "s/^application-icon-640:'\([^']*\)'.*/\1/p" /tmp/badging.txt | head -1)
          if [ -z "$ICON_PATH" ]; then
            ICON_PATH=$(sed -n "s/^application-icon-[0-9]*:'\([^']*\)'.*/\1/p" /tmp/badging.txt | tail -1)
          fi
          echo "Packaged icon path: $ICON_PATH"
          unzip -p "$APK" "$ICON_PATH" > /tmp/packaged-launcher-icon
          test "$(stat -c%s /tmp/packaged-launcher-icon)" -gt 5000
          file /tmp/packaged-launcher-icon | grep -E 'JPEG|PNG'
          "$BT/aapt2" dump resources "$APK" | grep -A 18 'mipmap/ic_launcher' | head -80

      - name: Sign APK with stable key
        run: |
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' | base64 -d > /tmp/testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > /tmp/testkey.x509.pem
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -P 16 4 video-compressor/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/video-compressor-aligned.apk
          "$BT/apksigner" sign --key /tmp/testkey.pk8 --cert /tmp/testkey.x509.pem --out /tmp/video-compressor-v2.2.apk /tmp/video-compressor-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/video-compressor-v2.2.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: video-compressor-v2.2-signed
          path: /tmp/video-compressor-v2.2.apk
          if-no-files-found: error
