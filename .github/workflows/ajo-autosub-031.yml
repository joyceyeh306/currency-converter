name: Ajo Autosub 031 Speech Tail Recovery Build
on:
  push:
    branches: [ajo-autosub-031-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild audited 029 source from previous public workflow
        run: |
          python3 -m pip -q install pyyaml brotli
          python3 - <<'PYBUILD'
          import yaml, subprocess
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/ajo-autosub-029.yml').read_text())['jobs']['build']['steps']
          tests={'Run v026 CPU performance policy and full regression tests','Run 027 HDR output fidelity checks','Run 028 persistence tests','Test 029 independent Whisper state, CPU timing and notifications'}
          for step in steps:
              name=step.get('name','')
              if name.startswith('Create disposable build key'): break
              if 'run' in step:
                  print('Rebuilding prior version:',name,flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          for step in steps:
              if step.get('name') in tests:
                  print('Checking prior version:',step['name'],flush=True)
                  subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)
          PYBUILD
      - name: Apply 030 high-performance native CPU patch
        run: |
          mkdir -p subtitle-build-v030
          base64 --decode subtitle-build-payload/v030bundle.b64 | tar -xz -C subtitle-build-v030
          cd subtitle-build-work
          python3 - <<'PYDIFF'
          from pathlib import Path
          p=Path('../subtitle-build-v030/v030.patch')
          s=p.read_text()
          start=s.index('--- a/tests/Version027Tests.java')
          end=s.index('--- a/tests/Version028Tests.java',start)
          s=s[:start]+s[end:]
          s=s[:s.index('--- a/README.md')]
          p.write_text(s)
          PYDIFF
          patch --dry-run --batch -p1 < ../subtitle-build-v030/v030.patch
          patch --batch -p1 < ../subtitle-build-v030/v030.patch
          python3 - <<'PYUP'
          import re
          from pathlib import Path
          p=Path('tests/Version027Tests.java')
          s=p.read_text()
          s=re.sub(r'versionCode (27|28|29)', 'versionCode 30',s)
          s=re.sub(r"versionName '(027|028|029)'", "versionName '030'",s)
          assert 'versionCode 30' in s and "versionName '030'" in s
          p.write_text(s)
          PYUP
          printf '\n\n## 030 Whisper native CPU optimization\nSee CHANGELOG_030.md for ARM64 O3 and dotprod/FP16 settings.\n' >> README.md
          cp ../subtitle-build-v030/Version030Tests.java tests/Version030Tests.java
          cp ../subtitle-build-v030/CHANGELOG_030.md CHANGELOG_030.md
          grep -F "versionName '030'" app/build.gradle
          grep -F 'versionCode 30' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Retest 027 to 030 with updated version
        run: |
          cd subtitle-build-work
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java
          java -cp tests/build Version027Tests
          java -cp tests/build Version028Tests
          java -cp tests/build Version029Tests
          java -cp tests/build Version030Tests
      - name: Apply 031 surgical tail-recovery patch
        run: |
          mkdir -p subtitle-build-v031
          base64 --decode subtitle-build-payload/v031bundle.b64 | tar -xz -C subtitle-build-v031
          cd subtitle-build-work
          patch --dry-run --batch -p1 < ../subtitle-build-v031/v031_core.patch
          patch --batch -p1 < ../subtitle-build-v031/v031_core.patch
          cp ../subtitle-build-v031/app/src/main/cpp/whisper_tail_recovery.h app/src/main/cpp/whisper_tail_recovery.h
          cp ../subtitle-build-v031/tests/Version031Tests.java tests/Version031Tests.java
          cp ../subtitle-build-v031/tests/Version031NativeTests.cpp tests/Version031NativeTests.cpp
          cp ../subtitle-build-v031/CHANGELOG_031.md CHANGELOG_031.md
          printf '\n\n## 031 Conservative speech tail verification\nSee CHANGELOG_031.md.\n' >> README.md
          python3 - <<'PYVERS'
          from pathlib import Path
          for version in (27,28,29,30):
              p=Path(f'tests/Version{version:03d}Tests.java')
              s=p.read_text().replace('versionCode 30','versionCode 31').replace("versionName '030'","versionName '031'")
              assert 'versionCode 31' in s and "versionName '031'" in s, str(p)
              p.write_text(s)
          PYVERS
          grep -F "versionName '031'" app/build.gradle
          grep -F 'versionCode 31' app/build.gradle
          test ! -f signing/ajo-autosub-signing.keystore
      - name: Verify 031 native tail policy and complete old regression
        run: |
          cd subtitle-build-work
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/Version031NativeTests.cpp -o tests/v031-native
          ./tests/v031-native
          javac -encoding UTF-8 -cp tests/build -d tests/build tests/Version027Tests.java tests/Version028Tests.java tests/Version029Tests.java tests/Version030Tests.java tests/Version031Tests.java
          java -cp tests/build Version027Tests
          java -cp tests/build Version028Tests
          java -cp tests/build Version029Tests
          java -cp tests/build Version030Tests
          java -cp tests/build Version031Tests
      - name: Install Android SDK 36 and native toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' || test "${PIPESTATUS[1]}" -eq 0
      - name: Create disposable temporary signing credential
        run: |
          mkdir -p subtitle-build-work/signing
          keytool -genkeypair -keystore subtitle-build-work/signing/ajo-autosub-signing.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Temp031,O=Ajo,C=TW" -noprompt
      - name: Compile 031 ARM64 Android APK
        run: gradle -p subtitle-build-work :app:assembleDebug --stacktrace --no-daemon
      - name: Confirm real ggml ARM64 compiler optimization flags
        run: |
          cd subtitle-build-work
          python3 - <<'PYFLAGS'
          import glob,json,shlex,re
          paths=glob.glob('app/.cxx/**/compile_commands.json',recursive=True)
          assert paths,'Missing native compile command database'
          cpu=[]
          for p in paths:
              for c in json.load(open(p)):
                  if '/ggml-cpu/' in c['file'] and c['file'].endswith(('ggml-cpu.cpp','quants.c')):
                      cpu.append(c)
          assert cpu,'No ggml CPU translation units found'
          for c in cpu:
              argv=shlex.split(c['command']) if 'command' in c else c['arguments']
              print('ARM compiler command:',c['file'].split('/')[-1], ' '.join(argv[-70:]),flush=True)
              opts=[v for v in argv if re.fullmatch(r'-O[0123s]',v)]
              assert opts and opts[-1]=='-O3',(c['file'],opts)
              assert '-march=armv8.2-a+fp16+dotprod' in argv,c['file']
              print(c['file'].split('/')[-1],opts,'ARM dotprod / fp16 confirmed')
          PYFLAGS
      - name: Verify temporary APK package and signature
        run: |
          APK=subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'versionCode=.31.|versionName=.031.'
      - name: Upload temporary APK for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_031-temporary-apk
          path: subtitle-build-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package full source without private keystore
        run: |
          cd subtitle-build-work
          rm -rf tests/build signing
          zip -qr ../ajo-autosub_031-public-source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties tests README.md CHANGELOG_027.md CHANGELOG_028.md CHANGELOG_029.md CHANGELOG_030.md
      - name: Upload 030 public source
        uses: actions/upload-artifact@v4
        with:
          name: ajo-autosub_031-public-source
          path: ajo-autosub_031-public-source.zip
          if-no-files-found: error