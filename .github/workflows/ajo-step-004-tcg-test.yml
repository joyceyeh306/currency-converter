name: Ajo Step 004 slow emulator install verification
on:
  push:
    branches: [ajo-step-004-parallel]
    paths:
      - .github/workflows/ajo-step-004-tcg-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed-identifier 004 debug test
        run: cd ajo-stepcounter-001 && gradle --no-daemon :app:assembleDebug
      - name: Install both APKs on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 29
          target: default
          arch: x86
          cores: 1
          ram-size: 1024M
          emulator-boot-timeout: 720
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release
            adb install release/ajo-stepcounter_003.apk
            adb install ajo-stepcounter-001/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep 'tw.ajo.stepcounter'
            adb shell am start -W -n tw.ajo.stepcounter.parallel004/tw.ajo.stepcounter.MainActivity
            echo "Both versions have been installed side by side on the emulator"
