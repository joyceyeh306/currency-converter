<!doctype html>
<html lang="zh-Hant">

<title>自助旅行筆記</title>
<style>
:root{
  --yellow:#FFD600;--yellow2:#FFF2A8;--yellow3:#FFF9DB;
  --ink:#171717;--muted:#6f6f6f;--line:#e7e3cf;--bg:#f7f6f1;--card:#fff;
  --danger:#b3261e;--ok:#16834a;--shadow:0 2px 12px rgba(0,0,0,.07);
  --fs:1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:calc(16px * var(--fs))}
button,input,textarea,select{font:inherit}
h1,h2,h3,h4,h5,h6,strong,b{font-weight:400}
.time-input{letter-spacing:.08em;font-variant-numeric:tabular-nums}
button{cursor:pointer}
a{color:inherit}
#app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 24px rgba(0,0,0,.06);padding-bottom:64px}
.topbar{position:sticky;top:0;z-index:20;background:var(--yellow);min-height:48px;padding:6px 12px;border-bottom:1px solid #e3be00;display:flex;align-items:center;gap:7px}
.topbar h1{font-size:1.08rem;margin:0;flex:1;line-height:1.15;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back,.iconbtn{border:0;background:rgba(255,255,255,.66);width:38px;height:38px;min-width:38px;border-radius:11px;font-weight:400;color:#111;font-size:1.25rem}
.content{padding:8px 12px 10px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 4px;font-weight:400;font-size:.98rem}
.subtle{color:var(--muted);font-size:.86rem;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:9px 11px;margin-bottom:6px;box-shadow:var(--shadow)}
.trip-card{border-left:7px solid var(--yellow);cursor:pointer}
.trip-card h3{margin:0 0 3px;font-size:1.08rem}.trip-card .dates{font-weight:400}.trip-card .meta{margin-top:5px;color:var(--muted);font-size:.85rem}
.empty{border:1px dashed #d7cfaa;background:var(--yellow3);padding:8px 12px;border-radius:12px;color:#756a35;text-align:center;margin-bottom:7px}
.primary,.secondary,.dangerbtn{border:0;border-radius:12px;padding:9px 13px;font-weight:400}
.primary{background:var(--yellow);color:#171717}.secondary{background:#f0eee5;color:#222}.dangerbtn{background:#fff0ef;color:var(--danger)}
.fab{position:fixed;right:max(14px,calc((100vw - 620px)/2 + 14px));bottom:68px;border:0;border-radius:16px;background:var(--yellow);width:48px;height:48px;font-size:26px;font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.16);z-index:25}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:62px;background:#fff;border-top:1px solid #ddd9c8;display:grid;grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:max(7px,env(safe-area-inset-bottom));box-sizing:border-box}
.navbtn{border:0;background:#fff;color:#686868;font-size:.68rem;font-weight:400;padding:2px}.navbtn .nicon{font-size:1.02rem;display:block;margin-bottom:0}.navbtn.active{color:#111;background:var(--yellow3)}
.day-row{display:grid;grid-template-columns:72px minmax(0,1fr) 38px;gap:7px;align-items:center;padding:8px 4px;border-bottom:1px solid #eee9d8;cursor:pointer}.day-row:last-child{border-bottom:0}.dateblock{font-weight:400}.dateblock small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.city{font-size:1rem;font-weight:400;min-width:0}.city small{display:block;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-menu{border:0;background:#f2efe5;border-radius:10px;width:34px;height:34px;font-size:1.05rem;padding:0}.trip-mini-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin:-2px 2px 6px}.section-actions{display:flex;align-items:center;gap:6px}.section-actions .tiny{white-space:nowrap}
.day-header{background:var(--yellow3);border:1px solid #f0dd72;border-radius:16px;padding:14px 15px;margin-bottom:12px}.day-header .date{font-size:1.08rem;font-weight:400}.day-header .city{font-size:1.3rem;margin-top:3px}
.day-currency{font-size:.82rem;color:var(--muted);font-weight:400;white-space:nowrap}
.itinerary{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;padding:10px 9px;border-bottom:1px solid #eee9dc;align-items:start}.item:last-child{border-bottom:0}.time{font-weight:400;font-size:1rem}.item-main{min-width:0;cursor:pointer}.item-title{font-weight:400;line-height:1.25}.item-note{font-size:.83rem;color:var(--muted);margin-top:4px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick{display:flex;gap:5px}.qbtn{border:0;background:#f5f2e8;border-radius:9px;min-width:33px;height:33px;font-size:.86rem;padding:0 7px;font-weight:400}.qbtn.has{background:var(--yellow2)}
.addline{width:100%;margin:8px 0 12px}
.meals{margin-top:10px}.cost-card{padding:10px 10px 11px}.cost-head,.cost-item{display:grid;grid-template-columns:86px minmax(0,1fr) 106px 28px;gap:6px;align-items:center}.cost-head{font-size:.72rem;color:var(--muted);padding:0 2px 5px}.cost-item{padding:5px 0;border-top:1px solid #f0ecdf}.cost-item:first-of-type{border-top:0}.cost-item select,.cost-item input{width:100%;min-width:0;border:1px solid #ddd7c4;border-radius:8px;padding:7px 7px;background:#fff;font-size:.86rem}.cost-item .cost-amount{text-align:right}.amount-wrap{min-width:0}.twd-eq{font-size:.66rem;color:var(--muted);text-align:right;margin-top:2px;white-space:nowrap}.rate-box{display:grid;gap:6px;margin-top:6px}.rate-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}.rate-row input{padding:8px 10px}.remove-cost{border:0;background:#fff0ef;color:var(--danger);border-radius:8px;width:28px;height:32px;padding:0;font-size:1rem}.cost-add{width:100%;margin-top:7px;padding:9px 10px}.totals{margin-top:9px;background:var(--yellow3);border-radius:10px;padding:6px 10px}.total{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-weight:400;font-size:.86rem}.total.grand{border-top:1px solid #ead36a;margin-top:4px;padding-top:7px}.currency-mini{font-size:.7rem;color:var(--muted);white-space:nowrap}.stay-card{background:#fffbea;border:1px solid #edd45c;border-left:5px solid var(--yellow);border-radius:14px;padding:9px 10px;margin-bottom:7px}.stay-main{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}.stay-title{font-size:1.02rem}.stay-meta{font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:4px}.stay-status{display:inline-block;background:var(--yellow);border-radius:999px;padding:3px 8px;font-size:.73rem;margin-right:6px}.pass-card{background:#fffdf4;border:1px solid #e8d98c;border-left:5px solid #e4bd00;border-radius:14px;padding:9px 10px;margin-bottom:7px}.pass-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:start}.pass-title{font-size:1rem;line-height:1.35}.pass-meta{font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:3px}.pass-note{font-size:.82rem;color:#555;line-height:1.45;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pass-status{display:inline-block;background:var(--yellow2);border-radius:999px;padding:3px 8px;font-size:.72rem;margin-right:6px}.pass-overview-note{font-size:.84rem;color:#555;line-height:1.5;margin-top:5px;white-space:pre-wrap}.trip-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px}.trip-actions button{width:100%}.type-mark{display:inline-block;min-width:1.35em;text-align:center}
.note-area{width:100%;min-height:55vh;border:1px solid #ddd6bb;border-radius:16px;padding:16px;resize:vertical;line-height:1.7;font-size:1.03rem;outline:none}.savehint{text-align:right;color:var(--muted);font-size:.78rem;margin-top:6px}.stay-overview-note{font-size:.84rem;color:#555;line-height:1.5;margin-top:5px;white-space:pre-wrap}.detail-title{font-size:1.18rem;line-height:1.4;margin:0 0 4px}.detail-meta{font-size:.86rem;color:var(--muted);margin-bottom:14px}.detail-block{border-top:1px solid #eee9dc;padding:11px 0}.detail-block:first-of-type{border-top:0}.detail-label{font-size:.75rem;color:var(--muted);margin-bottom:5px}.detail-text{white-space:pre-wrap;line-height:1.65}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.detail-actions button{flex:1;min-width:120px}
.bigcard-entry textarea{width:100%;height:35vh;min-height:190px;border:2px solid #d8cc8d;border-radius:16px;padding:15px;font-size:1.15rem;line-height:1.5;resize:none;outline:none}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.button-grid .wide{grid-column:1/-1}
.fulltext{position:fixed;inset:0;z-index:100;background:#111;display:none;overflow:hidden}.fulltext.show{display:block}.landscape-sheet{position:absolute;left:50%;top:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center;background:#fff;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}.fulltext .words{text-align:center;font-weight:400;line-height:1.18;word-break:break-word;max-width:88vh;max-height:82vw;white-space:pre-wrap}.fulltext .closefull{position:absolute;top:12px;right:12px;border:0;background:#eee;border-radius:999px;width:43px;height:43px;font-size:20px}
.fx-row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.field label{display:block;font-size:.8rem;color:var(--muted);font-weight:400;margin:0 0 5px}.field input,.field select{width:100%;border:1px solid #ddd7c4;border-radius:12px;padding:12px;background:#fff}.fx-amount{font-size:1.5rem;font-weight:400}.fx-results{display:grid;gap:8px;margin-top:12px}.fx-result{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:13px}.fx-result.source{background:var(--yellow3);border-color:#e4c900}.fx-value{font-size:1.1rem;font-weight:400;text-align:right}.fx-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.status{font-size:.78rem;color:var(--muted);margin-top:9px;line-height:1.4}.status.ok{color:var(--ok)}.status.warn{color:#9a6500}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eee9dc}.settings-row:last-child{border-bottom:0}.settings-row strong{display:block}.settings-row small{color:var(--muted);display:block;margin-top:3px}.seg{display:flex;background:#eeeae0;border-radius:11px;padding:3px}.seg button{border:0;background:transparent;padding:7px 9px;border-radius:8px;font-size:.78rem;font-weight:400}.seg button.on{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.dialog{border:0;border-radius:18px;padding:0;width:min(92vw,520px);max-height:86vh;box-shadow:0 18px 50px rgba(0,0,0,.25)}.dialog::backdrop{background:rgba(0,0,0,.38)}.dlg-head{background:var(--yellow);padding:14px 16px;font-weight:400;display:flex;align-items:center;justify-content:space-between}.dlg-body{padding:15px;max-height:66vh;overflow:auto}.dlg-foot{padding:12px 15px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}.dlg-close{border:0;background:rgba(255,255,255,.65);border-radius:9px;width:34px;height:34px;font-size:18px}.formgrid{display:grid;gap:11px}.checkline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.checkline label{background:#f2efe4;padding:7px 9px;border-radius:9px;font-weight:400;font-size:.82rem}.attach-item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.attach-item .aname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{border:0;border-radius:9px;background:#f0eee6;padding:7px 9px;font-weight:400}.tiny.yellow{background:var(--yellow2)}
.tag{display:inline-block;background:var(--yellow2);border-radius:999px;padding:4px 8px;font-size:.75rem;font-weight:400;margin-right:5px}
@media(max-width:390px){.content{padding:7px 10px 9px}.item{grid-template-columns:52px 1fr auto;padding:9px 7px}.qbtn{min-width:32px;padding:0 6px}.fx-row{grid-template-columns:1fr}.cost-head,.cost-item{grid-template-columns:76px minmax(0,1fr) 78px 28px;gap:4px}.cost-item select,.cost-item input{padding:7px 5px;font-size:.8rem}.trip-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div class="fulltext" id="fullText"><div class="landscape-sheet"><button class="closefull" onclick="closeFullText()">×</button><div class="words" id="fullWords"></div></div></div>
<dialog id="dialog" class="dialog"></dialog>
<input id="hiddenFile" type="file" accept="application/pdf,image/*" hidden multiple>
<input id="restoreFile" type="file" accept="application/json" hidden>
<input id="tripImportFile" type="file" accept=".ajo.json,.travel,.json,application/json" hidden>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TODAY=new Date();
const APPKEY='ajo_travel_notebook_v1'; const FXCACHE='travel_fx_rates_v1';
const defaultData={
  font:'normal', currentTripId:'trip-italyswiss',
  trips:[
    {id:'trip-italyswiss',name:'2026 瑞義四人',start:'2026-05-31',end:'2026-06-18',currencies:['EUR','CHF'],rates:{EUR:37,CHF:40},memo:'',days:[
      {id:'d0531',date:'2026-05-31',city:'羅馬',currency:'EUR',items:[
        {id:'i1',time:'08:00',type:'住宿',title:'抵達羅馬・前往住宿',note:'入住前先寄放行李',maps:'https://maps.google.com',url:''},
        {id:'i2',time:'14:00',type:'景點',title:'羅馬市區行程',note:'',maps:'https://maps.google.com',url:''}
      ],meals:{breakfast:{what:'機上早餐',amount:''},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]},
      {id:'d0610',date:'2026-06-10',city:'米蘭',currency:'EUR',items:[
        {id:'i3',time:'10:00',type:'交通',title:'前往米蘭',note:'到站後先去飯店寄行李',maps:'https://maps.google.com',url:''},
        {id:'i4',time:'15:00',type:'住宿',title:'米蘭住宿',note:'早餐：無',maps:'https://maps.google.com',url:''}
      ],meals:{breakfast:{what:'',amount:''},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]},
      {id:'d0612',date:'2026-06-12',city:'佛羅倫斯',currency:'EUR',items:[
        {id:'i5',time:'09:30',type:'交通',title:'Italo｜米蘭 → 佛羅倫斯',note:'車次／座位可寫在這裡',maps:'',url:''},
        {id:'i6',time:'14:30',type:'景點',title:'佛羅倫斯市區',note:'',maps:'https://maps.google.com',url:''}
      ],meals:{breakfast:{what:'飯店早餐',amount:'0'},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]},
      {id:'d0614',date:'2026-06-14',city:'羅馬',currency:'EUR',items:[{id:'i7',time:'11:00',type:'交通',title:'Italo｜佛羅倫斯 → 羅馬',note:'',maps:'',url:''}],meals:{breakfast:{what:'',amount:''},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]},
      {id:'d0618',date:'2026-06-18',city:'台北',currency:'TWD',items:[{id:'i8',time:'',type:'一般',title:'旅程結束',note:'',maps:'',url:''}],meals:{breakfast:{what:'',amount:''},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]}
    ]},
    {id:'trip-nara',name:'2026 奈良餵鹿三人',start:'2026-03-31',end:'2026-04-03',currencies:['JPY'],rates:{JPY:.21},memo:'',days:[
      {id:'n0331',date:'2026-03-31',city:'奈良',currency:'JPY',items:[{id:'n1',time:'',type:'一般',title:'抵達奈良',note:'',maps:'https://maps.google.com',url:''}],meals:{breakfast:{what:'',amount:''},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]},
      {id:'n0401',date:'2026-04-01',city:'奈良',currency:'JPY',items:[{id:'n2',time:'09:00',type:'景點',title:'奈良公園・餵鹿',note:'',maps:'https://maps.google.com',url:''}],meals:{breakfast:{what:'飯店早餐',amount:'0'},lunch:{what:'',amount:''},dinner:{what:'',amount:''},other:{what:'',amount:''}},expenses:[]}
    ]}
  ]
};
let data=loadData(); let route={tab:'trips',tripId:null,dayId:null}; let attachTarget=null;
function migrateData(x){
  x.font=x.font||'normal';
  for(const t of x.trips||[]){
    t.stays=t.stays||[];
    t.passes=t.passes||[];
    t.memo=t.memo||'';
    t.currencies=t.currencies||[];
    t.rates=t.rates||{};
    for(const d of t.days||[]){
      d.items=d.items||[];
      if(!Array.isArray(d.costs)){
        d.costs=[];
        const old=d.meals||{};
        const map={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',other:'其他吃的'};
        for(const [k,label] of Object.entries(map)){
          const v=old[k]; if(v&&(v.what||v.amount)) d.costs.push({id:uid(),category:label,note:v.what||'',amount:v.amount||''});
        }
        for(const e of d.expenses||[]){d.costs.push({id:uid(),category:e.category||'其他',note:e.note||e.what||'',amount:e.amount||''})}
      }
    }
  }
  return x;
}
function loadData(){try{const x=JSON.parse(localStorage.getItem(APPKEY));return migrateData(x&&x.trips?x:structuredClone(defaultData))}catch(e){return migrateData(structuredClone(defaultData))}}
function saveData(){localStorage.setItem(APPKEY,JSON.stringify(data))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isNaverMapUrl(u=''){u=String(u||'').trim();return /^(https?:\/\/)?((m\.)?map\.naver\.com|naver\.me)(\/|$)/i.test(u)}
function preferredMapUrl(obj){const other=String(obj?.url||'').trim();if(isNaverMapUrl(other))return other;return String(obj?.maps||'').trim()}
function mapButtonTitle(obj){return isNaverMapUrl(obj?.url||'')?'開啟 NAVER 地圖':'開啟地圖'}
function openExternalUrl(u){u=String(u||'').trim();if(!u)return;window.open(u,'_blank','noopener')}
function openItemMap(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d?.items.find(x=>x.id===iid);if(it)openExternalUrl(preferredMapUrl(it))}
function openStayMap(id){const found=findStay(id);if(found)openExternalUrl(preferredMapUrl(found.st))}
function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function weekday(s){return ['日','一','二','三','四','五','六'][new Date(s+'T00:00:00').getDay()]}
function tripById(id){return data.trips.find(t=>t.id===id)}
function dayById(t,id){return t?.days.find(d=>d.id===id)}
function tripStatus(t){const now=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());const s=new Date(t.start+'T00:00:00'),e=new Date(t.end+'T23:59:59');if(now<s)return'upcoming';if(now>e)return'past';return'current'}
function topbar(title,back){return `<header class="topbar">${back?`<button class="back" onclick="goBack()">‹</button>`:''}<h1>${esc(title)}</h1>${route.tab==='trips'&&route.tripId?`<button class="iconbtn" title="附件總覽" onclick="showTripAttachments('${route.tripId}')">📎</button>`:''}${route.tab==='trips'&&route.dayId?`<button class="iconbtn" title="編輯這一天" onclick="editDay('${route.dayId}')">⋯</button>`:''}</header>`}
function renderNav(){const tabs=[['trips','旅程','▤'],['big','大字卡','Ａ'],['fx','匯率','↔'],['memo','備忘錄','✎'],['settings','設定','⚙']];$('#bottomNav').innerHTML=tabs.map(([id,label,ic])=>`<button class="navbtn ${route.tab===id?'active':''}" onclick="switchTab('${id}')"><span class="nicon">${ic}</span>${label}</button>`).join('')}
function switchTab(tab){route.tab=tab;if(tab!=='trips'){route.dayId=null}render()}
function goBack(){if(route.tab==='trips'&&route.dayId){route.dayId=null}else if(route.tab==='trips'&&route.tripId){route.tripId=null}render()}
function render(){document.documentElement.style.setProperty('--fs',data.font==='large'?1.12:data.font==='max'?1.24:1);renderNav();if(route.tab==='trips')renderTrips();if(route.tab==='big')renderBig();if(route.tab==='fx')renderFx();if(route.tab==='memo')renderMemo();if(route.tab==='settings')renderSettings()}
function renderTrips(){if(route.dayId)return renderDay();if(route.tripId)return renderTrip();const groups={current:[],upcoming:[],past:[]};data.trips.forEach(t=>groups[tripStatus(t)].push(t));groups.upcoming.sort((a,b)=>a.start.localeCompare(b.start));groups.past.sort((a,b)=>b.start.localeCompare(a.start));const block=(title,arr)=>`<div class="section-title">${title}</div>${arr.length?arr.map(t=>tripCard(t)).join(''):`<div class="empty">目前沒有${title}</div>`}`;$('#screen').innerHTML=topbar('自助旅行筆記',false)+`<main class="content">${block('旅行中',groups.current)}${block('即將出發',groups.upcoming)}${block('過往旅程',groups.past)}</main><button class="fab" onclick="newTrip()">＋</button>`}
function tripCard(t){return `<article class="card trip-card" onclick="openTrip('${t.id}')"><h3>${esc(t.name)}</h3><div class="dates">${fmtDate(t.start)} ～ ${fmtDate(t.end)}</div><div class="meta">${t.days.length} 個日期　${t.currencies.map(c=>`<span class="tag">${c}</span>`).join('')}</div></article>`}
function openTrip(id){route.tripId=id;data.currentTripId=id;saveData();render()}
function renderTrip(){const t=tripById(route.tripId);if(!t){route.tripId=null;return render()}const days=[...t.days].sort((a,b)=>a.date.localeCompare(b.date));const stays=[...(t.stays||[])].sort((a,b)=>a.start.localeCompare(b.start));const passes=[...(t.passes||[])].sort((a,b)=>a.start.localeCompare(b.start));$('#screen').innerHTML=topbar(t.name,true)+`<main class="content"><div class="section-title"><span>這次去哪？</span><span class="section-actions"><button class="tiny" onclick="editTrip('${t.id}')">旅程設定</button><button class="tiny yellow" onclick="newDay('${t.id}')">＋ 日期</button></span></div><div class="trip-mini-meta"><span>${fmtDate(t.start)} ～ ${fmtDate(t.end)}</span><span>・</span><span>${t.currencies.join('、')||'未設定貨幣'}</span></div>${days.length?`<section class="card" style="padding:3px 12px">${days.map(d=>`<div class="day-row" onclick="openDay('${d.id}')"><div class="dateblock">${fmtDate(d.date)}<small>週${weekday(d.date)}</small></div><div class="city">${esc(d.city||'未填城市')}<small>${d.items.length?esc([...d.items].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))[0].title):'尚未安排行程'}</small></div><button class="day-menu" title="編輯這一天" onclick="event.stopPropagation();editDay('${d.id}')">⋯</button></div>`).join('')}</section>`:`<div class="empty">還沒有日期，請先新增。</div>`}<div class="section-title"><span>住宿</span><button class="tiny yellow" onclick="newStay('${t.id}')">＋ 新增住宿</button></div>${stays.length?stays.map(st=>`<div class="stay-card" onclick="editStay('${st.id}')"><div class="stay-title">🏨 ${esc(st.name)}</div><div class="stay-meta">${fmtDate(st.start)} 入住 → ${fmtDate(st.end)} 退房${st.breakfast&&st.breakfast!=='未設定'?`　早餐：${esc(st.breakfast)}`:''}</div>${st.note?`<div class="stay-overview-note">${esc(st.note)}</div>`:''}</div>`).join(''):`<div class="empty">尚未新增住宿</div>`}<div class="section-title"><span>票券／通行證</span><button class="tiny yellow" onclick="newPass('${t.id}')">＋ 新增票券</button></div>${passes.length?passes.map(p=>`<div class="pass-card" onclick="editPass('${p.id}')"><div class="pass-title">🎫 ${esc(p.name)}</div><div class="pass-meta">${fmtDate(p.start)} ～ ${fmtDate(p.end)}${passDayProgress(p,p.start).total>1?`　${passDayProgress(p,p.start).total} 日`:''}</div>${p.note?`<div class="pass-overview-note">${esc(p.note)}</div>`:''}</div>`).join(''):`<div class="empty">尚未新增票券／通行證</div>`}</main>`}
function openDay(id){route.dayId=id;render()}
function typeIcon(type){return ({交通:'🚆',住宿:'🏨',景點:'📍',餐廳:'🍽️',購物:'🛍️',一般:'',其他:'🔸'})[type]||''}
function staysForDay(t,date){return (t.stays||[]).filter(st=>st.start<=date&&date<=st.end).sort((a,b)=>a.start.localeCompare(b.start))}
function stayDayStatus(st,date){if(st.start===date&&st.end===date)return'今日住宿';if(st.start===date)return'今日入住';if(st.end===date)return'今日退房';return'住宿中'}
function passesForDay(t,date){return (t.passes||[]).filter(p=>p.start<=date&&date<=p.end).sort((a,b)=>a.start.localeCompare(b.start))}
function passDayStatus(p,date){if(p.start===date&&p.end===date)return'今日有效';if(p.start===date)return'今日啟用';if(p.end===date)return'最後一天';return'使用中'}
function passDayProgress(p,date){const one=86400000,s=new Date(p.start+'T00:00:00'),e=new Date(p.end+'T00:00:00'),d=new Date(date+'T00:00:00');const total=Math.floor((e-s)/one)+1,day=Math.floor((d-s)/one)+1;return {day,total}}

async function renderDay(){const t=tripById(route.tripId),d=dayById(t,route.dayId);if(!d){route.dayId=null;return render()}const items=[...d.items].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));const counts={};for(const it of items)counts[it.id]=await countAttachments(it.id);const stays=staysForDay(t,d.date),stayCounts={};for(const st of stays)stayCounts[st.id]=await countAttachments(st.id);const passes=passesForDay(t,d.date),passCounts={};for(const p of passes)passCounts[p.id]=await countAttachments(p.id);const stayHtml=stays.length?`<div class="section-title">今日住宿</div>${stays.map(st=>{const mapUrl=preferredMapUrl(st);return `<div class="stay-card"><div class="stay-main"><div onclick="editStay('${st.id}')"><div class="stay-title"><span class="stay-status">${stayDayStatus(st,d.date)}</span>🏨 ${esc(st.name)}</div><div class="stay-meta">${fmtDate(st.start)} 入住 → ${fmtDate(st.end)} 退房${st.breakfast&&st.breakfast!=='未設定'?`　早餐：${esc(st.breakfast)}`:''}</div></div><div class="quick">${stayCounts[st.id]?`<button class="qbtn has" onclick="event.stopPropagation();openAttachments('${st.id}')">📄${stayCounts[st.id]>1?stayCounts[st.id]:''}</button>`:`<button class="qbtn" onclick="event.stopPropagation();openAttachments('${st.id}')">＋📄</button>`}${mapUrl?`<button class="qbtn has" title="${mapButtonTitle(st)}" onclick="event.stopPropagation();openStayMap('${st.id}')">📍</button>`:''}</div></div></div>`}).join('')}`:'';const passHtml=passes.length?`<div class="section-title">今日票券</div>${passes.map(p=>{const pg=passDayProgress(p,d.date);return `<div class="pass-card"><div class="pass-main"><div onclick="editPass('${p.id}')"><div class="pass-title"><span class="pass-status">${passDayStatus(p,d.date)}</span>🎫 ${esc(p.name)}</div><div class="pass-meta">${fmtDate(p.start)} ～ ${fmtDate(p.end)}${pg.total>1?`　第 ${pg.day}/${pg.total} 天`:''}</div>${p.note?`<div class="pass-note">${esc(p.note)}</div>`:''}</div><div class="quick">${passCounts[p.id]?`<button class="qbtn has" onclick="event.stopPropagation();openAttachments('${p.id}')">📄${passCounts[p.id]>1?passCounts[p.id]:''}</button>`:''}</div></div></div>`}).join('')}`:'';$('#screen').innerHTML=topbar(`${fmtDate(d.date)}｜${d.city}`,true)+`<main class="content">${stayHtml}${passHtml}<div class="section-title">今日行程</div><section class="itinerary">${items.length?items.map(it=>{const mapUrl=preferredMapUrl(it);return `<div class="item"><div class="time">${esc(it.time||'—')}</div><div class="item-main" onclick="viewItem('${it.id}')"><div class="item-title"><span class="type-mark">${typeIcon(it.type)}</span> ${esc(it.title)}</div>${it.note?`<div class="item-note" title="${esc(it.note)}">${esc(it.note)}</div>`:''}</div><div class="quick">${counts[it.id]?`<button class="qbtn has" onclick="event.stopPropagation();openAttachments('${it.id}')">📄${counts[it.id]>1?counts[it.id]:''}</button>`:''}${mapUrl?`<button class="qbtn has" title="${mapButtonTitle(it)}" onclick="event.stopPropagation();openItemMap('${it.id}')">📍</button>`:''}<button class="qbtn" title="編輯行程" onclick="event.stopPropagation();editItem('${it.id}')">⋯</button></div></div>`}).join(''):`<div class="empty" style="margin:12px">今天還沒有行程</div>`}</section><button class="primary addline" onclick="newItem('${d.id}')">＋ 新增行程</button>${costSection(t,d)}</main>`}
const costOptions=['早餐','午餐','晚餐','其他吃的','購物','交通','門票／活動','住宿','其他'];
const costGroup={早餐:'餐飲',午餐:'餐飲',晚餐:'餐飲','其他吃的':'餐飲',購物:'購物',交通:'交通','門票／活動':'門票／活動',住宿:'住宿',其他:'其他'};
function twdRateFor(t,cur){if(cur==='TWD')return 1;const r=Number(t?.rates?.[cur]);if(r>0)return r;try{const c=JSON.parse(localStorage.getItem(FXCACHE)||'null');if(c?.rates?.TWD&&c?.rates?.[cur])return Number(c.rates.TWD)/Number(c.rates[cur])}catch(e){}return 0}
function twdText(t,cur,amount){const a=Number(amount)||0,r=twdRateFor(t,cur);return r?`約 NT$${num(a*r)}`:'未設定匯率'}
function moneyPair(t,cur,amount){const a=Number(amount)||0,r=twdRateFor(t,cur);return `<span>${num(a)} ${cur}${cur==='TWD'?'':r?`　<small class="currency-mini">約 NT$${num(a*r)}</small>`:`　<small class="currency-mini">未設定匯率</small>`}</span>`}
function costSection(t,d){d.costs=d.costs||[];const cur=d.currency||t.currencies[0]||'TWD';const sums={};let grand=0;for(const x of d.costs){const a=Number(x.amount)||0,g=costGroup[x.category]||'其他';sums[g]=(sums[g]||0)+a;grand+=a}const order=['餐飲','購物','交通','門票／活動','住宿','其他'];return `<section class="meals"><div class="section-title"><span>今天花多少錢呢?</span><span class="day-currency">當日貨幣：${esc(cur)}</span></div><div class="card cost-card"><div class="cost-head"><span>項目</span><span>備註</span><span>金額 ${cur}</span><span></span></div><div id="costList">${d.costs.length?d.costs.map((x,i)=>costRowHtml(x,i,cur,t)).join(''):`<div class="subtle" style="padding:7px 2px">今天還沒有花費紀錄。</div>`}</div><button class="secondary cost-add" onclick="addCost()">＋ 新增一筆</button><div class="totals" id="costTotals">${order.filter(g=>sums[g]).map(g=>`<div class="total"><span>${g}</span>${moneyPair(t,cur,sums[g])}</div>`).join('')}<div class="total grand"><span>今日總額</span>${moneyPair(t,cur,grand)}</div></div></div></section>`}
function costRowHtml(x,i,cur,t){return `<div class="cost-item"><select aria-label="項目" onchange="costChange(${i},'category',this.value)">${costOptions.map(o=>`<option ${o===x.category?'selected':''}>${o}</option>`).join('')}</select><input aria-label="備註" value="${esc(x.note||'')}" placeholder="簡單備註" oninput="costChange(${i},'note',this.value)"><div class="amount-wrap"><input class="cost-amount" aria-label="金額" type="number" inputmode="decimal" value="${esc(x.amount||'')}" placeholder="0" oninput="costChange(${i},'amount',this.value);updateCostRowTwd(${i},this.value)"><div class="twd-eq" id="costTwd${i}">${cur==='TWD'?'':twdText(t,cur,x.amount)}</div></div><button class="remove-cost" aria-label="刪除" onclick="removeCost(${i})">×</button></div>`}
function updateCostRowTwd(i,v){const t=tripById(route.tripId),d=dayById(t,route.dayId),cur=d.currency||t.currencies[0]||'TWD',el=$(`#costTwd${i}`);if(el)el.textContent=cur==='TWD'?'':twdText(t,cur,v)}
function addCost(){const d=dayById(tripById(route.tripId),route.dayId);d.costs=d.costs||[];d.costs.push({id:uid(),category:'早餐',note:'',amount:''});saveData();renderDay()}
function updateCostTotals(){const t=tripById(route.tripId),d=dayById(t,route.dayId),cur=d.currency||t.currencies[0]||'TWD',sums={};let grand=0;for(const x of d.costs||[]){const a=Number(x.amount)||0,g=costGroup[x.category]||'其他';sums[g]=(sums[g]||0)+a;grand+=a}const order=['餐飲','購物','交通','門票／活動','住宿','其他'],el=$('#costTotals');if(el)el.innerHTML=order.filter(g=>sums[g]).map(g=>`<div class="total"><span>${g}</span>${moneyPair(t,cur,sums[g])}</div>`).join('')+`<div class="total grand"><span>今日總額</span>${moneyPair(t,cur,grand)}</div>`}
function costChange(i,f,v){const d=dayById(tripById(route.tripId),route.dayId);d.costs=d.costs||[];if(!d.costs[i])return;d.costs[i][f]=v;saveData();if(f==='amount'||f==='category')updateCostTotals()}
function removeCost(i){const d=dayById(tripById(route.tripId),route.dayId);if(!d.costs?.[i])return;d.costs.splice(i,1);saveData();renderDay()}
function num(x){return new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(x)}
function renderBig(){$('#screen').innerHTML=topbar('大字卡',false)+`<main class="content bigcard-entry"><div class="subtle" style="margin-bottom:10px">把 Google Maps、Google 翻譯或其他 App 的文字貼進來，再全螢幕給對方看。</div><textarea id="bigInput" placeholder="在這裡輸入或貼上文字…">${esc(sessionStorage.getItem('bigtext')||'')}</textarea><div class="button-grid"><button class="secondary" onclick="pasteBig()">貼上</button><button class="secondary" onclick="clearBig()">清除</button><button class="primary wide" onclick="showFullText()">橫式全螢幕顯示</button></div></main>`;$('#bigInput').addEventListener('input',e=>sessionStorage.setItem('bigtext',e.target.value))}
async function pasteBig(){try{const txt=await navigator.clipboard.readText();$('#bigInput').value=txt;sessionStorage.setItem('bigtext',txt)}catch(e){$('#bigInput').focus();alert('請長按輸入框選擇「貼上」。')}}

async function showFullText(){const txt=$('#bigInput').value.trim();if(!txt)return;sessionStorage.setItem('bigtext',txt);const box=$('#fullText'),w=$('#fullWords');w.textContent=txt;box.classList.add('show');fitFullText();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.()}catch(e){}try{navigator.wakeLock?.request('screen').then(l=>window._wake=l)}catch(e){}}
function fitFullText(){const w=$('#fullWords'),txt=w.textContent;const logicalW=innerHeight,logicalH=innerWidth;let px=txt.length<20?74:txt.length<50?58:txt.length<100?44:34;w.style.fontSize=px+'px';requestAnimationFrame(()=>{while((w.scrollHeight>logicalH*.78||w.scrollWidth>logicalW*.88)&&px>22){px-=2;w.style.fontSize=px+'px'}})}

// ---- FX, based on the earlier standalone converter ----
const currencies={TWD:{name:'台幣',flag:'🇹🇼',digits:0},USD:{name:'美金',flag:'🇺🇸',digits:2},EUR:{name:'歐元',flag:'🇪🇺',digits:2},JPY:{name:'日圓',flag:'🇯🇵',digits:0},KRW:{name:'韓元',flag:'🇰🇷',digits:0},GBP:{name:'英鎊',flag:'🇬🇧',digits:2},NOK:{name:'挪威克朗',flag:'🇳🇴',digits:2},CHF:{name:'瑞郎',flag:'🇨🇭',digits:2}};
const fxOrder=['TWD','USD','EUR','JPY','KRW','GBP','NOK','CHF'];let fxRates=null,fxUpdate='';
function renderFx(){$('#screen').innerHTML=topbar('旅行匯率換算',false)+`<main class="content"><section class="card"><div class="fx-row"><div class="field"><label>輸入幣別</label><select id="fxFrom" onchange="drawFx()">${fxOrder.map(c=>`<option value="${c}">${currencies[c].flag} ${currencies[c].name} ${c}</option>`).join('')}</select></div><div class="field"><label>金額</label><input class="fx-amount" id="fxAmount" type="number" inputmode="decimal" value="1000" oninput="drawFx()"></div></div><div class="fx-actions"><button class="primary" onclick="refreshFx()">更新匯率</button><button class="secondary" onclick="$('#fxAmount').value='';drawFx()">清除金額</button></div><div id="fxStatus" class="status">正在讀取匯率…</div></section><div class="fx-results" id="fxResults"></div></main>`;loadFxCache();drawFx();if(!fxRates)refreshFx()}
function formatFx(v,d){return new Intl.NumberFormat('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v)}
function drawFx(){const from=$('#fxFrom')?.value||'TWD',amt=Number($('#fxAmount')?.value);const r=$('#fxResults');if(!r)return;r.innerHTML=fxOrder.map(code=>{let val='—';if(fxRates&&Number.isFinite(amt)&&$('#fxAmount').value!==''){const usd=amt/fxRates[from];val=formatFx(usd*fxRates[code],currencies[code].digits)}return `<div class="fx-result ${code===from?'source':''}"><div><strong>${currencies[code].flag} ${currencies[code].name}</strong><div class="subtle">${code}</div></div><div class="fx-value">${val}</div></div>`}).join('')}
function loadFxCache(){
  try{
    const c=JSON.parse(localStorage.getItem(FXCACHE));
    if(c?.rates){
      fxRates=c.rates;
      fxUpdate=c.time_last_update_utc||'';
      if($('#fxStatus')){
        $('#fxStatus').className='status ok';
        $('#fxStatus').textContent='使用已儲存匯率'+(fxUpdate?'｜'+fxUpdate:'');
      }
      return true;
    }
  }catch(e){}
  return false;
}
async function refreshFx(){const s=$('#fxStatus');s.className='status';s.textContent='正在連線取得最新匯率…';try{const res=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});const j=await res.json();if(j.result!=='success'||!fxOrder.every(c=>Number(j.rates?.[c])>0))throw 0;fxRates=j.rates;fxUpdate=j.time_last_update_utc||'';localStorage.setItem(FXCACHE,JSON.stringify(j));s.className='status ok';s.textContent='匯率已更新'+(fxUpdate?'｜'+fxUpdate:'');drawFx()}catch(e){if(loadFxCache()){s.textContent+='｜這次連線失敗，仍可離線換算。'}else{s.className='status warn';s.textContent='第一次使用請先連上網路更新匯率。'}}}

function renderSettings(){let attachCount='…';countAllAttachments().then(n=>{const el=$('#attachCount');if(el)el.textContent=n+' 個檔案'});$('#screen').innerHTML=topbar('設定',false)+`<main class="content"><section class="card"><div class="settings-row"><div><strong>字體大小</strong><small>整個 App 的閱讀尺寸</small></div><div class="seg">${[['normal','一般'],['large','較大'],['max','最大']].map(([v,l])=>`<button class="${data.font===v?'on':''}" onclick="setFont('${v}')">${l}</button>`).join('')}</div></div><div class="settings-row"><div><strong>離線附件</strong><small id="attachCount">${attachCount}</small></div><button class="tiny" onclick="showAllAttachments()">管理</button></div><div class="settings-row"><div><strong>匯入單一旅程</strong><small>從電腦帶入行程、住宿、票券與備忘錄</small></div><button class="tiny yellow" onclick="$('#tripImportFile').click()">匯入</button></div><div class="settings-row"><div><strong>匯出目前旅程包</strong><small>帶到另一台裝置，附件也會一起匯出</small></div><button class="tiny yellow" onclick="exportTravelPack()">匯出</button></div><div class="settings-row"><div><strong>備份 App 資料</strong><small>所有旅程、備忘錄、花費與附件</small></div><button class="tiny" onclick="backupAll()">備份</button></div><div class="settings-row"><div><strong>還原 App 資料</strong><small>從完整備份檔恢復</small></div><button class="tiny" onclick="$('#restoreFile').click()">還原</button></div><div class="settings-row"><div><strong>匯出可閱讀行程表</strong><small>輸出 HTML，方便留存或列印</small></div><button class="tiny" onclick="exportTrip()">匯出</button></div></section></main>`}

function dlg(title,body,foot=''){const d=$('#dialog');d.innerHTML=`<div class="dlg-head"><span>${title}</span><button class="dlg-close" onclick="closeDlg()">×</button></div><div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;d.showModal();return d}

function tripForm(t){const all=['TWD','JPY','KRW','EUR','CHF','GBP','USD','NOK'];return `<div class="formgrid"><div class="field"><label>旅程名稱</label><input id="tName" value="${esc(t.name||'')}"></div><div class="fx-row"><div class="field"><label>開始日期</label><input id="tStart" type="date" value="${esc(t.start||'')}"></div><div class="field"><label>結束日期</label><input id="tEnd" type="date" value="${esc(t.end||'')}"></div></div><div class="field"><label>這趟旅行使用的貨幣（可複選）</label><div class="checkline">${all.map(c=>`<label><input type="checkbox" class="curcheck" value="${c}" ${(t.currencies||[]).includes(c)?'checked':''} onchange="toggleTripRateRows()"> ${c}</label>`).join('')}</div></div><div class="field"><label>台幣換算匯率</label><div class="rate-box">${all.filter(c=>c!=='TWD').map(c=>`<div class="rate-row trip-rate-row" data-cur="${c}" style="${(t.currencies||[]).includes(c)?'':'display:none'}"><span>1 ${c} ＝ NT$</span><input id="rate_${c}" type="number" inputmode="decimal" step="any" value="${esc(t.rates?.[c]||'')}" placeholder="自行設定"></div>`).join('')}</div></div><div class="subtle">各天仍可另外指定「當日主要貨幣」。花費會依這裡設定的匯率換算成台幣。</div></div>`}
function toggleTripRateRows(){const selected=new Set($$('.curcheck:checked').map(x=>x.value));$$('.trip-rate-row').forEach(r=>r.style.display=selected.has(r.dataset.cur)?'grid':'none')}
function collectTripRates(existing={}){const out={...existing,TWD:1};for(const c of $$('.curcheck:checked').map(x=>x.value)){if(c==='TWD')continue;const el=$(`#rate_${c}`),v=Number(el?.value);if(v>0)out[c]=v}return out}
function saveNewTrip(){const name=$('#tName').value.trim(),start=$('#tStart').value,end=$('#tEnd').value;if(!name||!start||!end)return alert('請填旅程名稱與日期');const curs=$$('.curcheck:checked').map(x=>x.value);const t={id:uid(),name,start,end,currencies:curs,rates:collectTripRates({}),memo:'',stays:[],days:[]};data.trips.push(t);data.currentTripId=t.id;saveData();closeDlg();openTrip(t.id)}
function editTrip(id){const t=tripById(id);dlg('旅程設定',tripForm(t),`<button class="dangerbtn" onclick="deleteTrip('${id}')">刪除旅程</button><button class="primary" onclick="saveTripEdit('${id}')">儲存</button>`)}
function saveTripEdit(id){const t=tripById(id);t.name=$('#tName').value.trim()||t.name;t.start=$('#tStart').value;t.end=$('#tEnd').value;t.currencies=$$('.curcheck:checked').map(x=>x.value);t.rates=collectTripRates(t.rates||{});saveData();closeDlg();render()}
function deleteTrip(id){const t=tripById(id);dlg('刪除旅程',`<p>確定刪除「${esc(t.name)}」？</p><div class="subtle">行程、餐食、住宿與相關離線附件都會一起刪除。</div>`,`<button class="secondary" onclick="editTrip('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeleteTrip('${id}')">確定刪除</button>`)}
async function confirmDeleteTrip(id){const t=tripById(id);if(!t)return;for(const d of t.days)for(const i of d.items||[])await deleteAttachmentsByItem(i.id);for(const st of t.stays||[])await deleteAttachmentsByItem(st.id);data.trips=data.trips.filter(x=>x.id!==id);if(data.currentTripId===id)data.currentTripId=data.trips[0]?.id||null;route.tripId=null;route.dayId=null;saveData();closeDlg();render()}
function stayForm(st={},includeFiles=false){return `<div class="formgrid"><div class="field"><label>住宿名稱</label><input id="sName" value="${esc(st.name||'')}" placeholder="例如：L7 Haeundae"></div><div class="fx-row"><div class="field"><label>入住日期</label><input id="sStart" type="date" value="${esc(st.start||'')}"></div><div class="field"><label>退房日期</label><input id="sEnd" type="date" value="${esc(st.end||'')}"></div></div><div class="field"><label>早餐</label><select id="sBreakfast">${['未設定','有','無','另購'].map(x=>`<option ${x===(st.breakfast||'未設定')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>訂房編號（選填）</label><input id="sBooking" value="${esc(st.booking||'')}"></div><div class="field"><label>簡單備註</label><textarea id="sNote" style="width:100%;min-height:75px;border:1px solid #ddd7c4;border-radius:12px;padding:11px">${esc(st.note||'')}</textarea></div><div class="field"><label>Google Maps 網址</label><input id="sMaps" value="${esc(st.maps||'')}"></div><div class="field"><label>其他網址</label><input id="sUrl" value="${esc(st.url||'')}"></div>${includeFiles?`<div class="field"><label>訂房 PDF／圖片（可多選）</label><input id="sFiles" type="file" accept="application/pdf,image/*" multiple></div>`:''}</div>`}

function deleteStay(id){const found=findStay(id);if(!found)return;dlg('刪除住宿',`<p>確定刪除住宿「${esc(found.st.name)}」？</p><label class="checkline" style="margin-top:12px"><input id="deleteStayFiles" type="checkbox" checked> 同時刪除離線 PDF／圖片</label>`,`<button class="secondary" onclick="editStay('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeleteStay('${id}')">確定刪除</button>`)}

function formatTimeTyping(el){let d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d.length===2?d+':':d}
function normalizeTime(raw){raw=String(raw||'').trim();if(!raw)return'';let h,m;if(raw.includes(':')){const p=raw.split(':');if(p.length!==2)return null;h=Number(p[0]);m=Number(p[1])}else{const d=raw.replace(/\D/g,'');if(d.length===3){h=Number(d.slice(0,1));m=Number(d.slice(1))}else if(d.length===4){h=Number(d.slice(0,2));m=Number(d.slice(2))}else return null}if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>23||m<0||m>59)return null;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
async function viewItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d?.items.find(x=>x.id===iid);if(!it)return;const count=await countAttachments(iid);const hasNaver=isNaverMapUrl(it.url||'');let actions='';if(hasNaver)actions+=`<button class="primary" onclick="openExternalUrl('${esc(it.url)}')">NAVER 地圖</button>`;if(it.maps)actions+=`<button class="secondary" onclick="openExternalUrl('${esc(it.maps)}')">Google Maps</button>`;if(it.url&&!hasNaver)actions+=`<button class="secondary" onclick="openExternalUrl('${esc(it.url)}')">其他連結</button>`;if(count)actions+=`<button class="secondary" onclick="openAttachments('${iid}')">附件 ${count}</button>`;const body=`<div class="detail-title"><span class="type-mark">${typeIcon(it.type)}</span> ${esc(it.title)}</div><div class="detail-meta">${it.time?esc(it.time)+'　':''}${esc(it.type||'')}</div>${it.note?`<div class="detail-block"><div class="detail-label">備註</div><div class="detail-text">${esc(it.note)}</div></div>`:''}${actions?`<div class="detail-block"><div class="detail-label">連結與附件</div><div class="detail-actions">${actions}</div></div>`:''}`;dlg('行程詳細內容',body,`<button class="secondary" onclick="closeDlg()">關閉</button>`)}

function deleteItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d?.items.find(x=>x.id===iid);if(!it)return;dlg('刪除行程',`<p>確定刪除「${esc(it.title)}」？</p><label class="checkline" style="margin-top:12px"><input id="deleteItemFiles" type="checkbox" checked> 同時刪除這筆行程的離線 PDF／圖片</label>`,`<button class="secondary" onclick="editItem('${iid}')">取消</button><button class="dangerbtn" onclick="confirmDeleteItem('${iid}')">確定刪除</button>`)}

// ---- IndexedDB attachments ----
const DBNAME='ajo_travel_files',STORE='attachments';let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore(STORE,{keyPath:'id'});s.createIndex('itemId','itemId',{unique:false})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbp}
async function countAttachments(itemId){const d=await db();return new Promise(res=>{const tx=d.transaction(STORE,'readonly'),idx=tx.objectStore(STORE).index('itemId'),r=idx.count(itemId);r.onsuccess=()=>res(r.result||0);r.onerror=()=>res(0)})}
async function getAttachments(itemId){const d=await db();return new Promise(res=>{const tx=d.transaction(STORE,'readonly'),idx=tx.objectStore(STORE).index('itemId'),r=idx.getAll(itemId);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
async function getAllAttachments(){const d=await db();return new Promise(res=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
async function countAllAttachments(){return (await getAllAttachments()).length}
async function putAttachment(a){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(a);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function delAttachment(id){const d=await db();return new Promise(res=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>res()})}
async function deleteAttachmentsByItem(itemId){for(const a of await getAttachments(itemId))await delAttachment(a.id)}
async function openAttachments(itemId){attachTarget=itemId;const arr=await getAttachments(itemId);dlg('票券・附件',`<div id="attachList">${arr.length?arr.map(a=>attachHtml(a)).join(''):'<div class="empty">尚未加入附件</div>'}</div><div style="margin-top:12px"><button class="primary" style="width:100%" onclick="chooseAttach('${itemId}')">＋ 加入更多 PDF／圖片</button></div>`)}
function attachHtml(a){return `<div class="attach-item"><span>📄</span><span class="aname">${esc(a.name)}</span><button class="tiny yellow" onclick="openAttachmentId('${a.id}')">開啟</button><button class="tiny" onclick="renameAttachment('${a.id}')">改名</button><button class="tiny" onclick="removeAttachment('${a.id}')">刪</button></div>`}
function chooseAttach(itemId){attachTarget=itemId;$('#hiddenFile').value='';$('#hiddenFile').click()}
$('#hiddenFile').addEventListener('change',async e=>{if(!attachTarget)return;for(const f of e.target.files){await putAttachment({id:uid(),itemId:attachTarget,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()})}closeDlg();await openAttachments(attachTarget);if(route.dayId)renderDay();else if(route.tripId)renderTrip()});
async function openAttachmentId(id){const a=(await getAllAttachments()).find(x=>x.id===id);if(a)openBlob(a)}
async function openBlob(a){if(window.Android&&Android.openBase64File){try{const url=await blobToDataURL(a.blob);Android.openBase64File(a.name,a.type||'application/octet-stream',url);return}catch(e){}}const u=URL.createObjectURL(a.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function renameAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;dlg('附件改名',`<div class="field"><label>顯示名稱</label><input id="renameValue" value="${esc(a.name)}" autofocus></div>`,`<button class="secondary" onclick="openAttachments('${a.itemId}')">取消</button><button class="primary" onclick="saveAttachmentRename('${id}')">儲存</button>`);setTimeout(()=>$('#renameValue')?.select(),50)}
async function saveAttachmentRename(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id),n=$('#renameValue')?.value.trim();if(!a||!n)return;a.name=n;await putAttachment(a);await openAttachments(a.itemId);if(route.dayId)renderDay();else if(route.tripId)renderTrip()}
async function removeAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;dlg('刪除附件',`<p>確定刪除附件「${esc(a.name)}」？</p>`,`<button class="secondary" onclick="openAttachments('${a.itemId}')">取消</button><button class="dangerbtn" onclick="confirmRemoveAttachment('${id}')">確定刪除</button>`)}
async function confirmRemoveAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;await delAttachment(id);await openAttachments(a.itemId);if(route.dayId)renderDay();else if(route.tripId)renderTrip()}
async function showTripAttachments(tid){const t=tripById(tid),rows=[];for(const st of t.stays||[]){const as=await getAttachments(st.id);if(as.length)rows.push({label:`住宿｜${st.name}`,as})}for(const p of t.passes||[]){const as=await getAttachments(p.id);if(as.length)rows.push({label:`票券｜${p.name}`,as})}for(const d of t.days){for(const it of d.items){const as=await getAttachments(it.id);if(as.length)rows.push({label:`${fmtDate(d.date)}｜${it.title}`,as})}}dlg('這趟旅程的附件',rows.length?rows.map(r=>`<div style="margin-bottom:13px"><strong>${esc(r.label)}</strong>${r.as.map(a=>attachHtml(a)).join('')}</div>`).join(''):'<div class="empty">這趟旅程還沒有附件</div>')}
async function showAllAttachments(){const arr=await getAllAttachments();dlg('離線附件管理',arr.length?arr.map(a=>attachHtml(a)).join(''):'<div class="empty">目前沒有離線附件</div>')}
function blobToDataURL(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function dataURLToBlob(url){const r=await fetch(url);return r.blob()}
async function backupAll(){const files=[];for(const a of await getAllAttachments())files.push({...a,blob:await blobToDataURL(a.blob)});downloadBlob(new Blob([JSON.stringify({version:2,data,files},null,2)],{type:'application/json'}),`阿喬旅行筆記本_${new Date().toISOString().slice(0,10)}.backup.json`)}
let pendingRestoreFile=null;$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;pendingRestoreFile=f;dlg('還原 App 資料',`<p>還原會覆蓋目前 App 的旅程資料。</p><div class="subtle">備份檔：${esc(f.name)}</div>`,`<button class="secondary" onclick="pendingRestoreFile=null;closeDlg()">取消</button><button class="dangerbtn" onclick="confirmRestore()">確定還原</button>`)});async function confirmRestore(){const f=pendingRestoreFile;if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.data?.trips)throw 0;data=obj.data;saveData();const dbase=await db();await new Promise(res=>{const tx=dbase.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res});for(const a of obj.files||[]){a.blob=await dataURLToBlob(a.blob);await putAttachment(a)}pendingRestoreFile=null;route={tab:'trips',tripId:null,dayId:null};closeDlg();render();dlg('還原完成','<p>App 資料已還原。</p>',`<button class="primary" onclick="closeDlg()">完成</button>`)}catch(err){dlg('無法還原','<p>這不是有效的備份檔。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`)}}
async function tripAttachmentIds(t){const ids=new Set([...(t.stays||[]).map(x=>x.id),...(t.passes||[]).map(x=>x.id)]);for(const d of t.days||[])for(const it of d.items||[])ids.add(it.id);return ids}
async function tripAttachmentIdsForExport(t){return tripAttachmentIds(t)}
async function exportTravelPack(){const t=currentMemoTrip();if(!t){dlg('請先選旅程','<p>請先進入要匯出的旅程，再到設定匯出。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`);return}const ids=await tripAttachmentIds(t),files=[];for(const a of await getAllAttachments()){if(ids.has(a.itemId))files.push({...a,blob:await blobToDataURL(a.blob)})}const pack={format:'ajo.travel',version:1,created:new Date().toISOString(),trip:structuredClone(t),files};const safe=(t.name||'旅程').replace(/[\\/:*?"<>|]/g,'_');await downloadBlob(new Blob([JSON.stringify(pack)],{type:'application/json'}),`${safe}.ajo.json`)}
let pendingTripImport=null;$('#tripImportFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='ajo.travel'||!obj.trip?.id||!Array.isArray(obj.trip.days))throw 0;pendingTripImport=obj;const exists=data.trips.some(t=>t.id===obj.trip.id);dlg('匯入旅程',`<p>${esc(obj.trip.name)}</p><div class="subtle">${esc(obj.trip.start||'')} ～ ${esc(obj.trip.end||'')}｜${obj.files?.length||0} 個附件</div>${exists?'<p style="margin-top:12px">手機裡已有同一趟旅程。匯入後會以這份檔案覆蓋。</p>':''}`,`<button class="secondary" onclick="pendingTripImport=null;closeDlg()">取消</button><button class="primary" onclick="confirmTripImport()">${exists?'覆蓋匯入':'匯入'}</button>`)}catch(err){dlg('無法匯入','<p>這不是有效的阿喬旅行筆記本旅程檔。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`)}})
async function confirmTripImport(){const obj=pendingTripImport;if(!obj)return;const old=data.trips.find(t=>t.id===obj.trip.id);if(old){const ids=await tripAttachmentIds(old);for(const a of await getAllAttachments())if(ids.has(a.itemId))await delAttachment(a.id);data.trips=data.trips.filter(t=>t.id!==old.id)}data.trips.push(migrateData({font:data.font,currentTripId:obj.trip.id,trips:[obj.trip]}).trips[0]);for(const a of obj.files||[]){a.blob=await dataURLToBlob(a.blob);await putAttachment(a)}data.currentTripId=obj.trip.id;saveData();pendingTripImport=null;route={tab:'trips',tripId:obj.trip.id,dayId:null};closeDlg();render();dlg('匯入完成',`<p>「${esc(obj.trip.name)}」已匯入，附件也已存到這台裝置。</p>`,`<button class="primary" onclick="closeDlg()">完成</button>`)}
function androidBack(){if(document.querySelector('#dialog')?.open){closeDlg();return true}if(route.dayId){route.dayId=null;renderTrip();return true}if(route.tripId){route.tripId=null;route.dayId=null;renderTrips();return true}if(route.tab!=='trips'){route={tab:'trips',tripId:null,dayId:null};render();return true}return false}
function exportTrip(){const t=currentMemoTrip();if(!t)return;const stays=(t.stays||[]).map(st=>`<div class="row">🏨 ${esc(st.name)}｜${st.start} → ${st.end}${st.breakfast&&st.breakfast!=='未設定'?`｜早餐：${esc(st.breakfast)}`:''}${st.note?`<br><small>${esc(st.note)}</small>`:''}</div>`).join('');const passes=(t.passes||[]).map(p=>`<div class="row">🎫 ${esc(p.name)}｜${p.start} → ${p.end}${p.note?`<br><small>${esc(p.note)}</small>`:''}</div>`).join('');const html=`<!doctype html><meta charset="utf-8"><title>${esc(t.name)}</title><style>body{font-family:sans-serif;max-width:800px;margin:30px auto;line-height:1.7}h1{border-bottom:5px solid #ffd600}.day{margin:22px 0}.row{padding:6px 0;border-bottom:1px solid #ddd}</style><h1>${esc(t.name)}</h1><p>${t.start} ～ ${t.end}</p><h2>住宿</h2>${stays||'<p>無</p>'}<h2>票券／通行證</h2>${passes||'<p>無</p>'}${[...t.days].sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<section class="day"><h2>${d.date}｜${esc(d.city)}</h2>${[...d.items].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).map(i=>`<div class="row">${esc(i.time||'')}　${esc(i.title)}${i.note?`<br><small>${esc(i.note)}</small>`:''}</div>`).join('')}${(d.costs||[]).length?`<h3>餐食與花費</h3>${d.costs.map(c=>`<div class="row">${esc(c.category)}｜${esc(c.note||'')}｜${esc(c.amount||'')} ${esc(d.currency||'')}</div>`).join('')}`:''}</section>`).join('')}<h2>旅行備忘錄</h2><pre style="white-space:pre-wrap">${esc(t.memo||'')}</pre>`;downloadBlob(new Blob([html],{type:'text/html'}),`${t.name}.html`)}
async function downloadBlob(blob,name){if(window.Android&&Android.saveBase64File){try{const url=await blobToDataURL(blob);Android.saveBase64File(name,blob.type||'application/octet-stream',url);return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
