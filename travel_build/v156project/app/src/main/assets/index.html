function staysForDay(t,date){return (t.stays||[]).filter(st=>st.start<=date&&date<=st.end).sort((a,b)=>a.start.localeCompare(b.start))}

function transportMeta(p){const type=p.type||'pass';if(type==='flight'){const route=[p.departAirport,p.arriveAirport].filter(Boolean).join(' → ');const dt=`${fmtDate(p.start)}${p.startTime?' '+p.startTime:''} → ${fmtDate(p.end)}${p.endTime?' '+p.endTime:''}`;return `${route?esc(route)+'　':''}${dt}${p.flightNo?'　'+esc(p.flightNo):''}`}const pg=passDayProgress(p,p.start);return `${fmtDate(p.start)} ～ ${fmtDate(p.end)}${type==='pass'&&pg.total>1?`　${pg.total} 日`:''}`}
function passesForDay(t,date){return (t.passes||[]).filter(p=>{const type=p.type||'pass';if(type==='flight')return p.start===date||p.end===date;return p.start<=date&&date<=p.end}).sort((a,b)=>a.start.localeCompare(b.start))}
function passDayStatus(p,date){const type=p.type||'pass';if(type==='flight'){if(p.start===p.end)return'今日航班';if(p.start===date)return'今日出發';if(p.end===date)return'今日抵達';return'航班'}if(type==='pass'){if(p.start===date&&p.end===date)return'今日有效';if(p.start===date)return'今日啟用';if(p.end===date)return'最後一天';return'使用中'}if(p.start===date&&p.end===date)return'今日使用';if(p.start===date)return'開始使用';if(p.end===date)return'最後一天';return'使用中'}
function passDayProgress(p,date){const a=p.start.split('-').map(Number),b=p.end.split('-').map(Number),c=date.split('-').map(Number),s=Date.UTC(a[0],a[1]-1,a[2]),e=Date.UTC(b[0],b[1]-1,b[2]),d=Date.UTC(c[0],c[1]-1,c[2]),one=86400000,total=Math.round((e-s)/one)+1,day=Math.round((d-s)/one)+1;return {day,total}}

function spendRateCache(){
  for(const key of [SPENDRATECACHE,LEGACYRATECACHE]){
    try{
      const c=JSON.parse(localStorage.getItem(key)||'null');
      if(c?.rates?.TWD){
        if(key===LEGACYRATECACHE&&!localStorage.getItem(SPENDRATECACHE))localStorage.setItem(SPENDRATECACHE,JSON.stringify(c));
        return c;
      }
    }catch(e){}
  }
  return null;
}

function renderAlt(){const scoped=route.tripId?tripById(route.tripId):null;const renderList=t=>{t.alternatives=t.alternatives||[];const list=t.alternatives.filter(a=>altFilter==='全部'||a.type===altFilter);return list.length?list.map(a=>{const detail=[a.area,a.note].filter(Boolean).join('・');return `<div class="alt-card" onclick="editAlt('${a.id}')"><div class="alt-compact-top"><span class="alt-badge">${esc(a.type||'其他')}</span><div class="alt-compact-title">${esc(a.title)}</div><button class="alt-menu" aria-label="更多操作" onclick="event.stopPropagation();openAltActionMenu('${a.id}')">⋯</button></div><div class="alt-compact-sub">${altStatusHtml(a)}<span class="alt-compact-subtext">${esc(detail||'點一下卡片即可編輯')}</span></div></div>`}).join(''):`<div class="empty">${altFilter==='全部'?'還沒有備選地點':'這個分類目前沒有備選地點'}</div>`};const filters=`<div class="alt-filter">${['全部',...altTypes].map(x=>`<button class="alt-chip ${altFilter===x?'on':''}" onclick="setAltFilter('${x}')">${x}</button>`).join('')}</div>`;if(scoped){$('#screen').innerHTML=topbar('備選地點',false)+`<main class="content">${filters}${renderList(scoped)}</main><button class="fab" onclick="newAlt('${scoped.id}')">＋</button>`;return}if(!data.trips.length){$('#screen').innerHTML=topbar('備選地點',false)+`<main class="content"><div class="empty">請先新增一趟旅程</div></main>`;return}const groups=data.trips.map(t=>{const count=(t.alternatives||[]).filter(a=>altFilter==='全部'||a.type===altFilter).length;if(!count&&altFilter!=='全部')return'';return `<section class="global-group"><div class="trip-scope-head"><div class="trip-scope-title">${esc(t.name)}</div><div class="trip-scope-count">${count} 個</div></div>${renderList(t)}</section>`}).join('');$('#screen').innerHTML=topbar('備選地點',false)+`<main class="content">${filters}${groups||'<div class="empty">目前沒有備選地點</div>'}</main><button class="fab" onclick="chooseTripForNewAlt()">＋</button>`}
function altForm(a={},includeFiles=false){return `<div class="formgrid"><div class="field"><label>種類</label><select id="aType">${altTypes.map(x=>`<option ${x===(a.type||'餐廳')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>地點／餐廳名稱</label><input id="aTitle" value="${esc(a.title||'')}" placeholder="例如：想吃的餐廳"></div><div class="field"><label>城市／區域（選填）</label><input id="aArea" value="${esc(a.area||'')}" placeholder="例如：西面／海雲台"></div><div class="field"><label>簡短備註</label><textarea class="alt-form-note" id="aNote">${esc(a.note||'')}</textarea></div><div class="field"><label>Google Maps 網址</label><input id="aMaps" value="${esc(a.maps||'')}"></div><div class="field"><label>NAVER／其他網址</label><input id="aUrl" value="${esc(a.url||'')}"></div><div class="field"><label>狀態</label><select id="aStatus"><option value="candidate" ${(a.status||'candidate')==='candidate'?'selected':''}>備選</option><option value="visited" ${a.status==='visited'?'selected':''}>已去</option></select></div>${a.scheduledDate?`<div class="subtle">目前標記：已排入 ${fmtDate(a.scheduledDate)}</div>`:''}${includeFiles?`<div class="field"><label>附件（可多選 PDF／圖片）</label><input id="aFiles" type="file" accept="application/pdf,image/*" multiple></div>`:''}</div>`}
function chooseTripForNewAlt(){if(!data.trips.length)return appAlert('請先新增旅程');dlg('加入哪一趟旅程？',`<div class="trip-select-list">${data.trips.map(t=>`<button class="tiny trip-select-btn" onclick="closeDlg();newAlt('${t.id}')">${esc(t.name)}</button>`).join('')}</div>`,`<button class="secondary" onclick="closeDlg()">取消</button>`)}
let pendingAltTripId='';
function newAlt(tid=route.tripId){const t=tripById(tid);if(!t)return chooseTripForNewAlt();pendingAltTripId=tid;dlg('新增備選地點',altForm({},true),`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveNewAlt()">新增</button>`)}
async function saveNewAlt(){const t=tripById(pendingAltTripId||route.tripId),title=$('#aTitle').value.trim();if(!t)return;if(!title)return appAlert('請填地點／餐廳名稱');const id=uid();const a={id,type:$('#aType').value,title,area:$('#aArea').value.trim(),note:$('#aNote').value,maps:$('#aMaps').value.trim(),url:$('#aUrl').value.trim(),status:$('#aStatus').value,scheduledDayId:'',scheduledDate:''};t.alternatives=t.alternatives||[];t.alternatives.push(a);for(const f of [...($('#aFiles')?.files||[])])await putAttachment({id:uid(),itemId:id,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});saveData();pendingAltTripId='';closeDlg();renderAlt()}
function editAlt(id){const f=findAlt(id);if(!f)return;dlg('編輯備選地點',altForm(f.a,true),`<button class="dangerbtn" onclick="deleteAlt('${id}')">刪除</button><button class="primary" onclick="saveAltEdit('${id}')">儲存</button>`)}
async function saveAltEdit(id){const f=findAlt(id),title=$('#aTitle').value.trim();if(!f)return;if(!title)return appAlert('請填地點／餐廳名稱');Object.assign(f.a,{type:$('#aType').value,title,area:$('#aArea').value.trim(),note:$('#aNote').value,maps:$('#aMaps').value.trim(),url:$('#aUrl').value.trim(),status:$('#aStatus').value});for(const file of [...($('#aFiles')?.files||[])])await putAttachment({id:uid(),itemId:id,name:file.name,type:file.type||'application/octet-stream',blob:file,created:Date.now()});saveData();closeDlg();renderAlt()}
function deleteAlt(id){const f=findAlt(id);if(!f)return;dlg('刪除備選地點',`<p>確定刪除「${esc(f.a.title)}」？</p>`,`<button class="secondary" onclick="editAlt('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeleteAlt('${id}')">確定刪除</button>`)}
async function confirmDeleteAlt(id){const f=findAlt(id);if(!f)return;await deleteAttachmentsByItem(id);f.t.alternatives=(f.t.alternatives||[]).filter(x=>x.id!==id);saveData();closeDlg();renderAlt()}
function addAltToItinerary(id){const f=findAlt(id);if(!f)return;const days=[...(f.t.days||[])].sort((a,b)=>a.date.localeCompare(b.date));if(!days.length)return appAlert('請先在旅程裡新增日期');dlg('加入行程',`<div class="formgrid"><div class="field"><label>加入哪一天</label><select id="altDay">${days.map(d=>`<option value="${d.id}">${fmtDate(d.date)}｜${esc(d.city||'')}</option>`).join('')}</select></div><div class="field"><label>時間（選填）</label><input id="altTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="例如 1830" oninput="formatTimeTyping(this)"></div><div class="subtle">加入後，這筆仍會保留在「備選」裡。</div></div>`,`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="confirmAddAltToItinerary('${id}')">加入</button>`)}
async function confirmAddAltToItinerary(id){const f=findAlt(id);if(!f)return;const d=dayById(f.t,$('#altDay').value),time=normalizeTime($('#altTime').value);if(time===null)return appAlert('時間請用 24 小時制，例如 1830 或 18:30');const iid=uid();d.items=d.items||[];d.items.push({id:iid,time,type:altItemType(f.a.type),title:f.a.title,note:f.a.note||'',maps:f.a.maps||'',url:f.a.url||''});f.a.scheduledDayId=d.id;f.a.scheduledDate=d.date;saveData();closeDlg();renderAlt();appAlert(`已加入 ${fmtDate(d.date)} 行程`)}
function moveItemToAlt(iid){const t=tripById(route.tripId),d=dayById(t,route.dayId),it=d?.items.find(x=>x.id===iid);if(!it)return;const type=it.type==='餐廳'?'餐廳':it.type==='景點'?'景點':it.type==='購物'?'購物':'其他';t.alternatives=t.alternatives||[];t.alternatives.push({id:it.id,type,title:it.title,area:d.city||'',note:it.note||'',maps:it.maps||'',url:it.url||'',status:'candidate',scheduledDayId:'',scheduledDate:''});removeLinkedReminder(t,'item',iid);d.items=d.items.filter(x=>x.id!==iid);saveData();syncNativeReminders();closeDlg();renderDay();appAlert('已移到備選地點')}

function currentMemoTrip(){return tripById(route.tripId)||tripById(data.currentTripId)||data.trips[0]}
function renderMemo(){const scoped=route.tripId?tripById(route.tripId):null;if(scoped){$('#screen').innerHTML=topbar('備忘',false)+`<main class="content"><textarea class="note-area" id="memoArea" placeholder="記下這趟旅程要準備、要注意、要買或要記得的事情…">${esc(scoped.memo||'')}</textarea><div class="savehint">自動儲存</div></main>`;$('#memoArea').addEventListener('input',e=>{scoped.memo=e.target.value;saveData()});return}if(!data.trips.length){$('#screen').innerHTML=topbar('備忘',false)+`<main class="content"><div class="empty">請先新增一趟旅程</div></main>`;return}$('#screen').innerHTML=topbar('備忘',false)+`<main class="content">${data.trips.map(t=>`<article class="card memo-overview-card" onclick="openTripMemo('${t.id}')"><div class="memo-overview-name">${esc(t.name)}</div><div class="memo-overview-preview">${t.memo?esc(t.memo):'尚未建立備忘'}</div></article>`).join('')}</main>`}
function renderReminderTab(){const scoped=route.tripId?tripById(route.tripId):null;const listHtml=t=>{const arr=reminderScopeRows(t);return arr.length?`<div class="reminder-page-list">${arr.map(r=>`<div class="reminder-page-row"><div class="reminder-page-main"><div class="reminder-page-title">${esc(r.title||'旅行提醒')}</div><div class="reminder-page-meta">${fmtDateTime(r.at)}・${reminderTargetText(r)}</div></div><button class="tiny" onclick="editReminderFromPage('${t.id}','${r.id}')">編輯</button></div>`).join('')}</div>`:`<div class="empty">尚未設定提醒</div>`};if(scoped){$('#screen').innerHTML=topbar('提醒',false)+`<main class="content">${listHtml(scoped)}</main><button class="fab" onclick="newReminderFromPage('${scoped.id}')">＋</button>`;return}if(!data.trips.length){$('#screen').innerHTML=topbar('提醒',false)+`<main class="content"><div class="empty">請先新增一趟旅程</div></main>`;return}$('#screen').innerHTML=topbar('提醒',false)+`<main class="content">${data.trips.map(t=>`<section class="global-group"><div class="trip-scope-head"><div class="trip-scope-title">${esc(t.name)}</div><button class="tiny yellow" onclick="newReminderFromPage('${t.id}')">＋ 新增</button></div>${listHtml(t)}</section>`).join('')}</main>`}
function newReminderFromPage(tid){dlg('新增提醒',reminderForm({}),`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveNewReminderFromPage('${tid}')">新增</button>`)}
function saveNewReminderFromPage(tid){const t=tripById(tid),title=$('#rTitle').value.trim(),at=$('#rAt').value;if(!t||!title||!at)return appAlert('請填提醒內容與時間');t.reminders=t.reminders||[];t.reminders.push({id:uid(),title,at,dayId:'',targetType:'trip',targetId:'',enabled:true});saveData();syncNativeReminders();closeDlg();renderReminderTab()}
function editReminderFromPage(tid,rid){const t=tripById(tid),r=(t?.reminders||[]).find(x=>x.id===rid);if(!r)return;dlg('編輯提醒',reminderForm(r),`<button class="dangerbtn" onclick="deleteReminderFromPage('${tid}','${rid}')">刪除</button><button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveReminderFromPage('${tid}','${rid}')">儲存</button>`)}
function saveReminderFromPage(tid,rid){const t=tripById(tid),r=(t?.reminders||[]).find(x=>x.id===rid),title=$('#rTitle').value.trim(),at=$('#rAt').value;if(!r||!title||!at)return appAlert('請填提醒內容與時間');Object.assign(r,{title,at});saveData();syncNativeReminders();closeDlg();renderReminderTab()}
function deleteReminderFromPage(tid,rid){const t=tripById(tid);if(!t)return;t.reminders=(t.reminders||[]).filter(x=>x.id!==rid);saveData();syncNativeReminders();closeDlg();renderReminderTab()}
function renderSettings(){$('#screen').innerHTML=topbar('設定',true)+`<main class="content"><section class="card"><div class="settings-row"><div><strong>字體大小</strong><small>整個 App 的閱讀尺寸</small></div><div class="seg">${[['normal','一般'],['large','較大'],['max','最大']].map(([v,l])=>`<button class="${data.font===v?'on':''}" onclick="setFont('${v}')">${l}</button>`).join('')}</div></div><div class="settings-row"><div><strong>匯入單一旅程</strong><small>從電腦帶入行程、住宿、交通票券與旅程備忘</small></div><button class="tiny yellow" onclick="$('#tripImportFile').click()">匯入</button></div><div class="settings-row"><div><strong>匯出目前旅程包</strong><small>帶到另一台裝置繼續使用</small></div><button class="tiny yellow" onclick="exportTravelPack()">匯出</button></div><div class="settings-row"><div><strong>備份 App 資料</strong><small>所有旅程、備忘、提醒與花費</small></div><button class="tiny" onclick="backupAll()">備份</button></div><div class="settings-row"><div><strong>還原 App 資料</strong><small>從完整備份檔恢復</small></div><button class="tiny" onclick="$('#restoreFile').click()">還原</button></div><div class="settings-row"><div><strong>匯出可閱讀行程表</strong><small>輸出 HTML，方便留存或列印</small></div><button class="tiny" onclick="exportTrip()">匯出</button></div></section></main>`}
function setFont(v){data.font=v;saveData();render()}
function closeDlg(){const d=$('#dialog');if(d?.open)d.close()}
function dlg(title,body,foot=''){const d=$('#dialog');d.innerHTML=`<div class="dlg-head"><span>${title}</span><button class="dlg-close" onclick="closeDlg()">×</button></div><div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;d.showModal();return d}
function appAlert(message){let el=document.getElementById('appAlertToast');if(!el){el=document.createElement('div');el.id='appAlertToast';el.className='app-alert-toast';document.body.appendChild(el)}el.textContent=message;el.classList.add('show');clearTimeout(window._appAlertTimer);window._appAlertTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function newTrip(){dlg('新增旅程',tripForm({}),`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveNewTrip()">新增</button>`)}
function tripForm(t){const all=currencyOrderForTrip(t),sel=new Set(t.currencies||[]);return `<div class="formgrid"><div class="field"><label>旅程名稱</label><input id="tName" value="${esc(t.name||'')}"></div><div class="two-col-row"><div class="field"><label>開始日期</label><input id="tStart" type="date" value="${esc(t.start||'')}"></div><div class="field"><label>結束日期</label><input id="tEnd" type="date" value="${esc(t.end||'')}"></div></div><div class="field"><label>這趟旅行使用的貨幣（可複選）</label><input id="currencySearch" class="currency-search" placeholder="搜尋，例如 KRW、泰銖、CAD" oninput="filterCurrencyOptions()"><div class="currency-list">${all.map(c=>`<label class="currency-choice" data-search="${esc((c+' '+currencyName(c)).toLowerCase())}"><input type="checkbox" class="curcheck" value="${c}" ${sel.has(c)?'checked':''} onchange="toggleTripRateRows()"><span><b>${c}</b><small>${esc(currencyName(c))}</small></span></label>`).join('')}</div><div class="subtle" style="margin-top:6px">這趟旅程、最近使用與常用貨幣會排在前面；其他世界貨幣可直接搜尋。</div></div><div class="field"><label>台幣換算匯率</label><div class="rate-box">${all.filter(c=>c!=='TWD').map(c=>{const auto=cachedTwdRate(c);return `<div class="rate-row trip-rate-row" data-cur="${c}" style="${sel.has(c)?'':'display:none'}"><span>1 ${c} ＝ NT$</span><input id="rate_${c}" type="number" inputmode="decimal" step="any" value="${esc(t.rates?.[c]||'')}" placeholder="${auto?`自動約 ${auto.toFixed(auto<1?4:2)}`:'自行設定'}"></div>`}).join('')}</div></div><div class="subtle">手動匯率優先；留空時使用自動更新匯率。各天仍可另外指定「當日主要貨幣」。</div></div>`}
function toggleTripRateRows(){const selected=new Set($$('.curcheck:checked').map(x=>x.value));$$('.trip-rate-row').forEach(r=>r.style.display=selected.has(r.dataset.cur)?'grid':'none')}
function collectTripRates(existing={}){const out={...existing,TWD:1};for(const c of $$('.curcheck:checked').map(x=>x.value)){if(c==='TWD')continue;const el=$(`#rate_${c}`),v=Number(el?.value);if(v>0)out[c]=v}return out}
function saveNewTrip(){const name=$('#tName').value.trim(),start=$('#tStart').value,end=$('#tEnd').value;if(!name||!start||!end)return appAlert('請填旅程名稱與日期');const curs=$$('.curcheck:checked').map(x=>x.value);const t={id:uid(),name,start,end,currencies:curs,rates:collectTripRates({}),memo:'',reminders:[],alternatives:[],stays:[],passes:[],days:[]};data.trips.push(t);data.currentTripId=t.id;saveData();closeDlg();openTrip(t.id)}
function editTrip(id){const t=tripById(id);dlg('旅程設定',tripForm(t),`<button class="dangerbtn" onclick="deleteTrip('${id}')">刪除旅程</button><button class="primary" onclick="saveTripEdit('${id}')">儲存</button>`)}
function saveTripEdit(id){const t=tripById(id);t.name=$('#tName').value.trim()||t.name;t.start=$('#tStart').value;t.end=$('#tEnd').value;t.currencies=$$('.curcheck:checked').map(x=>x.value);t.rates=collectTripRates(t.rates||{});saveData();closeDlg();render()}
function deleteTrip(id){const t=tripById(id);dlg('刪除旅程',`<p>確定刪除「${esc(t.name)}」？</p><div class="subtle">行程、餐食、住宿與相關資料都會一起刪除。</div>`,`<button class="secondary" onclick="editTrip('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeleteTrip('${id}')">確定刪除</button>`)}
async function confirmDeleteTrip(id){const t=tripById(id);if(!t)return;for(const d of t.days)for(const i of d.items||[])await deleteAttachmentsByItem(i.id);for(const st of t.stays||[])await deleteAttachmentsByItem(st.id);for(const p of t.passes||[])await deleteAttachmentsByItem(p.id);for(const a of t.alternatives||[])await deleteAttachmentsByItem(a.id);data.trips=data.trips.filter(x=>x.id!==id);if(data.currentTripId===id)data.currentTripId=data.trips[0]?.id||null;route.tripId=null;route.dayId=null;saveData();syncNativeReminders();closeDlg();render()}
function viewStay(id){const found=findStay(id);if(!found)return;const {st}=found,mapUrl=preferredMapUrl(st);const body=`<div class="detail-title">${esc(st.name)}</div><div class="detail-meta">${fmtDate(st.start)} 入住 → ${fmtDate(st.end)} 退房</div><div class="view-lines">${st.breakfast&&st.breakfast!=='未設定'?`<div class="view-line"><small>早餐</small>${esc(st.breakfast)}</div>`:''}${st.booking?`<div class="view-line"><small>訂房編號</small>${esc(st.booking)}</div>`:''}${st.note?`<div class="view-line"><small>備註</small>${esc(st.note)}</div>`:''}</div>${mapUrl?`<div class="detail-block"><div class="detail-actions"><button class="secondary" onclick="openStayMap('${id}')">地圖</button></div></div>`:''}`;dlg('住宿詳細內容',body,`<button class="secondary" onclick="closeDlg()">關閉</button><button class="secondary" onclick="openAttachments('${id}')">附件</button><button class="primary" onclick="editStay('${id}')">編輯</button>`)}
function stayForm(st={},includeFiles=false){return `<div class="formgrid"><div class="field"><label>住宿名稱</label><input id="sName" value="${esc(st.name||'')}" placeholder="例如：L7 Haeundae"></div><div class="two-col-row"><div class="field"><label>入住日期</label><input id="sStart" type="date" value="${esc(st.start||'')}"></div><div class="field"><label>退房日期</label><input id="sEnd" type="date" value="${esc(st.end||'')}"></div></div><div class="field"><label>早餐</label><select id="sBreakfast">${['未設定','有','無','另購'].map(x=>`<option ${x===(st.breakfast||'未設定')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>訂房編號（選填）</label><input id="sBooking" value="${esc(st.booking||'')}"></div><div class="field"><label>簡單備註</label><textarea id="sNote" style="width:100%;min-height:75px;border:1px solid #ddd7c4;border-radius:12px;padding:11px">${esc(st.note||'')}</textarea></div><div class="field"><label>Google Maps 網址</label><input id="sMaps" value="${esc(st.maps||'')}"></div><div class="field"><label>其他網址</label><input id="sUrl" value="${esc(st.url||'')}"></div><div class="field"><label>提醒時間（選填）</label><input id="sReminder" type="datetime-local" value="${esc(getLinkedReminderAt('stay',st.id||''))}"></div>${includeFiles?`<div class="field"><label>訂房 PDF／圖片（可多選）</label><input id="sFiles" type="file" accept="application/pdf,image/*" multiple></div>`:''}</div>`}
function newStay(tid){dlg('新增住宿',stayForm({},true),`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveNewStay('${tid}')">新增</button>`)}
async function saveNewStay(tid){const t=tripById(tid),name=$('#sName').value.trim(),start=$('#sStart').value,end=$('#sEnd').value;if(!name||!start||!end)return appAlert('請填住宿名稱、入住與退房日期');if(end<start)return appAlert('退房日期不能早於入住日期');const id=uid();t.stays=t.stays||[];t.stays.push({id,name,start,end,breakfast:$('#sBreakfast').value,booking:$('#sBooking').value.trim(),note:$('#sNote').value,maps:$('#sMaps').value.trim(),url:$('#sUrl').value.trim()});upsertLinkedReminder(t,'stay',id,`住宿：${name}`,$('#sReminder').value,start?dayByDateId(t,start):'');saveData();for(const f of [...($('#sFiles')?.files||[])])await putAttachment({id:uid(),itemId:id,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});closeDlg();render()}
function findStay(id){for(const t of data.trips){const st=(t.stays||[]).find(x=>x.id===id);if(st)return {t,st}}return null}
function editStay(id){const found=findStay(id);if(!found)return;const {st}=found;dlg('編輯住宿',stayForm(st,true),`<button class="dangerbtn" onclick="deleteStay('${id}')">刪除住宿</button><button class="primary" onclick="saveStayEdit('${id}')">儲存</button>`)}
async function saveStayEdit(id){const found=findStay(id);if(!found)return;const {t,st}=found,name=$('#sName').value.trim(),start=$('#sStart').value,end=$('#sEnd').value;if(!name||!start||!end)return appAlert('請填住宿名稱、入住與退房日期');if(end<start)return appAlert('退房日期不能早於入住日期');Object.assign(st,{name,start,end,breakfast:$('#sBreakfast').value,booking:$('#sBooking').value.trim(),note:$('#sNote').value,maps:$('#sMaps').value.trim(),url:$('#sUrl').value.trim()});upsertLinkedReminder(t,'stay',id,`住宿：${name}`,$('#sReminder').value,start?dayByDateId(t,start):'');for(const f of [...($('#sFiles')?.files||[])])await putAttachment({id:uid(),itemId:id,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});saveData();closeDlg();render()}
function deleteStay(id){const found=findStay(id);if(!found)return;dlg('刪除住宿',`<p>確定刪除住宿「${esc(found.st.name)}」？</p><label class="checkline" style="margin-top:12px"><input id="deleteStayFiles" type="checkbox" checked> 同時刪除離線 PDF／圖片</label>`,`<button class="secondary" onclick="editStay('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeleteStay('${id}')">確定刪除</button>`)}

function viewPass(id){const found=findPass(id);if(!found)return;const {p}=found,type=p.type||'pass';let lines='';if(type==='flight'){lines=`<div class="view-line"><small>起飛</small>${esc(p.start||'')} ${esc(p.startTime||'')}　${esc(p.from||'')} → ${esc(p.to||'')}</div><div class="view-line"><small>抵達</small>${esc(p.end||'')} ${esc(p.endTime||'')}</div>`}else if(type==='pass'){lines=`<div class="view-line"><small>使用日期</small>${fmtDate(p.start)} ～ ${fmtDate(p.end)}</div>${p.validFrom||p.validUntil?`<div class="view-line"><small>精確有效時間</small>${p.validFrom?fmtDateTime(p.validFrom):''}${p.validFrom&&p.validUntil?' → ':''}${p.validUntil?fmtDateTime(p.validUntil):''}</div>`:''}`}else{lines=`<div class="view-line"><small>日期</small>${fmtDate(p.start)} ～ ${fmtDate(p.end)}</div>`}if(p.note)lines+=`<div class="view-line"><small>備註</small>${esc(p.note)}</div>`;dlg('交通／票券詳細內容',`<div class="detail-title"><span class="kind-badge ${type}">${transportLabel(type)}</span>${esc(p.name)}</div><div class="view-lines">${lines}</div>`,`<button class="secondary" onclick="closeDlg()">關閉</button><button class="secondary" onclick="openAttachments('${id}')">附件</button><button class="primary" onclick="editPass('${id}')">編輯</button>`)}

p.validFrom||'')}"></div><div class="field"><label>精確有效截止（選填）</label><input id="pValidUntil" type="datetime-local" value="${esc(p.validUntil||'')}"></div></div><div class="viewer-note">每日顯示與第幾天，只依「使用開始／結束日期」計算。</div></div><div class="pass-type-fields" data-pass-types="train,bus,activity,other"><div class="two-col-row"><div class="field"><label>開始日期</label><input id="pOStart" type="date" value="${esc(p.start||'')}"></div><div class="field"><label>結束日期</label><input id="pOEnd" type="date" value="${esc(p.end||p.start||'')}"></div></div><div class="two-col-row"><div class="field"><label>開始時間（選填）</label><input id="pOStartTime" type="time" value="${esc(p.startTime||'')}"></div><div class="field"><label>結束時間（選填）</label><input id="pOEndTime" type="time" value="${esc(p.endTime||'')}"></div></div></div><div class="field"><label>簡單備註</label><textarea id="pNote" style="width:100%;min-height:72px;border:1px solid #ddd7c4;border-radius:12px;padding:11px">${esc(p.note||'')}</textarea></div><div class="field"><label>提醒時間（選填）</label><input id="pReminder" type="datetime-local" value="${esc(getLinkedReminderAt('pass',p.id||''))}"></div>${includeFiles?`<div class="field"><label>PDF／圖片（可多選）</label><input id="pFiles" type="file" accept="application/pdf,image/*" multiple></div>`:''}</div>`}
function newPass(tid){dlg('新增交通／票券',passForm({},true),`<button class="secondary" onclick="closeDlg()">取消</button><button class="primary" onclick="saveNewPass('${tid}')">新增</button>`);setTimeout(togglePassFields,0)}
async function saveNewPass(tid){const t=tripById(tid),v=readPassForm();if(!v.name||!v.start||!v.end)return appAlert('請填名稱與日期');if(v.end<v.start)return appAlert('結束日期不能早於開始日期');const id=uid();t.passes=t.passes||[];t.passes.push({id,...v});upsertLinkedReminder(t,'pass',id,`${transportLabel(v.type)}：${v.name}`,$('#pReminder').value,dayByDateId(t,v.start));saveData();for(const f of [...($('#pFiles')?.files||[])])await putAttachment({id:uid(),itemId:id,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});closeDlg();render()}
function findPass(id){for(const t of data.trips){const p=(t.passes||[]).find(x=>x.id===id);if(p)return {t,p}}return null}

function deletePass(id){const found=findPass(id);if(!found)return;dlg('刪除交通／票券',`<p>確定刪除「${esc(found.p.name)}」？</p><label class="checkline" style="margin-top:12px"><input id="deletePassFiles" type="checkbox" checked> 同時刪除離線 PDF／圖片</label>`,`<button class="secondary" onclick="editPass('${id}')">取消</button><button class="dangerbtn" onclick="confirmDeletePass('${id}')">確定刪除</button>`)}

function newDay(tid){dlg('新增一天',`<div class="formgrid"><div class="field"><label>日期</label><input id="dDate" type="date"></div><div class="field"><label>城市</label><input id="dCity" placeholder="例如：倫敦"></div><div class="field"><label>當日主要貨幣</label><select id="dCur">${(tripById(tid).currencies.length?tripById(tid).currencies:['TWD']).map(c=>`<option>${c}</option>`).join('')}</select></div></div>`,`<button class="primary" onclick="saveNewDay('${tid}')">新增</button>`)}
function saveNewDay(tid){const t=tripById(tid),date=$('#dDate').value,city=$('#dCity').value.trim();if(!date)return appAlert('請選日期');t.days.push({id:uid(),date,city,currency:$('#dCur').value,items:[],costs:[],memo:''});saveData();closeDlg();render()}
function editDay(did){const t=tripById(route.tripId),d=dayById(t,did);dlg('編輯這一天',`<div class="formgrid"><div class="field"><label>日期</label><input id="dDate" type="date" value="${d.date}"></div><div class="field"><label>城市</label><input id="dCity" value="${esc(d.city)}"></div><div class="field"><label>當日主要貨幣</label><select id="dCur">${[...new Set([...t.currencies,d.currency||'TWD'])].map(c=>`<option ${c===d.currency?'selected':''}>${c}</option>`).join('')}</select></div></div>`,`<button class="dangerbtn" onclick="deleteDay('${did}')">刪除日期</button><button class="primary" onclick="saveDayEdit('${did}')">儲存</button>`)}
function deleteDay(did){const t=tripById(route.tripId),d=dayById(t,did);if(!d)return;dlg('刪除日期',`<p>確定刪除 ${esc(d.date)} 這一天及其中所有行程？</p><div class="subtle">這一天行程所附的離線 PDF／圖片也會一起刪除。</div>`,`<button class="secondary" onclick="editDay('${did}')">取消</button><button class="dangerbtn" onclick="confirmDeleteDay('${did}')">確定刪除</button>`)}
async function confirmDeleteDay(did){const t=tripById(route.tripId),d=dayById(t,did);if(!d)return;for(const i of d.items||[])await deleteAttachmentsByItem(i.id);const itemIds=new Set((d.items||[]).map(i=>i.id));t.reminders=(t.reminders||[]).filter(r=>r.dayId!==did&&!itemIds.has(r.targetId));t.days=t.days.filter(x=>x.id!==did);route.dayId=null;saveData();syncNativeReminders();closeDlg();render()}
function saveDayEdit(did){const d=dayById(tripById(route.tripId),did);d.date=$('#dDate').value;d.city=$('#dCity').value.trim();d.currency=$('#dCur').value;saveData();closeDlg();render()}
function formatTimeTyping(el){let d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d.length===2?d+':':d}
function normalizeTime(raw){raw=String(raw||'').trim();if(!raw)return'';let h,m;if(raw.includes(':')){const p=raw.split(':');if(p.length!==2)return null;h=Number(p[0]);m=Number(p[1])}else{const d=raw.replace(/\D/g,'');if(d.length===3){h=Number(d.slice(0,1));m=Number(d.slice(1))}else if(d.length===4){h=Number(d.slice(0,2));m=Number(d.slice(2))}else return null}if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>23||m<0||m>59)return null;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
let wheelHour=12,wheelMinute=0,wheelTimer=null;
function wheelOptions(max,selected,kind){let out='';for(let i=0;i<max;i++){const v=String(i).padStart(2,'0');out+=`<div class="wheel-option ${i===selected?'selected':''}" data-v="${i}" onclick="wheelTap('${kind}',${i},this)">${v}</div>`}return out}
function refreshWheelSelected(col){const idx=Math.max(0,Math.min(col.children.length-1,Math.round(col.scrollTop/44)));[...col.children].forEach((x,i)=>x.classList.toggle('selected',i===idx));if(col.dataset.kind==='h')wheelHour=idx;else wheelMinute=idx}
function wheelScroll(col){clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{const idx=Math.max(0,Math.min(col.children.length-1,Math.round(col.scrollTop/44)));col.scrollTo({top:idx*44,behavior:'smooth'});refreshWheelSelected(col)},70)}
function wheelTap(kind,v,el){const col=el.parentElement;col.scrollTo({top:v*44,behavior:'smooth'});if(kind==='h')wheelHour=v;else wheelMinute=v;setTimeout(()=>refreshWheelSelected(col),180)}
function initWheelFromCurrent(){const raw=$('#iTime')?.value||'';const m=/^(\d{2}):(\d{2})$/.exec(raw);if(m){wheelHour=Number(m[1]);wheelMinute=Number(m[2])}else{const n=new Date();wheelHour=n.getHours();wheelMinute=Math.round(n.getMinutes()/5)*5;if(wheelMinute>=60){wheelMinute=0;wheelHour=(wheelHour+1)%24}}}
function renderInlineTimeWheel(){const box=$('#inlineTimeWheel');if(!box)return;box.innerHTML=`<div class="wheel-title">上下滑動選擇時間</div><div class="wheel-grid"><div class="wheel-center"></div><div class="wheel-col" data-kind="h" onscroll="wheelScroll(this)">${wheelOptions(24,wheelHour,'h')}</div><div class="wheel-colon">：</div><div class="wheel-col" data-kind="m" onscroll="wheelScroll(this)">${wheelOptions(60,wheelMinute,'m')}</div></div><div class="wheel-actions"><button type="button" class="secondary" onclick="cancelInlineTimeWheel()">取消</button><button type="button" class="primary" onclick="confirmInlineTimeWheel()">完成</button><button type="button" class="wheel-clear" onclick="clearInlineTimeWheel()">清除時間</button></div>`;box.classList.add('show');requestAnimationFrame(()=>{box.querySelectorAll('.wheel-col').forEach(col=>{const v=col.dataset.kind==='h'?wheelHour:wheelMinute;col.scrollTop=v*44;refreshWheelSelected(col)});box.scrollIntoView({block:'nearest',behavior:'smooth'})})}
function toggleInlineTimeWheel(){const box=$('#inlineTimeWheel');if(!box)return;if(box.classList.contains('show')){box.classList.remove('show');box.innerHTML='';return}initWheelFromCurrent();renderInlineTimeWheel()}
function cancelInlineTimeWheel(){const box=$('#inlineTimeWheel');if(box){box.classList.remove('show');box.innerHTML=''}}
function clearInlineTimeWheel(){const el=$('#iTime'),txt=$('#iTimeText');if(el)el.value='';if(txt)txt.textContent='未設定';cancelInlineTimeWheel()}
function confirmInlineTimeWheel(){const v=String(wheelHour).padStart(2,'0')+':'+String(wheelMinute).padStart(2,'0'),el=$('#iTime'),txt=$('#iTimeText');if(el)el.value=v;if(txt)txt.textContent=v;cancelInlineTimeWheel()}
function viewItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d?.items.find(x=>x.id===iid);if(!it)return;const hasNaver=isNaverMapUrl(it.url||'');let actions='';if(hasNaver)actions+=`<button class="primary" onclick="openExternalUrl('${esc(it.url)}')">NAVER 地圖</button>`;if(it.maps)actions+=`<button class="secondary" onclick="openExternalUrl('${esc(it.maps)}')">Google Maps</button>`;if(it.url&&!hasNaver)actions+=`<button class="secondary" onclick="openExternalUrl('${esc(it.url)}')">其他連結</button>`;const body=`<div class="detail-title"><span class="type-mark">${typeIcon(it.type)}</span> ${esc(it.title)}</div><div class="detail-meta">${it.time?esc(it.time)+'　':''}${esc(it.type||'')}</div>${it.note?`<div class="detail-block"><div class="detail-label">備註</div><div class="detail-text">${esc(it.note)}</div></div>`:''}${actions?`<div class="detail-block"><div class="detail-label">連結</div><div class="detail-actions">${actions}</div></div>`:''}`;dlg('行程詳細內容',body,`<button class="secondary" onclick="closeDlg()">關閉</button><button class="secondary" onclick="openAttachments('${iid}')">附件</button><button class="primary" onclick="editItem('${iid}')">編輯</button>`)}

function newItem(did){dlg('新增行程',itemForm({type:'一般'},true),`<button class="primary" onclick="saveNewItem('${did}')">新增</button>`)}
async function saveNewItem(did){const t=tripById(route.tripId),d=dayById(t,did),title=$('#iTitle').value.trim();if(!title)return appAlert('請填行程名稱');const time=normalizeTime($('#iTime').value);if(time===null)return appAlert('時間請用 24 小時制，例如 0830 或 08:30');const iid=uid();d.items.push({id:iid,time,type:$('#iType').value,title,note:$('#iNote').value,maps:$('#iMaps').value.trim(),url:$('#iUrl').value.trim()});upsertLinkedReminder(t,'item',iid,title,$('#iReminder').value,did);saveData();const files=[...($('#iFiles')?.files||[])];for(const f of files)await putAttachment({id:uid(),itemId:iid,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});closeDlg();renderDay()}
function editItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d.items.find(x=>x.id===iid);dlg('編輯行程',itemForm(it,true),`<button class="dangerbtn" onclick="deleteItem('${iid}')">刪除行程</button><button class="secondary" onclick="moveItemToAlt('${iid}')">移到備選</button><button class="secondary" onclick="duplicateItem('${iid}')">複製</button><button class="primary" onclick="saveItemEdit('${iid}')">儲存</button>`)}
async function saveItemEdit(iid){const t=tripById(route.tripId),d=dayById(t,route.dayId),it=d.items.find(x=>x.id===iid),time=normalizeTime($('#iTime').value);if(time===null)return appAlert('時間請用 24 小時制，例如 0830 或 08:30');Object.assign(it,{time,type:$('#iType').value,title:$('#iTitle').value.trim(),note:$('#iNote').value,maps:$('#iMaps').value.trim(),url:$('#iUrl').value.trim()});upsertLinkedReminder(t,'item',iid,it.title,$('#iReminder').value,d.id);const files=[...($('#iFiles')?.files||[])];for(const f of files)await putAttachment({id:uid(),itemId:iid,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()});saveData();closeDlg();renderDay()}
function duplicateItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d.items.find(x=>x.id===iid);d.items.push({...structuredClone(it),id:uid(),title:it.title+'（複製）'});saveData();closeDlg();renderDay()}
function deleteItem(iid){const d=dayById(tripById(route.tripId),route.dayId),it=d?.items.find(x=>x.id===iid);if(!it)return;dlg('刪除行程',`<p>確定刪除「${esc(it.title)}」？</p><label class="checkline" style="margin-top:12px"><input id="deleteItemFiles" type="checkbox" checked> 同時刪除這筆行程的離線 PDF／圖片</label>`,`<button class="secondary" onclick="editItem('${iid}')">取消</button><button class="dangerbtn" onclick="confirmDeleteItem('${iid}')">確定刪除</button>`)}
async function confirmDeleteItem(iid){const t=tripById(route.tripId),d=dayById(t,route.dayId);if(!d)return;if($('#deleteItemFiles')?.checked)await deleteAttachmentsByItem(iid);removeLinkedReminder(t,'item',iid);d.items=d.items.filter(x=>x.id!==iid);saveData();syncNativeReminders();closeDlg();renderDay()}
// ---- IndexedDB attachments ----
const DBNAME='ajo_travel_files',STORE='attachments';let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore(STORE,{keyPath:'id'});s.createIndex('itemId','itemId',{unique:false})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbp}
async function getAttachments(itemId){const d=await db();return new Promise(res=>{const tx=d.transaction(STORE,'readonly'),idx=tx.objectStore(STORE).index('itemId'),r=idx.getAll(itemId);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
async function getAllAttachments(){const d=await db();return new Promise(res=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
async function putAttachment(a){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(a);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function delAttachment(id){const d=await db();return new Promise(res=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>res()})}
async function deleteAttachmentsByItem(itemId){for(const a of await getAttachments(itemId))await delAttachment(a.id)}
async function openAttachments(itemId){attachTarget=itemId;const arr=await getAttachments(itemId);dlg('附件',`<div id="attachList">${arr.length?arr.map(a=>attachHtml(a)).join(''):'<div class="empty">尚未加入附件</div>'}</div><div style="margin-top:12px"><button class="primary" style="width:100%" onclick="chooseAttach('${itemId}')">＋ 加入更多 PDF／圖片</button></div>`)}
function attachHtml(a){return `<div class="attach-item"><span>📄</span><span class="aname">${esc(a.name)}</span><button class="tiny yellow" onclick="openAttachmentId('${a.id}')">開啟</button><button class="tiny" onclick="renameAttachment('${a.id}')">改名</button><button class="tiny" onclick="removeAttachment('${a.id}')">刪除</button></div>`}
function chooseAttach(itemId){attachTarget=itemId;$('#hiddenFile').value='';$('#hiddenFile').click()}
$('#hiddenFile')?.addEventListener('change',async e=>{if(!attachTarget)return;for(const f of e.target.files){await putAttachment({id:uid(),itemId:attachTarget,name:f.name,type:f.type||'application/octet-stream',blob:f,created:Date.now()})}closeDlg();await openAttachments(attachTarget);if(route.tab==='attachments')renderAttachmentTab();else if(route.dayId)renderDay();else if(route.tripId)renderTrip()});
async function openAttachmentId(id){const a=(await getAllAttachments()).find(x=>x.id===id);if(a)openBlob(a)}
async function openBlob(a){if(window.Android&&Android.openBase64File){try{const url=await blobToDataURL(a.blob);Android.openBase64File(a.name,a.type||'application/octet-stream',url);return}catch(e){}}const u=URL.createObjectURL(a.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function renameAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;dlg('附件改名',`<div class="field"><label>顯示名稱</label><input id="renameValue" value="${esc(a.name)}" autofocus></div>`,`<button class="secondary" onclick="openAttachments('${a.itemId}')">取消</button><button class="primary" onclick="saveAttachmentRename('${id}')">儲存</button>`);setTimeout(()=>$('#renameValue')?.select(),50)}
async function saveAttachmentRename(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id),n=$('#renameValue')?.value.trim();if(!a||!n)return;a.name=n;await putAttachment(a);await openAttachments(a.itemId);if(route.tab==='attachments')renderAttachmentTab();else if(route.dayId)renderDay();else if(route.tripId)renderTrip()}
async function removeAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;dlg('刪除附件',`<p>確定刪除附件「${esc(a.name)}」？</p>`,`<button class="secondary" onclick="openAttachments('${a.itemId}')">取消</button><button class="dangerbtn" onclick="confirmRemoveAttachment('${id}')">確定刪除</button>`)}
async function confirmRemoveAttachment(id){const all=await getAllAttachments(),a=all.find(x=>x.id===id);if(!a)return;await delAttachment(id);await openAttachments(a.itemId);if(route.tab==='attachments')renderAttachmentTab();else if(route.dayId)renderDay();else if(route.tripId)renderTrip()}
function attachmentOwnerIndex(){const map=new Map();for(const t of data.trips||[]){for(const st of t.stays||[])map.set(st.id,{tripId:t.id,label:`住宿｜${st.name}`,kind:'住宿'});for(const p of t.passes||[])map.set(p.id,{tripId:t.id,label:`交通／票券｜${p.name}`,kind:'交通／票券'});for(const a of t.alternatives||[])map.set(a.id,{tripId:t.id,label:`備選｜${a.title}`,kind:'備選'});for(const d of t.days||[])for(const it of d.items||[])map.set(it.id,{tripId:t.id,label:`${fmtDate(d.date)}｜${it.title}`,kind:'行程'})}return map}
function attachmentOverviewRow(owner,files){return `<div class="attachment-overview-row"><div class="attachment-overview-head"><div><strong>${esc(owner.label)}</strong><small>${files.length} 個附件</small></div><button class="tiny yellow" onclick="openAttachments('${files[0].itemId}')">管理</button></div>${files.map(a=>attachHtml(a)).join('')}</div>`}
async function renderAttachmentTab(){const screen=$('#screen');screen.innerHTML=topbar('附件',false)+`<main class="content"><div class="empty">正在讀取附件…</div></main>`;const all=await getAllAttachments();if(route.tab!=='attachments')return;const owners=attachmentOwnerIndex(),byTrip=new Map(),orphans=[];for(const a of all){const o=owners.get(a.itemId);if(!o){orphans.push(a);continue}if(!byTrip.has(o.tripId))byTrip.set(o.tripId,new Map());const m=byTrip.get(o.tripId);if(!m.has(a.itemId))m.set(a.itemId,{owner:o,files:[]});m.get(a.itemId).files.push(a)}const scoped=route.tripId?tripById(route.tripId):null;if(scoped){const rows=[...(byTrip.get(scoped.id)?.values()||[])];screen.innerHTML=topbar('附件',false)+`<main class="content">${rows.length?rows.map(r=>attachmentOverviewRow(r.owner,r.files)).join(''):'<div class="empty">這趟旅程目前沒有附件。可從行程、住宿、交通／票券或備選地點加入。</div>'}</main>`;return}const groups=[];for(const t of data.trips||[]){const rows=[...(byTrip.get(t.id)?.values()||[])];if(rows.length)groups.push(`<section class="global-group"><div class="trip-scope-head"><div class="trip-scope-title">${esc(t.name)}</div><div class="trip-scope-count">${rows.reduce((n,r)=>n+r.files.length,0)} 個附件</div></div>${rows.map(r=>attachmentOverviewRow(r.owner,r.files)).join('')}</section>`)}if(orphans.length)groups.push(`<section class="global-group"><div class="trip-scope-head"><div class="trip-scope-title">未分類附件</div><div class="trip-scope-count">${orphans.length} 個</div></div>${orphans.map(a=>attachHtml(a)).join('')}</section>`);screen.innerHTML=topbar('附件',false)+`<main class="content">${groups.length?groups.join(''):'<div class="empty">目前沒有附件。可從行程、住宿、交通／票券或備選地點加入。</div>'}</main>`}
function blobToDataURL(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function dataURLToBlob(url){const r=await fetch(url);return r.blob()}
async function backupAll(){const files=[];for(const a of await getAllAttachments())files.push({...a,blob:await blobToDataURL(a.blob)});downloadBlob(new Blob([JSON.stringify({version:2,data,files},null,2)],{type:'application/json'}),`阿喬旅行筆記本_${new Date().toISOString().slice(0,10)}.backup.json`)}
let pendingRestoreFile=null;$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;pendingRestoreFile=f;dlg('還原 App 資料',`<p>還原會覆蓋目前 App 的旅程資料。</p><div class="subtle">備份檔：${esc(f.name)}</div>`,`<button class="secondary" onclick="pendingRestoreFile=null;closeDlg()">取消</button><button class="dangerbtn" onclick="confirmRestore()">確定還原</button>`)});async function confirmRestore(){const f=pendingRestoreFile;if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.data?.trips)throw 0;data=migrateData(obj.data);saveData();const dbase=await db();await new Promise(res=>{const tx=dbase.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res});for(const a of obj.files||[]){a.blob=await dataURLToBlob(a.blob);await putAttachment(a)}pendingRestoreFile=null;route={tab:'trips',tripId:null,dayId:null};closeDlg();render();syncNativeReminders();dlg('還原完成','<p>App 資料已還原。</p>',`<button class="primary" onclick="closeDlg()">完成</button>`)}catch(err){dlg('無法還原','<p>這不是有效的備份檔。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`)}}
async function tripAttachmentIds(t){const ids=new Set([...(t.stays||[]).map(x=>x.id),...(t.passes||[]).map(x=>x.id),...(t.alternatives||[]).map(x=>x.id)]);for(const d of t.days||[])for(const it of d.items||[])ids.add(it.id);return ids}
async function exportTravelPack(){const t=currentMemoTrip();if(!t){dlg('請先選旅程','<p>請先進入要匯出的旅程，再到設定匯出。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`);return}const ids=await tripAttachmentIds(t),files=[];for(const a of await getAllAttachments()){if(ids.has(a.itemId))files.push({...a,blob:await blobToDataURL(a.blob)})}const pack={format:'ajo.travel',version:1,created:new Date().toISOString(),trip:structuredClone(t),files};const safe=(t.name||'旅程').replace(/[\\/:*?"<>|]/g,'_');await downloadBlob(new Blob([JSON.stringify(pack)],{type:'application/json'}),`${safe}.ajo.json`)}
function validTargetIds(t){const ids=new Set([...(t.stays||[]).map(x=>x.id),...(t.passes||[]).map(x=>x.id),...(t.alternatives||[]).map(x=>x.id)]);for(const d of t.days||[])for(const i of d.items||[])ids.add(i.id);return ids}
function mergeTripUpdate(oldTrip,incoming){const t=migrateData({font:data.font,trips:[structuredClone(incoming)]}).trips[0];t.memo=t.memo||oldTrip.memo||'';t.reminders=structuredClone(oldTrip.reminders||[]);const seen=new Set((t.alternatives||[]).map(a=>a.id));t.alternatives=[...(t.alternatives||[]),...(oldTrip.alternatives||[]).filter(a=>!seen.has(a.id)).map(a=>structuredClone(a))];for(const d of t.days||[]){const old=(oldTrip.days||[]).find(x=>x.id===d.id)||(oldTrip.days||[]).find(x=>x.date===d.date);if(old){if((old.costs||[]).length)d.costs=structuredClone(old.costs);if(old.memo)d.memo=old.memo}}const valid=validTargetIds(t);t.reminders=t.reminders.filter(r=>r.targetType==='trip'||valid.has(r.targetId));return t}
function remapTripPack(obj){const t=structuredClone(obj.trip),map=new Map(),oldTrip=t.id;t.id=uid();map.set(oldTrip,t.id);for(const st of t.stays||[]){const o=st.id;st.id=uid();map.set(o,st.id)}for(const p of t.passes||[]){const o=p.id;p.id=uid();map.set(o,p.id)}for(const a of t.alternatives||[]){const o=a.id;a.id=uid();map.set(o,a.id)}for(const d of t.days||[]){const od=d.id;d.id=uid();map.set(od,d.id);for(const i of d.items||[]){const oi=i.id;i.id=uid();map.set(oi,i.id)}}for(const r of t.reminders||[]){r.id=uid();if(r.dayId&&map.has(r.dayId))r.dayId=map.get(r.dayId);if(r.targetId&&map.has(r.targetId))r.targetId=map.get(r.targetId)}const files=(obj.files||[]).map(a=>({...a,id:uid(),itemId:map.get(a.itemId)||a.itemId}));return {trip:t,files}}

let pendingTripImport=null;$('#tripImportFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='ajo.travel'||!obj.trip?.id||!Array.isArray(obj.trip.days))throw 0;pendingTripImport=obj;const exists=data.trips.some(t=>t.id===obj.trip.id);const foot=exists?`<button class="secondary" onclick="pendingTripImport=null;closeDlg()">取消</button><button class="secondary" onclick="confirmTripImport('copy')">另存副本</button><button class="primary" onclick="confirmTripImport('update')">更新原旅程</button>`:`<button class="secondary" onclick="pendingTripImport=null;closeDlg()">取消</button><button class="primary" onclick="confirmTripImport('new')">匯入</button>`;dlg('匯入旅程',`<p>${esc(obj.trip.name)}</p><div class="subtle">${esc(obj.trip.start||'')} ～ ${esc(obj.trip.end||'')}</div>${exists?'<p style="margin-top:12px">已找到同一趟旅程。更新時會保留手機上的花費、旅程備忘與提醒。</p>':''}`,foot)}catch(err){dlg('無法匯入','<p>這不是有效的自助旅行筆記旅程檔。</p>',`<button class="primary" onclick="closeDlg()">知道了</button>`)}})
async function confirmTripImport(mode='new'){const obj=pendingTripImport;if(!obj)return;let trip,files=obj.files||[];const old=data.trips.find(t=>t.id===obj.trip.id);if(mode==='copy'){const x=remapTripPack(obj);trip=migrateData({font:data.font,trips:[x.trip]}).trips[0];files=x.files;data.trips.push(trip)}else if(old&&mode==='update'){trip=mergeTripUpdate(old,obj.trip);data.trips=data.trips.map(t=>t.id===old.id?trip:t)}else{trip=migrateData({font:data.font,trips:[obj.trip]}).trips[0];data.trips.push(trip)}for(const a0 of files){const a={...a0};a.blob=await dataURLToBlob(a.blob);await putAttachment(a)}data.currentTripId=trip.id;saveData();pendingTripImport=null;route={tab:'trips',tripId:trip.id,dayId:null};syncNativeReminders();closeDlg();render();dlg('匯入完成',`<p>「${esc(trip.name)}」已匯入。</p>`,`<button class="primary" onclick="closeDlg()">完成</button>`)}
function androidBack(){if(document.querySelector('#dialog')?.open){closeDlg();return true}if(route.dayId){route.dayId=null;renderTrip();return true}if(route.tripId){route.tripId=null;route.dayId=null;renderTrips();return true}if(route.tab!=='trips'){route.tab='trips';render();return true}return false}
function exportTrip(){const t=currentMemoTrip();if(!t)return;const stays=(t.stays||[]).map(st=>`<div class="row">🏨 ${esc(st.name)}｜${st.start} → ${st.end}${st.breakfast&&st.breakfast!=='未設定'?`｜早餐：${esc(st.breakfast)}`:''}${st.note?`<br><small>${esc(st.note)}</small>`:''}</div>`).join('');const passes=(t.passes||[]).map(p=>`<div class="row">🎫 ${esc(p.name)}｜${p.start} → ${p.end}${p.note?`<br><small>${esc(p.note)}</small>`:''}</div>`).join('');const alternatives=(t.alternatives||[]).map(a=>`<div class="row">${esc(a.type||'備選')}｜${esc(a.title)}${a.area?`｜${esc(a.area)}`:''}${a.note?`<br><small>${esc(a.note)}</small>`:''}</div>`).join('');const html=`<!doctype html><meta charset="utf-8"><title>${esc(t.name)}</title><style>body{font-family:sans-serif;max-width:800px;margin:30px auto;line-height:1.7}h1{border-bottom:5px solid #ffd600}.day{margin:22px 0}.row{padding:6px 0;border-bottom:1px solid #ddd}</style><h1>${esc(t.name)}</h1><p>${t.start} ～ ${t.end}</p><h2>住宿</h2>${stays||'<p>無</p>'}<h2>交通／票券</h2>${passes||'<p>無</p>'}<h2>備選地點</h2>${alternatives||'<p>無</p>'}${[...t.days].sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<section class="day"><h2>${d.date}｜${esc(d.city)}</h2>${[...d.items].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).map(i=>`<div class="row">${esc(i.time||'')}　${esc(i.title)}${i.note?`<br><small>${esc(i.note)}</small>`:''}</div>`).join('')}${(d.costs||[]).length?`<h3>餐食與花費</h3>${d.costs.map(c=>`<div class="row">${esc(c.category)}｜${esc(c.note||'')}｜${esc(c.amount||'')} ${esc(d.currency||'')}</div>`).join('')}`:''}</section>`).join('')}<h2>旅行備忘錄</h2><pre style="white-space:pre-wrap">${esc(t.memo||'')}</pre>`;downloadBlob(new Blob([html],{type:'text/html'}),`${t.name}.html`)}
async function downloadBlob(blob,name){if(window.Android&&Android.saveBase64File){try{const url=await blobToDataURL(blob);Android.saveBase64File(name,blob.type||'application/octet-stream',url);return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
applyStartupRoute();render();setTimeout(syncNativeReminders,600);setTimeout(refreshSpendRates,900);
</script>
