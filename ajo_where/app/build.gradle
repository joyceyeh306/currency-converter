plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.ajo.whereami'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.ajo.whereami'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.0.13'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
