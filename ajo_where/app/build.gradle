plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.ajo.whereami'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.ajo.whereami'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.0.8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
