<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ㄚ喬在哪裡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260924c">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=20260924c">
<link rel="shortcut icon" href="./apple-touch-icon.png?v=20260924c">
<title>ㄚ喬在哪裡</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#18304e;background:#f6faff}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(#eaf4ff,#f8fbff 220px);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:auto;padding:22px 0 30px}.title{font-size:32px;font-weight:800;letter-spacing:.5px}.sub{color:#667b94;margin:4px 0 18px}
.card{background:white;border:1px solid #dce8f5;border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(42,85,130,.08)}
.status{font-size:20px;font-weight:750}.time,.meta{color:#64758a;margin-top:7px}.map{width:100%;height:48vh;min-height:320px;border:0;border-radius:16px;margin-top:16px;background:#edf3f8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px 10px;font-weight:700}.primary{background:#2b6cb0;color:white}.secondary{background:white;color:#2b6cb0;border:1px solid #b8d0e8}
.notice{margin-top:14px;color:#7a8796;font-size:13px;line-height:1.55}.bad{color:#a43f3f}.good{color:#1d6b46}.setup{margin-top:14px}.setup input{width:100%;font-size:16px;padding:13px;border:1px solid #cfddea;border-radius:12px}.setup button{margin-top:10px;width:100%;padding:13px;border:0;border-radius:12px;background:#2b6cb0;color:white;font-size:16px;font-weight:700}
.hidden{display:none}
.navsheet{position:fixed;inset:0;background:rgba(16,31,50,.36);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
.navpanel{width:min(100%,560px);background:#fff;border-radius:22px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.22)}
.navtitle{font-size:20px;font-weight:800;text-align:center;margin:2px 0 14px}
.navchoice{width:100%;border:1px solid #d8e4f0;background:#fff;border-radius:14px;padding:15px 14px;font-size:17px;font-weight:700;color:#18304e;margin-top:10px}
.navcancel{width:100%;border:0;background:#eef4fa;border-radius:14px;padding:14px;font-size:16px;color:#526980;margin-top:12px}
.navsheet.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">ㄚ喬在哪裡</div>
  <div class="sub">給人類看的私人定位</div>
  <div class="card">
    <div id="status" class="status">正在讀取位置…</div>
    <div id="time" class="time"></div>
    <div id="meta" class="meta"></div>
    <div id="setup" class="setup hidden">
      <input id="codeInput" placeholder="貼上ㄚ喬手機上的私人代碼">
      <button onclick="saveCode()">開始查看</button>
    </div>
    <iframe id="map" class="map hidden" loading="lazy" referrerpolicy="no-referrer"></iframe>
    <div id="actions" class="actions hidden">
      <a id="nav" class="btn primary" href="#" onclick="openNavChooser();return false">導航去找ㄚ喬</a>
      <a class="btn secondary" href="#" onclick="refreshNow();return false">重新整理</a>
    </div>
    <div class="notice">只顯示最新位置。若超過 15 分鐘沒有更新，頁面會特別提醒。把這個網頁加入 iPhone 主畫面後，就可以當成「ㄚ喬在哪裡」App 使用。</div>
  </div>
</div>
<div id="navsheet" class="navsheet hidden" onclick="if(event.target===this)closeNavChooser()">
  <div class="navpanel">
    <div class="navtitle">選擇導航地圖</div>
    <button class="navchoice" onclick="openGoogleMaps()">Google Maps</button>
    <button class="navchoice" onclick="openAppleMaps()">Apple 地圖</button>
    <button class="navcancel" onclick="closeNavChooser()">取消</button>
  </div>
</div>
<script>
const qs=new URLSearchParams(location.search); const fromUrl=qs.get('code');
if(fromUrl){localStorage.setItem('ajoWhereCode',fromUrl); history.replaceState({},'',location.pathname)}
let code=localStorage.getItem('ajoWhereCode')||'';
let latestLat=null, latestLon=null;
function openNavChooser(){if(latestLat===null||latestLon===null)return;document.getElementById('navsheet').classList.remove('hidden')}
function closeNavChooser(){document.getElementById('navsheet').classList.add('hidden')}
function openGoogleMaps(){if(latestLat===null||latestLon===null)return;const u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(latestLat+','+latestLon);window.location.href=u}
function openAppleMaps(){if(latestLat===null||latestLon===null)return;const u='https://maps.apple.com/?daddr='+encodeURIComponent(latestLat+','+latestLon);window.location.href=u}
function saveCode(){const v=document.getElementById('codeInput').value.trim();if(!v)return;localStorage.setItem('ajoWhereCode',v);code=v;document.getElementById('setup').classList.add('hidden');refreshNow()}
function showSetup(){document.getElementById('setup').classList.remove('hidden');document.getElementById('map').classList.add('hidden');document.getElementById('actions').classList.add('hidden');document.getElementById('status').textContent='需要私人代碼';document.getElementById('time').textContent='請用ㄚ喬手機 App 複製查看網址，或貼上私人代碼。'}
function fmtAgo(ms){const s=Math.max(0,Math.floor(ms/1000));if(s<60)return s+' 秒前';const m=Math.floor(s/60);if(m<60)return m+' 分鐘前';const h=Math.floor(m/60);return h+' 小時前'}
function num(v,n){return Number(v).toFixed(n)}
async function refreshNow(){
 if(!code){showSetup();return}
 const st=document.getElementById('status'); st.textContent='正在讀取位置…'; st.className='status';
 try{
   const r=await fetch('https://ntfy.sh/'+encodeURIComponent(code)+'/json?poll=1&since=all&title=ajo-location',{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const txt=await r.text(); const rows=txt.split(/\n+/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch(e){return null}}).filter(Boolean);
   const msgs=rows.filter(x=>x.event==='message'&&x.message).sort((a,b)=>(a.time||0)-(b.time||0));
   if(!msgs.length){st.textContent='尚未收到ㄚ喬的位置';document.getElementById('time').textContent='請確認 OPPO 上已按「開始分享位置」。';return}
   const p=JSON.parse(msgs[msgs.length-1].message); const lat=Number(p.lat),lon=Number(p.lon),t=Number(p.time||0); const age=Date.now()-t;
   latestLat=lat; latestLon=lon;
   st.textContent=age>15*60*1000?'⚠︎ 位置已超過 15 分鐘沒更新':'● ㄚ喬的位置已更新'; st.className='status '+(age>15*60*1000?'bad':'good');
   const d=new Date(t); document.getElementById('time').textContent='最後更新：'+d.toLocaleString('zh-TW')+'（'+fmtAgo(age)+'）';
   const bits=[]; if(Number.isFinite(p.battery)&&p.battery>=0)bits.push('電量 '+p.battery+'%'); if(Number.isFinite(p.accuracy))bits.push('精度約 '+Math.round(p.accuracy)+' m'); bits.push(num(lat,5)+', '+num(lon,5)); document.getElementById('meta').textContent=bits.join('　');
   const pad=.006; const bbox=[lon-pad,lat-pad*0.65,lon+pad,lat+pad*0.65].join(',');
   const map=document.getElementById('map'); map.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+encodeURIComponent(lat+','+lon); map.classList.remove('hidden');
   document.getElementById('actions').classList.remove('hidden');
 }catch(e){st.textContent='讀取位置失敗';st.className='status bad';document.getElementById('time').textContent='請檢查網路後再重新整理。'}
}
refreshNow();setInterval(refreshNow,60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
